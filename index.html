        if (fog[frow + (x >> 2)] !== 255 && this.fogged(x, y)) { buf[o + xx] = this.fogColor(x, y); continue; }
        const c = cells[i], t = c & MASK;
        if (!t) { buf[o + xx] = y < surf[x] ? skyC : caveC; continue; }
        if (t === T.RELIC) { buf[o + xx] = rpal[dmg[i]]; continue; }
        if (t === T.GOLD) { buf[o + xx] = this.goldColor(i, x, y); continue; }
        const d = dmg[i];
        buf[o + xx] = pal[(t << 5) | ((c >> 7) << 4) | ((d ? stage[(t << 8) | d] : 0) << 2) | shade[srow | (x & 255)]];
      }
    }
    ctx.putImageData(this.tileImg, 0, 0, 0, 0, w, h);
  };

  R.renderOvBlock = function (tx, ty) {
    const B = TL / OV, x0 = tx * TL, y0 = ty * TL;
    const w = Math.min(B, Math.ceil((W - x0) / OV)), h = Math.min(B, Math.ceil((H - y0) / OV));
    const buf = this.ovBuf, cells = this.w.cells, surf = this.w.surface, dmg = this.w.dmg, rpal = this.relicPal;
    const pal = this.pal, shade = this.shade, sky = this.sky, cave = this.cave;
    for (let oy = 0; oy < h; oy++) {
      for (let ox = 0; ox < w; ox++) {
        let r = 0, g = 0, b = 0, n = 0;
        for (let sy = 0; sy < OV; sy++) {
          const y = y0 + oy * OV + sy;
          if (y >= H) continue;
          for (let sx = 0; sx < OV; sx++) {
            const x = x0 + ox * OV + sx;
            if (x >= W) continue;
            const i = y * W + x, cv = cells[i], t = cv & MASK;
            const c = this.w.fog[(y >> 2) * this.w.FW + (x >> 2)] < 128 ? this.fogColor(x, y) : !t ? (y < surf[x] ? sky[y] : cave[y])
              : t === T.RELIC ? rpal[dmg[i]]
              : t === T.GOLD ? this.goldColor(i, x, y)
              : pal[(t << 5) | ((cv >> 7) << 4) | shade[((y & 255) << 8) | (x & 255)]];
            r += c & 255; g += (c >> 8) & 255; b += (c >> 16) & 255; n++;
          }
        }
        buf[oy * B + ox] = pack(r / n, g / n, b / n);
      }
    }
    this.ovCtx.putImageData(this.ovImg, tx * B, ty * B, 0, 0, w, h);
  };

  // Rebuild every overview block (used once while loading). Returns a promise.
  R.buildOverview = async function (onProgress) {
    const sim = this.sim, tx = sim.tilesX, ty = sim.tilesY;
    for (let y = 0; y < ty; y++) {
      for (let x = 0; x < tx; x++) { this.renderOvBlock(x, y); sim.ovDirty[y * tx + x] = 0; }
      if (onProgress) onProgress((y + 1) / ty);
      if (y % 4 === 3) await new Promise(r => setTimeout(r, 0));
    }
  };

  R.getTile = function (k) {
    let e = this.cache.get(k);
    if (e) { this.cache.delete(k); this.cache.set(k, e); return e; }
    if (this.cache.size >= CACHE_MAX) {
      const oldK = this.cache.keys().next().value;
      this.pool.push(this.cache.get(oldK));
      this.cache.delete(oldK);
    }
    e = this.pool.pop();
    if (!e) {
      const cv = document.createElement('canvas');
      cv.width = TL; cv.height = TL;
      e = { cv, ctx: cv.getContext('2d') };
    }
    e.fresh = true;
    this.cache.set(k, e);
    return e;
  };

  R.draw = function (dt) {
    this.time += dt;
    const ctx = this.ctx, c = this.cam, z = c.z, dpr = this.dpr, sim = this.sim;
    const hw = this.cssW / 2, hh = this.cssH / 2;
    const toDX = wx => Math.round(((wx - c.x) * z + hw) * dpr);
    const toDY = wy => Math.round(((wy - c.y) * z + hh) * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#0b0a10';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    const vx0 = Math.max(0, c.x - hw / z), vx1 = Math.min(W, c.x + hw / z);
    const vy0 = Math.max(0, c.y - hh / z), vy1 = Math.min(H, c.y + hh / z);
    const tx0 = Math.floor(vx0 / TL), tx1 = Math.min(sim.tilesX - 1, Math.floor((vx1 - 0.001) / TL));
    const ty0 = Math.floor(vy0 / TL), ty1 = Math.min(sim.tilesY - 1, Math.floor((vy1 - 0.001) / TL));
    const visible = [];
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) visible.push(ty * sim.tilesX + tx);
    const useOv = z < OV_ZOOM || visible.length > CACHE_MAX - 20;
    // Redraws get a time budget per frame and take turns, so a slow phone
    // refreshes busy areas less often instead of dropping frames.
    const rot = this.rot = (this.rot + 7) | 0;
    const order = k => visible[(k + rot) % visible.length];

    // Overview: refresh what is in view, then draw it as the backdrop.
    let deadline = performance.now() + (useOv ? 5 : 1.5);
    for (let q = 0; q < visible.length && performance.now() < deadline; q++) {
      const k = order(q);
      if (sim.ovDirty[k]) { this.renderOvBlock(k % sim.tilesX, (k / sim.tilesX) | 0); sim.ovDirty[k] = 0; }
    }
    {
      const dx0 = toDX(vx0), dy0 = toDY(vy0), dx1 = toDX(vx1), dy1 = toDY(vy1);
      ctx.drawImage(this.ov, vx0 / OV, vy0 / OV, (vx1 - vx0) / OV, (vy1 - vy0) / OV, dx0, dy0, dx1 - dx0, dy1 - dy0);
    }

    if (!useOv) {
      deadline = performance.now() + 6;
      for (let q = 0; q < visible.length; q++) {
        const k = order(q);
        if (this.cache.has(k) && !sim.tileDirty[k]) continue;
        if (performance.now() > deadline) continue;
        this.renderTile(k % sim.tilesX, (k / sim.tilesX) | 0, this.getTile(k).ctx);
        sim.tileDirty[k] = 0;
      }
      for (const k of visible) {
        if (!this.cache.has(k)) continue;        // not drawn yet: the overview shows through
        const e = this.getTile(k);
        const x0 = (k % sim.tilesX) * TL, y0 = ((k / sim.tilesX) | 0) * TL;
        const w = Math.min(TL, W - x0), h = Math.min(TL, H - y0);
        const dx0 = toDX(x0), dy0 = toDY(y0);
        ctx.drawImage(e.cv, 0, 0, w, h, dx0, dy0, toDX(x0 + w) - dx0, toDY(y0 + h) - dy0);
      }
    }

    this.drawGold(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawParticles(ctx, dt, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawBalls(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawDrop(ctx, toDX, toDY);
    this.drawFloats(ctx, dt, toDX, toDY);
    if (this.radar >= 2 && !sim.s.found) this.drawZone(ctx, toDX, toDY);
  };

  R.drawBalls = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, n = sim.n, bx = sim.bx, by = sim.by, bt = sim.bt, z = this.cam.z, dpr = this.dpr;
    const size = Math.max(2, Math.min(7, z * 1.1)) * dpr, half = size / 2;
    const m = 4 / z;
    const outline = z >= 2;
    for (let t = 0; t < D.BALLS.length; t++) {
      if (outline) {
        ctx.fillStyle = 'rgba(8,6,12,0.75)';
        for (let k = 0; k < n; k++) {
          if (bt[k] !== t) continue;
          const x = bx[k], y = by[k];
          if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
          ctx.fillRect(toDX(x) - half - dpr, toDY(y) - half - dpr, size + 2 * dpr, size + 2 * dpr);
        }
      }
      ctx.fillStyle = D.BALLS[t].color;
      for (let k = 0; k < n; k++) {
        if (bt[k] !== t) continue;
        const x = bx[k], y = by[k];
        if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
        ctx.fillRect(toDX(x) - half, toDY(y) - half, size, size);
      }
    }
  };

  R.drawParticles = function (ctx, dt, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, z = this.cam.z;
    if (this.particles && z >= 1.5) {
      for (let f = 0; f < sim.fxn && this.parts.length < 320; f++) {
        const i = sim.fxI[f], x = i % W, y = (i / W) | 0;
        if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
        const col = MAT[sim.fxT[f]].col;
        this.parts.push({ x: x + 0.5, y: y + 0.5, vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 25 - 5, life: 0.5 + Math.random() * 0.3,
          col: `rgb(${col[0]},${col[1]},${col[2]})` });
      }
    }
    sim.fxn = 0;
    const size = Math.max(1, z * 0.7) * this.dpr;
    const keep = [];
    for (const p of this.parts) {
      p.life -= dt;
      if (p.life <= 0) continue;
      p.vy += 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.col;
      ctx.fillRect(toDX(p.x) - size / 2, toDY(p.y) - size / 2, size, size);
      keep.push(p);
    }
    ctx.globalAlpha = 1;
    this.parts = keep;
  };

  R.drawGold = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const s = this.sim.s, g = this.w.gold;
    if (s.found || g.x < vx0 - 20 || g.x > vx1 + 20 || g.y < vy0 - 20 || g.y > vy1 + 20) return;
    if (!this.exposed(g.x, g.y) || this.fogAt(g.x, g.y) < 128) return;
    const cx = toDX(g.x + 0.5), cy = toDY(g.y + 0.5), dpr = this.dpr;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 5);
    ctx.strokeStyle = `rgba(255,214,64,${0.45 + 0.5 * pulse})`;
    ctx.lineWidth = 2 * dpr;
    const r = (10 + 6 * pulse) * dpr;
    ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
  };

  // "+bits" numbers that drift up from a tap and fade.
  R.float = function (x, y, text) {
    if (this.floats.length > 24) this.floats.shift();
    this.floats.push({ x, y, text, t: 0 });
  };
  R.drawFloats = function (ctx, dt, toDX, toDY) {
    if (!this.floats.length) return;
    const dpr = this.dpr, keep = [];
    ctx.save();
    ctx.font = `700 ${16 * dpr}px 'Pixelify Sans', sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3 * dpr;
    ctx.strokeStyle = 'rgba(11,10,16,0.85)';
    for (const f of this.floats) {
      f.t += dt;
      if (f.t > 1) continue;
      const x = toDX(f.x), y = toDY(f.y) - (12 + 36 * f.t) * dpr;
      ctx.globalAlpha = f.t < 0.6 ? 1 : 1 - (f.t - 0.6) / 0.4;
      ctx.strokeText(f.text, x, y);
      ctx.fillStyle = '#ffd640';
      ctx.fillText(f.text, x, y);
      keep.push(f);
    }
    ctx.restore();
    this.floats = keep;
  };

  R.drawDrop = function (ctx, toDX, toDY) {
    const d = this.sim.s.drop, dpr = this.dpr;
    const x = toDX(d.x), y = toDY(d.y), r = 7 * dpr, gap = 3 * dpr;
    ctx.strokeStyle = 'rgba(236,230,216,0.85)';
    ctx.lineWidth = 1.5 * dpr;
    ctx.beginPath();
    ctx.moveTo(x - r, y); ctx.lineTo(x - gap, y);
    ctx.moveTo(x + gap, y); ctx.lineTo(x + r, y);
    ctx.moveTo(x, y - r); ctx.lineTo(x, y - gap);
    ctx.moveTo(x, y + gap); ctx.lineTo(x, y + r);
    ctx.stroke();
  };

  // The radar's search ring: the gold is somewhere inside it.
  R.drawZone = function (ctx, toDX, toDY) {
    const zn = this.sim.radarZone(this.radar), dpr = this.dpr;
    if (!zn) return;
    const cx = toDX(zn.x), cy = toDY(zn.y), r = zn.r * this.cam.z * dpr;
    ctx.save();
    ctx.lineWidth = 2 * dpr;
    ctx.setLineDash([7 * dpr, 6 * dpr]);
    ctx.lineDashOffset = -this.time * 8 * dpr;
    ctx.strokeStyle = 'rgba(11,10,16,0.7)';
    ctx.beginPath(); ctx.arc(cx, cy, r + dpr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,214,64,0.85)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  };

  PQ.Renderer = Renderer;
})();

</script>
<script>
// Pixel Quarry: touch and mouse. One finger pans, two fingers pinch-zoom,
// a tap acts on the world, and holding still on rock keeps digging.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const MOVE_PX = 9, TAP_MS = 350, HOLD_S = 0.3, HOLD_EVERY = 0.11;

  function Input(canvas, renderer, handlers) {
    this.r = renderer;
    this.h = handlers;
    this.ptr = new Map();
    this.pinch = null;
    this.holdT = 0;
    this.repeatT = 0;

    const pos = e => {
      const b = canvas.getBoundingClientRect();
      return { x: e.clientX - b.left, y: e.clientY - b.top };
    };

    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      this.ptr.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, t: performance.now(), moved: false });
      this.holdT = 0; this.repeatT = 0;
      if (this.ptr.size === 2) {
        const [a, b] = [...this.ptr.values()];
        a.moved = b.moved = true;
        this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      }
    });

    canvas.addEventListener('pointermove', e => {
      const q = this.ptr.get(e.pointerId);
      if (!q) return;
      const p = pos(e);
      if (this.ptr.size === 1) {
        if (!q.moved && Math.hypot(p.x - q.sx, p.y - q.sy) > MOVE_PX) q.moved = true;
        if (q.moved) this.r.pan(p.x - q.x, p.y - q.y);
        q.x = p.x; q.y = p.y;
      } else if (this.ptr.size === 2 && this.pinch) {
        q.x = p.x; q.y = p.y;
        const [a, b] = [...this.ptr.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        if (this.pinch.d > 0 && d > 0) this.r.zoomAt(d / this.pinch.d, mx, my);
        this.r.pan(mx - this.pinch.mx, my - this.pinch.my);
        this.pinch = { d, mx, my };
      }
    });

    const end = e => {
      const q = this.ptr.get(e.pointerId);
      if (!q) return;
      this.ptr.delete(e.pointerId);
      if (e.type === 'pointerup' && this.ptr.size === 0 && !q.moved && performance.now() - q.t < TAP_MS && this.holdT < HOLD_S) {
        this.h.tap(this.r.toWorld(q.x, q.y));
      }
      if (this.ptr.size < 2) this.pinch = null;
      for (const o of this.ptr.values()) o.moved = true;   // no tap right after a pinch
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const p = pos(e);
      this.r.zoomAt(Math.exp(-e.deltaY * 0.0016), p.x, p.y);
    }, { passive: false });
  }

  // Called every frame: turns a still, held finger on rock into repeated digs.
  Input.prototype.update = function (dt) {
    if (this.ptr.size !== 1) return;
    const q = this.ptr.values().next().value;
    if (q.moved) return;
    this.holdT += dt;
    if (this.holdT < HOLD_S) return;
    this.repeatT -= dt;
    if (this.repeatT <= 0) {
      this.repeatT = HOLD_EVERY;
      this.h.hold(this.r.toWorld(q.x, q.y));
    }
  };

  PQ.Input = Input;
})();

</script>
<script>
// Pixel Quarry: saving. Progress (bits, upgrades) goes to localStorage as JSON.
// The world itself regenerates from its seed, so only the mined-pixel bitset and
// the balls are stored, compressed, in IndexedDB (localStorage as a fallback).
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const META = 'pixelquarry.meta.v1', WORLD_LS = 'pixelquarry.world.v1';

  function loadMeta() {
    try { const s = localStorage.getItem(META); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function saveMeta(state) {
    try { state.savedAt = Date.now(); localStorage.setItem(META, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  // Fill in anything an older save is missing.
  function migrate(meta) {
    const s = Object.assign(PQ.newState(meta.seed >>> 0), meta);
    s.owned = Object.assign(PQ.newState(0).owned, meta.owned);
    s.up = {};
    for (const b of PQ.DATA.BALLS) s.up[b.key] = Object.assign({ dmg: 0, spd: 0, sp: 0 }, (meta.up || {})[b.key]);
    s.global = Object.assign({ tap: 0, value: 0, radar: 0 }, meta.global);
    s.settings = Object.assign({ particles: true }, meta.settings);
    s.relics = Array.isArray(meta.relics) ? meta.relics : [];
    s.perks = Object.assign(PQ.newPerks(), meta.perks);
    if (!meta.unlocked) {                   // before unlocking by hand: anything owned is unlocked
      s.unlocked = { pebble: true };
      for (const b of PQ.DATA.BALLS) if (s.owned[b.key] > 0) s.unlocked[b.key] = true;
    }
    if (typeof meta.depth !== 'number') s.depth = s.stars || 0;   // before depth: one star per gold found
    return s;
  }

  async function pipe(u8, Stream, mode) {
    const out = await new Response(new Blob([u8]).stream().pipeThrough(new Stream(mode))).arrayBuffer();
    return new Uint8Array(out);
  }
  const canZip = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
  async function pack(u8) { return canZip ? { z: 1, d: await pipe(u8, CompressionStream, 'deflate-raw') } : { z: 0, d: u8 }; }
  async function unpack(p) { return p.z ? pipe(p.d, DecompressionStream, 'deflate-raw') : p.d; }

  function b64(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function unb64(str) {
    const s = atob(str), u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }

  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pixelquarry', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbPut(key, val) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(key) {
    const d = await db();
    return new Promise((res, rej) => {
      const r = d.transaction('kv').objectStore('kv').get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }

  async function worldRecord(world, sim) {
    const balls = sim.exportBalls();
    return { seed: world.seed, mined: await pack(world.mined), fog: await pack(world.fog), balls: new Uint8Array(balls.buffer.slice(0)) };
  }

  async function saveWorld(world, sim) {
    const rec = await worldRecord(world, sim);
    try { await idbPut('world', rec); return true; } catch (e) { /* fall through */ }
    try {
      localStorage.setItem(WORLD_LS, JSON.stringify({ seed: rec.seed, z: rec.mined.z, mined: b64(rec.mined.d), fog: b64(rec.fog.d), balls: b64(rec.balls) }));
      return true;
    } catch (e) { return false; }
  }

  async function loadWorld(seed) {
    let rec = null;
    try { rec = await idbGet('world'); } catch (e) { rec = null; }
    if (!rec) {
      try {
        const s = localStorage.getItem(WORLD_LS);
        if (s) { const j = JSON.parse(s); rec = { seed: j.seed, mined: { z: j.z, d: unb64(j.mined) }, fog: j.fog ? { z: j.z, d: unb64(j.fog) } : null, balls: unb64(j.balls) }; }
      } catch (e) { rec = null; }
    }
    if (!rec || rec.seed !== seed) return null;
    const balls = new Float32Array(rec.balls.buffer.slice(rec.balls.byteOffset, rec.balls.byteOffset + rec.balls.byteLength));
    return { mined: await unpack(rec.mined), fog: rec.fog ? await unpack(rec.fog) : null, balls };
  }

  async function clearWorld() {
    try { await idbPut('world', null); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(WORLD_LS); } catch (e) { /* ignore */ }
  }

  // A text save code that can be pasted into another device.
  async function exportCode(state, world, sim) {
    const rec = await worldRecord(world, sim);
    const body = JSON.stringify({ meta: state, z: rec.mined.z, mined: b64(rec.mined.d), fog: b64(rec.fog.d), balls: b64(rec.balls) });
    return 'PQ1:' + b64(new TextEncoder().encode(body));
  }

  async function importCode(code) {
    const text = String(code || '').trim();
    if (!text.startsWith('PQ1:')) throw new Error('That is not a Pixel Quarry save code. Codes start with PQ1:');
    let j;
    try { j = JSON.parse(new TextDecoder().decode(unb64(text.slice(4)))); } catch (e) { throw new Error('The save code is incomplete. Copy the whole code and try again.'); }
    if (!j.meta || typeof j.meta.seed !== 'number') throw new Error('The save code has no game in it.');
    const rec = { seed: j.meta.seed >>> 0, mined: { z: j.z, d: unb64(j.mined) }, fog: j.fog ? { z: j.z, d: unb64(j.fog) } : null, balls: unb64(j.balls) };
    try { await idbPut('world', rec); } catch (e) {
      localStorage.setItem(WORLD_LS, JSON.stringify({ seed: rec.seed, z: j.z, mined: j.mined, fog: j.fog, balls: j.balls }));
    }
    j.meta.savedAt = Date.now();
    localStorage.setItem(META, JSON.stringify(j.meta));
  }

  PQ.Save = { loadMeta, saveMeta, migrate, saveWorld, loadWorld, clearWorld, exportCode, importCode };
})();

</script>
<script>
// Pixel Quarry: the DOM layer. HUD, shop sheet, toasts and dialogs.
(function () {
  const PQ = window.PQ;
  const D = PQ.DATA, BALLS = D.BALLS;
  const $ = id => document.getElementById(id);
  const UNITS = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

  function fmt(n) {
    if (!isFinite(n)) return '—';
    if (n < 1000) return Math.floor(n).toLocaleString('en-US');
    let i = -1;
    while (n >= 999.5 && i < UNITS.length - 1) { n /= 1000; i++; }
    return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + UNITS[i];
  }
  function fmtTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
    return `${m}m ${String(s).padStart(2, '0')}s`;
  }
  const fmtX = m => m < 1000 ? String(+m.toFixed(2)) : fmt(m);   // multipliers keep their decimals
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function UI(game) {
    this.g = game;
    this.tab = 'balls';
    this.t = 0;
    this.toastT = 0;
    this.confirm = null;           // which inline confirm is open in the World tab
    this.shown = game.state.bits;  // the HUD counter rolls toward the real number
    this.build();
    this.bind();
  }
  const U = UI.prototype;

  U.build = function () {
    // Balls
    $('panel-balls').innerHTML = `
      <div class="buyrow"><span>Buy amount</span>
        <div class="buymode" id="buymode" role="group" aria-label="How many to buy">
          <button type="button" data-n="1">×1</button><button type="button" data-n="10">×10</button><button type="button" data-n="0">Max</button>
        </div></div>` + BALLS.map((b, t) => `
      <div class="row ball" id="ball-${t}">
        <span class="swatch" style="--c:${b.color}"></span>
        <div><div class="name"><span id="bn-${t}">${esc(b.name)}</span><span class="count" id="bc-${t}"></span></div>
          <div class="desc" id="bd-${t}">${esc(b.desc)}</div>
          <div class="prog" id="bp-${t}" hidden><i></i></div></div>
        <button type="button" class="buy" id="bb-${t}" data-act="ball" data-t="${t}"><span class="lbl">Buy</span><span class="cost">0</span></button>
      </div>`).join('');
    this.readySeen = new Set();
    this.mileSeen = BALLS.map(b => PQ.milestone(this.g.state.owned[b.key]).lv);
    this.shown = this.g.state.bits;

    // Upgrades: tools first, then one group per ball type (shown once owned)
    const toolRows = D.UP.map(u => `
      <div class="row plain" id="up-${u.key}">
        <div><div class="name">${esc(u.name)}<span class="lv"></span></div><div class="desc"></div></div>
        <button type="button" class="buy" data-act="up" data-key="${u.key}"><span class="lbl">Upgrade</span><span class="cost">0</span></button>
      </div>`).join('');
    const ballGroups = BALLS.map((b, t) => {
      const kinds = ['dmg', 'spd'].concat(b.special ? ['sp'] : []);
      return `<div id="ug-${t}" hidden>
        <div class="group-h"><span class="swatch" style="--c:${b.color}"></span>${esc(b.name)}</div>
        ${kinds.map(k => {
          const name = k === 'sp' ? b.special.name : D.BALL_UP[k].name;
          const desc = k === 'sp' ? b.special.desc : D.BALL_UP[k].desc;
          return `<div class="row plain" id="bu-${t}-${k}">
            <div><div class="name">${esc(name)}<span class="lv"></span></div><div class="desc">${esc(desc)}</div></div>
            <button type="button" class="buy" data-act="bup" data-t="${t}" data-kind="${k}"><span class="lbl">Upgrade</span><span class="cost">0</span></button>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
    $('panel-upgrades').innerHTML = `<div class="group-h">Tools</div>${toolRows}${ballGroups}`;

    // Stars: perks bought with stars, kept across worlds
    $('panel-stars').innerHTML = `<p class="note" id="starsNote"></p>` + D.STAR_PERKS.map(k => `
      <div class="row plain" id="pk-${k.key}">
        <div><div class="name">${esc(k.name)}<span class="lv"></span></div><div class="desc"></div></div>
        <button type="button" class="buy" data-act="perk" data-key="${k.key}"><span class="lbl">Buy</span><span class="cost">0</span></button>
      </div>`).join('');
    this.buildWorld();
  };

  // A perk's description at a level, with its value filled in.
  function perkText(k, lvl) {
    const v = k.vals[Math.min(lvl, k.vals.length - 1)];
    const shown = k.key === 'start' ? fmt(v) : k.key === 'cheap' || k.key === 'night' ? Math.round(v * 100) + '%'
      : k.key === 'tools' ? (v >= 1 ? 'all' : Math.round(v * 100) + '%') : v;
    return k.desc.replace('{v}', shown);
  }

  // What is new about a depth, for the toast and the World tab.
  U.depthNote = function (d) {
    if (d <= 0) return 'The gold sits in the bottom third.';
    const parts = [`The gold is buried deeper and rock takes ${Math.round((D.DEPTH.tough(d) - 1) * 100)}% more hits.`];
    if (D.DEPTH.magma(d) < 2) parts.push('Magma rock fills the bottom.');
    if (D.DEPTH.adamant(d) < 2) parts.push('Adamant lies under it.');
    return parts.join(' ');
  };

  U.buildWorld = function () {
    const s = this.g.state;
    const c = this.confirm;
    $('panel-world').innerHTML = `
      ${s.found ? `<div class="group-h">Golden Pixel found</div>
        <p class="note">Go down to depth ${s.depth + 1} and collect ${this.starWord(D.DEPTH.stars(s.depth))}. Balls and upgrades reset; stars and perks stay.</p>
        <div class="actions"><button type="button" class="btn gold" data-act="prestige">Go deeper</button></div>` : ''}
      <dl class="stats">
        <div><dt>Pixels broken</dt><dd id="st-broken">0</dd></div>
        <div><dt>World mined</dt><dd id="st-mined">0%</dd></div>
        <div><dt>Time here</dt><dd id="st-time">0m</dd></div>
        <div><dt>Depth</dt><dd id="st-depth">0</dd></div>
        <div><dt>Stars</dt><dd id="st-stars">0</dd></div>
        <div><dt>Earned here</dt><dd id="st-earned">0</dd></div>
        <div><dt>Earned ever</dt><dd id="st-life">0</dd></div>
        <div><dt>Relics found</dt><dd id="st-relics">0</dd></div>
      </dl>
      <div class="group-h">Settings</div>
      <label class="toggle"><input type="checkbox" id="optParticles" ${s.settings.particles ? 'checked' : ''}> Rock chips when pixels break</label>
      <div class="group-h">Save</div>
      <p class="note">The game saves on this device every few seconds. A save code moves it to another device.</p>
      <div class="actions">
        <button type="button" class="btn" data-act="copy-save">Copy save code</button>
        <button type="button" class="btn" data-act="show-load">Load a save code</button>
      </div>
      ${c === 'code' ? `<textarea id="saveCode" readonly aria-label="Your save code"></textarea>` : ''}
      ${c === 'load' ? `<textarea id="loadCode" aria-label="Paste a save code" placeholder="Paste a code that starts with PQ1:"></textarea>
        <div class="actions"><button type="button" class="btn gold" data-act="do-load">Load this save</button><button type="button" class="btn" data-act="cancel">Cancel</button></div>` : ''}
      <div class="group-h">Danger</div>
      ${c === 'wipe' ? `<div class="confirm"><p>This deletes this world, your balls and upgrades. Stars, perks and depth are kept.</p>
        <div class="actions"><button type="button" class="btn danger" data-act="do-wipe">Delete and start over</button><button type="button" class="btn" data-act="cancel">Keep playing</button></div></div>`
        : `<div class="actions"><button type="button" class="btn danger" data-act="wipe">Start over</button></div>`}
      <p class="note">Depth ${s.depth}: ${esc(this.depthNote(s.depth))} Seed ${s.seed}</p>`;
  };

  U.starWord = n => `${n} star${n === 1 ? '' : 's'}`;

  U.bind = function () {
    document.querySelector('.tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      const sheet = $('sheet');
      if (b.dataset.tab === this.tab) this.setOpen(!sheet.classList.contains('open'));
      else { this.showTab(b.dataset.tab); this.setOpen(true); }
    });
    $('grip').addEventListener('click', () => this.setOpen(!$('sheet').classList.contains('open')));
    $('sheetBody').addEventListener('click', e => {
      const b = e.target.closest('[data-n]');
      if (b) { this.g.state.buyMode = +b.dataset.n; this.refresh(); return; }
      this.act(e);
    });
    $('sheetBody').addEventListener('change', e => {
      if (e.target.id === 'optParticles') this.g.state.settings.particles = e.target.checked;
    });
    $('modal').addEventListener('click', e => this.act(e));
    $('btnDrop').addEventListener('click', () => this.g.renderer.lookAtDrop(this.g.state.drop, Math.max(this.g.renderer.cam.z, 3)));
    $('btnMap').addEventListener('click', () => this.g.renderer.lookAt(D.W / 2, D.H / 2, 0.01));
  };

  U.setOpen = function (open) {
    $('sheet').classList.toggle('open', open);
    $('grip').setAttribute('aria-expanded', open);
    $('grip').setAttribute('aria-label', open ? 'Hide shop' : 'Show shop');
  };

  U.showTab = function (tab) {
    this.tab = tab;
    document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    ['balls', 'upgrades', 'stars', 'world'].forEach(k => { $('panel-' + k).hidden = k !== tab; });
    if (tab === 'world') { this.buildWorld(); }
    this.refresh();
  };

  U.buyCount = function (t) {
    const m = this.g.state.buyMode;
    return m === 0 ? Math.max(1, this.g.sim.maxBuy(t)) : m;
  };

  U.act = async function (e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const g = this.g, sim = g.sim, s = g.state;
    switch (b.dataset.act) {
      case 'ball': {
        const t = +b.dataset.t;
        if (sim.canUnlock(t)) { if (sim.unlockBall(t)) this.reveal(t); }
        else sim.buyBall(t, this.buyCount(t));
        break;
      }
      case 'release': this.closeModal(); g.renderer.lookAtDrop(s.drop, Math.max(g.renderer.cam.z, 3)); break;
      case 'up': if (g.sim.buyUp(b.dataset.key) && b.dataset.key === 'radar') this.radarToast(); break;
      case 'perk': {
        const before = s.global.radar;
        if (sim.buyPerk(b.dataset.key) && s.global.radar > before) this.radarToast();
        break;
      }
      case 'bup': sim.buyBallUp(+b.dataset.t, b.dataset.kind); break;
      case 'prestige': this.closeModal(); g.newWorld(true); return;
      case 'keep': this.closeModal(); this.buildWorld(); break;
      case 'close': this.closeModal(); break;
      case 'wipe': this.confirm = 'wipe'; this.buildWorld(); break;
      case 'do-wipe': this.confirm = null; g.newWorld(false); return;
      case 'cancel': this.confirm = null; this.buildWorld(); break;
      case 'show-load': this.confirm = 'load'; this.buildWorld(); $('loadCode').focus(); break;
      case 'copy-save': {
        const code = await PQ.Save.exportCode(s, g.world, sim);
        this.confirm = 'code'; this.buildWorld();
        const ta = $('saveCode');
        ta.value = code;
        try { await navigator.clipboard.writeText(code); this.toast('Save code copied'); }
        catch (err) { ta.focus(); ta.select(); this.toast('Select the code below and copy it'); }
        break;
      }
      case 'do-load': {
        try { await PQ.Save.importCode($('loadCode').value); g.reload(); }
        catch (err) { this.toast(err.message, 4000); }
        return;
      }
    }
    this.refresh();
  };

  U.toast = function (msg, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    this.toastT = (ms || 2400) / 1000;
  };

  U.modal = function (html) {
    $('modalCard').innerHTML = html;
    $('modal').hidden = false;
    const f = $('modalCard').querySelector('button');
    if (f) f.focus();
  };
  U.closeModal = function () { $('modal').hidden = true; };

  U.welcome = function () {
    this.modal(`<h2>Somewhere down there is one Golden Pixel.</h2>
      <p>This world is 10,000,000 pixels deep. Your balls bounce around and break rock, and every broken pixel pays bits.</p>
      <ul>
        <li>Spend bits on more balls and upgrades.</li>
        <li>Tap rock to dig it yourself. Hold to keep digging.</li>
        <li>Tap open space to move the drop point, where new balls appear.</li>
        <li>The dark is unexplored rock. Balls light it up as they go, and relics are buried in it.</li>
        <li>Drag to look around. Pinch to zoom.</li>
      </ul>
      <div class="actions"><button type="button" class="btn gold" data-act="close">Start digging</button></div>`);
  };

  // A newly unlocked ball type, introduced.
  U.reveal = function (t) {
    const b = BALLS[t], sim = this.g.sim;
    const sp = b.special ? `<li>Special upgrade: <b>${esc(b.special.name)}</b>. ${esc(b.special.desc)}.</li>` : '';
    this.modal(`<div class="reveal" style="--c:${b.color}"><i></i></div>
      <p class="kicker">New ball unlocked</p>
      <h2>${esc(b.name)}</h2>
      <p class="sub">${esc(b.desc)}</p>
      <ul>
        <li>Damage ${fmt(sim.tDmg[t])} per hit, speed ${Math.round(sim.tSpd[t])} px/s.</li>
        ${sp}
        <li>Your first one is free. Its upgrades are in the Upgrades tab.</li>
      </ul>
      <div class="actions"><button type="button" class="btn gold" data-act="release">Release it</button></div>`);
  };

  U.radarToast = function () {
    const lv = this.g.state.global.radar;
    this.toast(lv === 1 ? 'Radar on. It senses the gold from your closest ball.'
      : lv === 2 ? 'Search zone ringed on the map. The gold is somewhere inside.' : 'Search zone narrowed.', 3200);
  };

  U.relic = function (e) {
    const n = this.g.state.relics.length, total = this.g.world.relics.length;
    this.toast(`Relic uncovered: ${e.name} (${n}/${total}). +${fmt(e.reward)} bits`, 3200);
  };

  U.offline = function (r) {
    if (r.gain < 1) return;
    this.modal(`<h2>Welcome back</h2>
      <p class="sub">Your balls kept working for ${fmtTime(r.seconds)}${r.seconds >= this.g.sim.offCap ? ' (the most they bank)' : ''}.</p>
      <div class="big">+${fmt(r.gain)}</div>
      <div class="actions"><button type="button" class="btn gold" data-act="close">Collect</button></div>`);
  };

  U.gold = function () {
    const s = this.g.state;
    this.modal(`<h2>You found the Golden Pixel.</h2>
      <p class="sub">One pixel out of 10,000,000, after ${fmtTime(s.foundTime)} in this world. It pays a finder's fee of</p>
      <div class="big">+${fmt(s.goldReward)}</div>
      <p>Go deeper to collect ${this.starWord(D.DEPTH.stars(s.depth))}. Every star adds +${D.STAR_BONUS * 100}% bits for good, and you can spend them on perks in the Stars tab. Depth ${s.depth + 1}: ${esc(this.depthNote(s.depth + 1))}</p>
      <div class="actions">
        <button type="button" class="btn gold" data-act="prestige">Go deeper</button>
        <button type="button" class="btn" data-act="keep">Keep mining here</button>
      </div>`);
  };

  U.setBuy = function (btn, cost, ok, label) {
    btn.disabled = !ok;
    btn.classList.toggle('afford', ok);
    btn.querySelector('.cost').textContent = isFinite(cost) ? fmt(cost) : 'Max';
    if (label) btn.querySelector('.lbl').textContent = label;
  };

  // Text and button states. Runs a few times a second, not every frame.
  U.refresh = function () {
    const g = this.g, s = g.state, sim = g.sim;
    $('rate').textContent = `+${fmt(s.rate)} /s`;
    $('ballCount').textContent = sim.n.toLocaleString('en-US');
    document.querySelectorAll('#buymode [data-n]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === s.buyMode));

    // Radar reads the ball nearest the gold.
    const radar = $('radar');
    radar.hidden = s.global.radar < 1;
    if (!radar.hidden) {
      if (s.found) { $('heat').style.width = '100%'; $('radarText').textContent = 'Found'; }
      else {
        const d = sim.goldDistance(), heat = Math.max(0, 1 - d / D.RADAR.range);
        $('heat').style.width = (heat * 100).toFixed(0) + '%';
        $('radarText').textContent = d < 120 ? 'Burning' : d < 350 ? 'Hot' : d < 750 ? 'Warm' : d < 1400 ? 'Cool' : 'Cold';
      }
    }

    let upAffordable = false;
    // Balls: bought, ready to unlock, the next goal (with progress), or still a mystery.
    let unlockAffordable = false;
    const full = sim.n >= D.MAX_BALLS;
    const next = BALLS.findIndex((b, t) => !sim.unlocked(t) && !sim.canUnlock(t));
    BALLS.forEach((b, t) => {
      const ready = sim.canUnlock(t), uCost = sim.unlockCost(t);
      if (ready) {
        unlockAffordable = unlockAffordable || (!full && uCost <= s.bits);
        if (!this.readySeen.has(t)) { this.readySeen.add(t); this.toast(`${b.name} is ready to unlock in the Balls tab.`, 3200); }
      }
      if (this.tab !== 'balls') return;
      const unlocked = sim.unlocked(t), hidden = !unlocked && !ready && t !== next;
      const row = $('ball-' + t);
      row.classList.toggle('locked', !unlocked && !ready);
      row.classList.toggle('ready', ready);
      row.classList.toggle('mystery', hidden);
      $('bn-' + t).textContent = hidden ? '???' : b.name;
      const own = s.owned[b.key], ms = PQ.milestone(own);
      $('bc-' + t).textContent = own ? `×${own.toLocaleString('en-US')}` : '';
      const prog = $('bp-' + t);
      prog.hidden = ready || hidden || (unlocked && !ms.next);
      if (unlocked) {
        const inc = sim.typeRate[t], mult = sim.tMult[t];
        $('bd-' + t).textContent = `+${fmt(inc)}/s` + (mult > 1 ? ` · earns ×${fmtX(mult)}` : '')
          + (ms.next ? ` · ${ms.next} owned: ×${D.MILESTONE_MULT}` : ' · every milestone reached');
        if (ms.next) prog.firstChild.style.width = (100 * (own - ms.prev) / (ms.next - ms.prev)).toFixed(1) + '%';
      }
      else if (ready) $('bd-' + t).textContent = b.desc;
      else if (hidden) $('bd-' + t).textContent = 'Keep digging to find out.';
      else {
        $('bd-' + t).textContent = `Earn ${fmt(b.unlock)} bits in this world: ${fmt(Math.min(s.earned, b.unlock))} so far.`;
        prog.firstChild.style.width = (100 * Math.min(1, s.earned / b.unlock)).toFixed(1) + '%';
      }
      if (ready) this.setBuy($('bb-' + t), uCost, !full && uCost <= s.bits, full ? 'World full' : 'Unlock');
      else if (unlocked) {
        const n = this.buyCount(t), cost = sim.ballCost(t, n);
        this.setBuy($('bb-' + t), cost, !full && cost <= s.bits, full ? 'World full' : `Buy ${n}`);
      } else {
        this.setBuy($('bb-' + t), uCost, false, 'Locked');
        if (hidden) $('bb-' + t).querySelector('.cost').textContent = '???';
      }
    });
    $('ballDot').hidden = !unlockAffordable || this.tab === 'balls';
    BALLS.forEach((b, t) => {
      const lv = PQ.milestone(s.owned[b.key]).lv;
      if (lv > this.mileSeen[t]) {
        this.mileSeen[t] = lv;
        this.toast(`${D.MILESTONES[lv - 1]} ${b.name}s! They now earn ×${fmtX(sim.tMult[t])}.`, 3200);
      }
    });

    D.UP.forEach(u => {
      const row = $('up-' + u.key), lvl = s.global[u.key], cost = sim.upCost(u.key), maxed = lvl >= u.max;
      const ok = !maxed && cost <= s.bits;
      upAffordable = upAffordable || ok;
      if (this.tab !== 'upgrades') return;
      row.querySelector('.lv').textContent = `Lv ${lvl}${u.max < 99 ? '/' + u.max : ''}`;
      row.querySelector('.desc').textContent = Array.isArray(u.desc) ? (u.desc[Math.min(lvl, u.desc.length - 1)]) : u.desc;
      this.setBuy(row.querySelector('.buy'), maxed ? Infinity : cost, ok, maxed ? 'Done' : 'Upgrade');
    });
    BALLS.forEach((b, t) => {
      const owned = s.owned[b.key] > 0;
      $('ug-' + t).hidden = !owned;
      if (!owned) return;
      ['dmg', 'spd', 'sp'].forEach(k => {
        const row = $(`bu-${t}-${k}`);
        if (!row) return;
        const lvl = s.up[b.key][k], max = sim.ballUpMax(t, k), maxed = lvl >= max, cost = sim.ballUpCost(t, k);
        const ok = !maxed && cost <= s.bits;
        upAffordable = upAffordable || ok;
        if (this.tab !== 'upgrades') return;
        row.querySelector('.lv').textContent = `Lv ${lvl}/${max}`;
        this.setBuy(row.querySelector('.buy'), maxed ? Infinity : cost, ok, maxed ? 'Done' : 'Upgrade');
      });
    });
    $('upDot').hidden = !upAffordable || this.tab === 'upgrades';

    const left = sim.starsLeft();
    let perkAffordable = false;
    D.STAR_PERKS.forEach(k => {
      const lvl = s.perks[k.key], cost = sim.perkCost(k.key), maxed = !isFinite(cost), ok = !maxed && cost <= left;
      perkAffordable = perkAffordable || ok;
      if (this.tab !== 'stars') return;
      const row = $('pk-' + k.key);
      row.querySelector('.lv').textContent = `Lv ${lvl}/${k.costs.length}`;
      row.querySelector('.desc').textContent = perkText(k, maxed ? lvl : lvl + 1);
      const btn = row.querySelector('.buy');
      btn.disabled = !ok;
      btn.classList.toggle('afford', ok);
      btn.querySelector('.cost').textContent = maxed ? 'Max' : `${cost} ★`;
      btn.querySelector('.lbl').textContent = maxed ? 'Done' : 'Buy';
    });
    $('starDot').hidden = !perkAffordable || this.tab === 'stars';
    if (this.tab === 'stars') {
      $('starsNote').textContent = s.stars
        ? `${this.starWord(left)} to spend. All ${s.stars} you have earned add +${fmt(s.stars * D.STAR_BONUS * 100)}% bits, spent or not.`
        : 'Find the Golden Pixel to earn stars. Spend them here on perks that last through every world.';
    }

    if (this.tab === 'world' && $('st-broken')) {
      $('st-broken').textContent = fmt(s.broken);
      $('st-mined').textContent = (100 * g.world.minedCount / g.world.solidTotal).toFixed(2) + '%';
      $('st-time').textContent = fmtTime(s.playTime);
      $('st-depth').textContent = s.depth;
      $('st-stars').textContent = s.stars;
      $('st-earned').textContent = fmt(s.earned);
      $('st-life').textContent = fmt(s.lifetime);
      $('st-relics').textContent = `${s.relics.length} / ${g.world.relics.length}`;
    }
  };

  // Tell the renderer which band of the screen is not covered by HUD or sheet.
  U.measure = function () {
    const r = this.g.renderer;
    r.safeTop = document.querySelector('.hud').getBoundingClientRect().bottom - 14;
    r.safeBottom = $('sheet').getBoundingClientRect().top;
  };

  U.tick = function (dt) {
    const bits = this.g.state.bits;
    this.shown += (bits - this.shown) * Math.min(1, dt * 6);
    if (Math.abs(bits - this.shown) < 1) this.shown = bits;
    const txt = fmt(this.shown);
    if (txt !== this.bitsTxt) { this.bitsTxt = txt; $('bits').textContent = txt; }
    this.t += dt;
    if (this.t >= 0.2) {
      this.t = 0;
      this.measure();
      this.refresh();
    }
    if (this.toastT > 0) {
      this.toastT -= dt;
      if (this.toastT <= 0) $('toast').hidden = true;
    }
  };

  PQ.UI = UI;
  PQ.fmt = fmt;
})();

</script>
<script>
// Pixel Quarry: boot, game loop, autosave.
(function () {
  const PQ = window.PQ, D = PQ.DATA;
  const $ = id => document.getElementById(id);
  const canvas = $('world');
  const yieldFrame = () => new Promise(r => setTimeout(r, 0));

  function newSeed() {
    try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return (Math.random() * 4294967296) >>> 0; }
  }

  function progress(f, text) {
    $('loadBar').style.width = (Math.min(1, f) * 100).toFixed(1) + '%';
    if (text) $('loadText').textContent = text;
  }

  const game = PQ.game = { state: null, world: null, sim: null, renderer: null, ui: null, input: null, running: false };
  let saving = false;

  async function saveAll() {
    if (!game.sim || saving) return;
    saving = true;
    PQ.Save.saveMeta(game.state);
    try { await PQ.Save.saveWorld(game.world, game.sim); } catch (e) { /* storage blocked: progress still in meta */ }
    saving = false;
  }

  async function boot(state, restore) {
    game.running = false;
    $('loading').hidden = false;
    progress(0, 'Generating 10,000,000 pixels');
    await yieldFrame();

    const world = PQ.World.create(state.seed, state.depth);
    PQ.World.prepare(world);
    const CH = 160;
    for (let y = 0; y < D.H; y += CH) {
      PQ.World.genRows(world, y, Math.min(D.H, y + CH));
      progress(0.65 * Math.min(1, (y + CH) / D.H));
      await yieldFrame();
    }
    PQ.World.finalize(world);

    let saved = null;
    if (restore) { try { saved = await PQ.Save.loadWorld(world.seed); } catch (e) { saved = null; } }
    if (saved) {
      PQ.World.applyMined(world, saved.mined, !state.found);
      if (saved.fog && saved.fog.length === world.fog.length) world.fog.set(saved.fog);
      else PQ.World.fogFromMined(world);                     // save from before fog existed
    }
    else state.drop = { x: D.W / 2, y: world.surface[D.W >> 1] - 30 };

    const sim = new PQ.Sim(world, state);
    if (saved) sim.importBalls(saved.balls);
    sim.spawnMissing();

    const renderer = new PQ.Renderer(canvas, world, sim);
    renderer.resize();
    progress(0.65, 'Drawing the map');
    await renderer.buildOverview(f => progress(0.65 + 0.35 * f));
    renderer.lookAtDrop(state.drop, 3);

    Object.assign(game, { state, world, sim, renderer });
    if (game.input) game.input.r = renderer;
    else game.input = new PQ.Input(canvas, renderer, {
      tap: p => onTap(p, false),
      hold: p => onTap(p, true),
    });
    if (game.ui) { game.ui.g = game; game.ui.build(); game.ui.showTab(game.ui.tab); }
    else game.ui = new PQ.UI(game);
    game.ui.measure();
    game.ui.refresh();

    $('loading').hidden = true;
    game.running = true;
  }

  let dropHinted = false;
  function onTap(p, held) {
    const sim = game.sim;
    const x = Math.floor(p.x), y = Math.floor(p.y);
    if (held && (x < 0 || y < 0 || x >= D.W || y >= D.H || !(game.world.cells[y * D.W + x] & D.TYPE_MASK))) return;
    const e0 = game.state.earned;
    const r = sim.tap(p.x, p.y);
    const gain = game.state.earned - e0;
    if (gain >= 1) game.renderer.float(p.x, p.y, '+' + PQ.fmt(gain));
    if (r === 'relic') game.ui.toast('Relics cannot be broken. Balls bounce off them.');
    if (r === 'drop' && !dropHinted) { dropHinted = true; game.ui.toast('Drop point moved. New balls appear here.'); }
  }

  game.newWorld = async function (prestige) {
    const s = game.state;
    const next = prestige ? PQ.prestige(s, newSeed()) : PQ.prestige(Object.assign({}, s, { found: false }), newSeed());
    try { await PQ.Save.clearWorld(); } catch (e) { /* ignore */ }
    PQ.Save.saveMeta(next);
    await boot(next, false);
    await saveAll();
    if (prestige) game.ui.toast(`Depth ${next.depth}. ${game.ui.depthNote(next.depth)}`, 4500);
  };

  game.reload = function () { location.reload(); };

  let last = performance.now(), lastWall = Date.now(), metaT = 0, worldT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const wall = Date.now();
    if (!game.running) { last = now; lastWall = wall; return; }
    const gap = (wall - lastWall) / 1000;
    lastWall = wall;
    if (gap > 60) game.ui.offline(game.sim.offline(gap));
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    const { sim, renderer, state } = game;
    sim.step(dt);
    game.input.update(dt);
    renderer.radar = state.global.radar;
    renderer.particles = state.settings.particles;
    renderer.draw(dt);
    for (const e of sim.events.splice(0)) {
      if (e.type === 'gold') { game.ui.gold(); saveAll(); }
      if (e.type === 'relic') game.ui.relic(e);
    }
    game.ui.tick(dt);

    metaT += dt; worldT += dt;
    if (metaT > 5) { metaT = 0; PQ.Save.saveMeta(state); }
    if (worldT > 30) { worldT = 0; saveAll(); }
  }

  window.addEventListener('resize', () => game.renderer && game.renderer.resize());
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
  window.addEventListener('pagehide', saveAll);

  async function start() {
    const meta = PQ.Save.loadMeta();
    const state = meta ? PQ.Save.migrate(meta) : PQ.newState(newSeed());
    await boot(state, !!meta);
    if (meta) {
      const away = (Date.now() - (meta.savedAt || Date.now())) / 1000;
      if (away > 60) game.ui.offline(game.sim.offline(away));
    } else {
      game.ui.welcome();
      PQ.Save.saveMeta(state);
    }
    lastWall = Date.now();
    requestAnimationFrame(frame);
  }

  // Offline install, only where a real page can host a service worker.
  try {
    if ('serviceWorker' in navigator && window.isSecureContext && window.top === window.self &&
        document.querySelector('link[rel="manifest"]')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) { /* sandboxed frame */ }

  start();
})();

</script>
