<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Quarry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Ten million pixels, one of them gold. Buy balls, mine the world, find the Golden Pixel.">
<meta name="theme-color" content="#0f0d15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Quarry">
<link rel="manifest" href="manifest.webmanifest"><!--pwa-->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><!--pwa-->
<link rel="icon" type="image/png" href="icons/icon-192.png"><!--pwa-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: the quarry canvas fills the screen; a translucent HUD strip rides the top,
   a pull-up shop sheet sits at the bottom. One deliberate dark world, one gold accent. */
:root {
  --ground: #0f0d15;
  --panel: #18151f;
  --panel-2: #221e2c;
  --line: #312b3f;
  --ink: #ece6d8;
  --muted: #9a93a8;
  --gold: #ffd640;
  --gold-ink: #1c1604;
  --warn: #ff6a58;
  --display: 'Pixelify Sans', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ---- HUD ---- */
.hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 18px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  background: linear-gradient(to bottom, rgba(15, 13, 21, 0.88) 55%, rgba(15, 13, 21, 0));
  pointer-events: none;
}
.hud > * { pointer-events: auto; min-width: 0; }
.bits {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 700 30px/1 var(--display);
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.bits::before {
  content: '';
  flex: none;
  width: 13px; height: 13px;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(255, 214, 64, 0.55);
}
.rate { margin-top: 4px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.hud-right { text-align: right; }
.ballcount { font: 500 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.ballcount small { font: 13px var(--body); color: var(--muted); }
.mini-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.chip {
  min-height: 34px;
  padding: 0 12px;
  background: rgba(24, 21, 31, 0.9);
  border: 1px solid var(--line);
  font-size: 13px;
  letter-spacing: 0.04em;
}
.chip:active { background: var(--panel-2); }

.radar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  padding: 5px 10px;
  background: rgba(24, 21, 31, 0.9);
  border: 1px solid var(--line);
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.radar[hidden] { display: none; }
.heat { flex: none; width: 64px; height: 6px; background: var(--line); }
.heat i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #4aa8ff, var(--gold) 65%, var(--warn)) 0 0 / 64px 100%;
  transition: width 0.4s;
}

/* ---- shop sheet ---- */
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
}
@media (min-width: 561px) { .sheet { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.sheet-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 6px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
.tabs button {
  position: relative;
  min-height: 44px;
  padding: 0 10px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  font: 500 16px var(--display);
  color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.dot { position: absolute; top: 9px; right: 2px; width: 6px; height: 6px; background: var(--gold); }
.buyrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.buymode { display: flex; border: 1px solid var(--line); flex: none; }
.buymode button {
  min-height: 32px;
  min-width: 38px;
  padding: 0 7px;
  background: none;
  border: 0;
  font-size: 13px;
  color: var(--muted);
}
.buymode button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
.grip {
  flex: none;
  width: 36px; height: 36px;
  background: none;
  border: 1px solid var(--line);
  position: relative;
}
.grip::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 10px; height: 10px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: translate(-50%, -75%) rotate(45deg);
}
.sheet:not(.open) .grip::before { transform: translate(-50%, -25%) rotate(-135deg); }
.sheet-body {
  max-height: 0;
  overflow: hidden;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  transition: max-height 0.22s ease;
}
.sheet.open .sheet-body { max-height: 40vh; max-height: 40dvh; overflow-y: auto; overscroll-behavior: contain; }
.panel { padding-bottom: 12px; }

.group-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 0 2px;
  font: 500 13px var(--display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.row {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row.plain { grid-template-columns: minmax(0, 1fr) auto; }
.swatch { width: 14px; height: 14px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45); }
.name { font: 500 17px/1.2 var(--display); }
.name .count, .name .lv { font: 13px var(--body); color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.desc { margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.row.locked .name, .row.locked .swatch { opacity: 0.45; filter: grayscale(1); }
.buy {
  min-width: 96px;
  min-height: 46px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 1px;
  padding: 5px 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.buy .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.buy .cost { font: 500 16px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.buy.afford { border-color: rgba(255, 214, 64, 0.6); }
.buy:disabled { cursor: default; opacity: 0.5; }
.buy:disabled .cost { color: var(--muted); }
.buy:not(:disabled):active { transform: translateY(1px); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 12px 0 4px; }
.stats div { min-width: 0; }
.stats dt { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 500 19px var(--display); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn {
  min-height: 44px;
  padding: 0 14px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 14px;
}
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--gold); }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.confirm { margin-top: 10px; padding: 12px; border: 1px solid var(--warn); }
.confirm p { margin: 0 0 8px; font-size: 14px; }
textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 84px;
  margin-top: 8px;
  padding: 8px;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--line);
  font: 11px/1.3 ui-monospace, Menlo, monospace;
  -webkit-user-select: text;
  user-select: text;
  word-break: break-all;
}

/* ---- toast, modal, loading ---- */
.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 96px);
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 8px 14px;
  background: rgba(24, 21, 31, 0.96);
  border: 1px solid var(--line);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
}
.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(6, 5, 9, 0.72);
}
.modal[hidden] { display: none; }
.card {
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 22px 20px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.card h2 { margin: 0 0 10px; font: 700 26px/1.1 var(--display); color: var(--gold); text-wrap: balance; }
.card p { margin: 0 0 10px; color: var(--ink); line-height: 1.45; }
.card p.sub { color: var(--muted); font-size: 14px; }
.card ul { margin: 0 0 12px; padding-left: 18px; color: var(--muted); font-size: 14px; }
.card li { margin: 4px 0; }
.card .actions { margin-top: 16px; }
.card .big { font: 700 34px var(--display); color: var(--gold); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }

.loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 18px;
  background: var(--ground);
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.loading[hidden] { display: none; }
.logo { font: 700 40px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.logo b { color: var(--gold); margin-left: 10px; font-weight: 700; }
.bar { width: 220px; max-width: 70vw; height: 8px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); }
#loadText { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .sheet-body, .heat i { transition: none; }
}

</style>
</head>
<body>
<canvas id="world" aria-label="The quarry. Drag to look around, pinch to zoom, tap rock to dig, tap open space to move the drop point."></canvas>

<header class="hud">
  <div class="hud-left">
    <div class="bits" id="bits" aria-live="off">0</div>
    <div class="rate" id="rate">+0 bits/s</div>
    <div class="radar" id="radar" title="Gold radar: how close the middle of your view is to the Golden Pixel" hidden>
      <span class="heat"><i id="heat"></i></span>
      <span id="radarText">Cold</span>
    </div>
  </div>
  <div class="hud-right">
    <div class="ballcount"><span id="ballCount">1</span> <small>balls</small></div>
    <div class="mini-btns">
      <button class="chip" id="btnDrop" type="button" title="Jump to the drop point">Drop</button>
      <button class="chip" id="btnMap" type="button" title="Zoom out to the whole world">Map</button>
    </div>
  </div>
</header>

<section class="sheet open" id="sheet" aria-label="Shop">
  <div class="sheet-bar">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-balls" data-tab="balls" aria-selected="true">Balls</button>
      <button type="button" role="tab" id="tab-upgrades" data-tab="upgrades" aria-selected="false">Upgrades<span class="dot" id="upDot" hidden></span></button>
      <button type="button" role="tab" id="tab-world" data-tab="world" aria-selected="false">World</button>
    </nav>
    <button type="button" class="grip" id="grip" aria-label="Hide shop" aria-expanded="true"></button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="panel" id="panel-balls" role="tabpanel"></div>
    <div class="panel" id="panel-upgrades" role="tabpanel" hidden></div>
    <div class="panel" id="panel-world" role="tabpanel" hidden></div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<div class="loading" id="loading">
  <div class="logo">Pixel<b>Quarry</b></div>
  <div class="bar"><i id="loadBar"></i></div>
  <p id="loadText">Generating 10,000,000 pixels</p>
</div>

<script>
// Pixel Quarry: all tables and constants. No logic lives here.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ = root.PQ || {};

  const W = 2500, H = 4000;               // 10,000,000 pixels

  PQ.DATA = {
    W, H, N: W * H,
    TILE: 128,                              // render tile edge, world px
    OV: 2,                                  // overview downscale factor
    SURFACE: 220,                           // mean ground line, rows from the top
    MAX_BALLS: 4000,
    TYPE_MASK: 0x0f,
    POISON: 0x80,

    // Cell types. hp = hits of 1 damage, val = bits paid when broken.
    // col = base colour; the renderer derives shades from it.
    MAT: [
      { id: 0,  key: 'air',      name: 'Air' },
      { id: 1,  key: 'grass',    name: 'Turf',      hp: 1,   val: 1,   col: [86, 148, 70] },
      { id: 2,  key: 'soil',     name: 'Topsoil',   hp: 1,   val: 1,   col: [122, 86, 58] },
      { id: 3,  key: 'clay',     name: 'Clay',      hp: 3,   val: 4,   col: [168, 104, 72] },
      { id: 4,  key: 'stone',    name: 'Stone',     hp: 8,   val: 14,  col: [118, 116, 122] },
      { id: 5,  key: 'basalt',   name: 'Basalt',    hp: 40,  val: 60,  col: [66, 64, 78] },
      { id: 6,  key: 'obsidian', name: 'Obsidian',  hp: 140, val: 240, col: [38, 28, 54] },
      { id: 7,  key: 'copper',   name: 'Copper',    hp: 6,   val: 60,  col: [214, 122, 62] },
      { id: 8,  key: 'silver',   name: 'Silver',    hp: 20,  val: 400, col: [196, 210, 222] },
      { id: 9,  key: 'amethyst', name: 'Amethyst',  hp: 50,  val: 3000, col: [178, 92, 232] },
      { id: 10, key: 'relic',    name: 'Relic',     hard: true,         col: [222, 200, 150] },
      { id: 11, key: 'gold',     name: 'Golden Pixel', hp: 200, val: 0, col: [255, 206, 46] },
    ],
    T: { AIR: 0, GRASS: 1, SOIL: 2, CLAY: 3, STONE: 4, BASALT: 5, OBSIDIAN: 6,
         COPPER: 7, SILVER: 8, AMETHYST: 9, RELIC: 10, GOLD: 11 },

    // Ball types. speed in world px/s, dmg per hit, cost grows by GROWTH per owned.
    // unlock = bits earned in the current world before the type can be bought.
    BALLS: [
      { key: 'pebble', name: 'Pebble', color: '#e9e4d6', dmg: 1,  speed: 46,  cost: 15,     unlock: 0,
        desc: 'Bounces around and chips whatever it hits.' },
      { key: 'lancer', name: 'Lancer', color: '#4aa8ff', dmg: 3,  speed: 120, cost: 400,    unlock: 300,
        desc: 'Only travels in straight lines. Cuts long, clean tunnels.',
        special: { key: 'pierce', name: 'Pierce', desc: 'Keeps going through 1 more broken pixel', max: 10, base: 0, step: 1 } },
      { key: 'bomb',   name: 'Bomb',   color: '#ff5a48', dmg: 2,  speed: 50,  cost: 4000,   unlock: 3500,
        desc: 'Blows out a circle of pixels on impact, then recharges.',
        special: { key: 'radius', name: 'Blast radius', desc: '+1 px blast radius', max: 10, base: 4, step: 1 } },
      { key: 'venom',  name: 'Venom',  color: '#6fe05a', dmg: 2,  speed: 52,  cost: 40000,  unlock: 35000,
        desc: 'Poisons what it touches. Poison eats outward through the rock.',
        special: { key: 'spread', name: 'Virulence', desc: 'Poison spreads further', max: 8, base: 0, step: 1 } },
      { key: 'midas',  name: 'Midas',  color: '#ff9b2e', dmg: 4,  speed: 60,  cost: 400000, unlock: 300000,
        desc: 'Every pixel it breaks pays out several times over.',
        special: { key: 'mult', name: 'Alchemy', desc: '+1× payout', max: 12, base: 4, step: 1 } },
      { key: 'drill',  name: 'Drill',  color: '#b46cff', dmg: 30, speed: 40,  cost: 4e6,    unlock: 3e6,
        desc: 'Bores straight through anything it can break in one hit.' },
      { key: 'seeker', name: 'Seeker', color: '#37e2d6', dmg: 60, speed: 70,  cost: 5e7,    unlock: 4e7,
        desc: 'Homes in on the Golden Pixel, boring through soft rock on the way.',
        special: { key: 'steer', name: 'Instinct', desc: 'Steers harder toward the gold', max: 8, base: 1, step: 1 } },
    ],
    // Ball n of a type costs cost * (1 + n / COST_K)^COST_EXP, so swarms of thousands stay reachable.
    COST_K: 8,
    COST_EXP: 2,

    // Per-ball-type upgrades: cost = ball.cost * mul * grow^level
    BALL_UP: {
      dmg: { name: 'Damage', mul: 6, grow: 2.6, max: 25, desc: '+60% damage' },
      spd: { name: 'Speed',  mul: 4, grow: 2.2, max: 12, desc: '+15% speed' },
      sp:  { mul: 10, grow: 3.0 },
    },

    // Global upgrades
    UP: [
      { key: 'tap',   name: 'Pickaxe',   desc: 'Tapping rock hits harder and wider.', cost: 40,    grow: 2.4, max: 40 },
      { key: 'value', name: 'Appraisal', desc: '+25% bits from every pixel.',         cost: 600,   grow: 2.9, max: 60 },
      { key: 'radar', name: 'Gold Radar', desc: ['Shows how warm you are.', 'Adds an arrow toward the gold.', 'Shows the exact distance.'],
        costs: [60000, 3e6, 2e8], max: 3 },
    ],

    POISON_TICK: 0.25,      // s between poison damage passes
    POISON_CAP: 60000,      // live poisoned cells
    BOMB_COOLDOWN: 1.0,
    OFFLINE_RATE: 0.5,      // share of live income paid while away
    OFFLINE_CAP: 8 * 3600,  // s
    STAR_BONUS: 0.5,        // +50% value per Golden Pixel found

    // Indestructible relics, stamped into the world at SCALE px per character.
    RELICS: [
      { name: 'Bone', scale: 7, art: [
        '.XX.......XX.',
        'XXXX.....XXXX',
        'XXXXXXXXXXXXX',
        '.XXXXXXXXXXX.',
        'XXXXXXXXXXXXX',
        'XXXX.....XXXX',
        '.XX.......XX.',
      ] },
      { name: 'Paw', scale: 8, art: [
        '..XX....XX..',
        '.XXXX..XXXX.',
        '.XXXX..XXXX.',
        '..XX....XX..',
        '............',
        'XX..XXXX..XX',
        'XX.XXXXXX.XX',
        '..XXXXXXXX..',
        '.XXXXXXXXXX.',
        '.XXXXXXXXXX.',
        '..XXXXXXXX..',
      ] },
      { name: 'Skull', scale: 8, art: [
        '...XXXXXX...',
        '.XXXXXXXXXX.',
        'XXXXXXXXXXXX',
        'XX...XX...XX',
        'XX...XX...XX',
        'XXXXXXXXXXXX',
        '.XXXXX.XXXX.',
        '..XXXXXXXX..',
        '..X.X.X.X...',
      ] },
      { name: 'Key', scale: 7, art: [
        '.XXX..........',
        'X...X.........',
        'X...XXXXXXXXXX',
        'X...X....X.X.X',
        '.XXX.....X.X..',
      ] },
      { name: 'Anchor', scale: 8, art: [
        '....XXX....',
        '....X.X....',
        '....XXX....',
        '..XXXXXXX..',
        '.....X.....',
        '.....X.....',
        'X....X....X',
        'XX...X...XX',
        '.XX..X..XX.',
        '..XXXXXXX..',
      ] },
      { name: 'Gear', scale: 7, art: [
        '....XX....',
        '.X.XXXX.X.',
        '..XXXXXX..',
        'XXXX..XXXX',
        'XXX....XXX',
        'XXX....XXX',
        'XXXX..XXXX',
        '..XXXXXX..',
        '.X.XXXX.X.',
        '....XX....',
      ] },
      { name: 'Arch', scale: 9, art: [
        '.XXXXXXXXX.',
        'XXXXXXXXXXX',
        'XXX.....XXX',

<script>
// Pixel Quarry: world generation. Same seed always gives the same world, which
// is what lets a save store only which pixels were mined.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T;
  const W = D.W, H = D.H, N = D.N;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function hash2(x, y, s) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(x - xi), v = smooth(y - yi);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s);
    const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  function vnoise1(x, s) {
    const xi = Math.floor(x), u = smooth(x - xi);
    const a = hash2(xi, 0, s), b = hash2(xi + 1, 0, s);
    return a + (b - a) * u;
  }

  // Low-frequency noise sampled every `step` px along a row and lerped between.
  function rowNoise(buf, y, fx, fy, s, step) {
    let prev = vnoise(0, y * fy, s);
    for (let x0 = 0; x0 < W; x0 += step) {
      const next = vnoise((x0 + step) * fx, y * fy, s);
      const end = Math.min(W, x0 + step);
      for (let x = x0; x < end; x++) buf[x] = prev + (next - prev) * ((x - x0) / step);
      prev = next;
    }
  }

  function create(seed) {
    return {
      W, H, N, seed: seed >>> 0,
      cells: new Uint8Array(N),
      dmg: new Uint8Array(N),
      mined: new Uint8Array((N + 7) >> 3),
      surface: new Int16Array(W),
      relics: [],
      gold: { x: 0, y: 0 },
      solidTotal: 0,
      minedCount: 0,
    };
  }

  function prepare(w) {
    const s = w.seed;
    for (let x = 0; x < W; x++) {
      w.surface[x] = Math.round(D.SURFACE
        + (vnoise1(x / 260, s + 1) - 0.5) * 110
        + (vnoise1(x / 48, s + 2) - 0.5) * 26
        + (vnoise1(x / 9, s + 3) - 0.5) * 4);
    }
  }

  const warpBuf = new Float32Array(W), caveA = new Float32Array(W), caveB = new Float32Array(W);

  function genRows(w, y0, y1) {
    const s = w.seed, cells = w.cells, surface = w.surface;
    for (let y = y0; y < y1; y++) {
      rowNoise(warpBuf, y, 1 / 140, 1 / 140, s + 4, 16);
      rowNoise(caveA, y, 1 / 90, 1 / 55, s + 5, 8);
      rowNoise(caveB, y, 1 / 26, 1 / 26, s + 6, 4);
      const caveThr = 0.70 - 0.05 * (y / H);
      const row = y * W;
      let blk = 1;
      for (let x = 0; x < W; x++) {
        if ((x & 15) === 0) blk = hash2(x >> 4, y >> 4, s + 8);
        const sf = surface[x];
        let t;
        if (y < sf) t = T.AIR;
        else {
          const d = y - sf;
          if (d < 3) t = T.GRASS;
          else {
            const f = (y + (warpBuf[x] - 0.5) * 170) / H;
            t = f < 0.17 ? T.SOIL : f < 0.33 ? T.CLAY : f < 0.56 ? T.STONE : f < 0.80 ? T.BASALT : T.OBSIDIAN;
            if (d > 26) {
              if (caveA[x] * 0.62 + caveB[x] * 0.38 > caveThr) t = T.AIR;
              else if (blk < 0.12 && vnoise(x / 5, y / 5, s + 9) > 0.64) {
                if (f < 0.30) t = T.COPPER;
                else if (f < 0.60) t = blk < 0.04 ? T.SILVER : T.COPPER;
                else t = blk < 0.015 ? T.AMETHYST : blk < 0.06 ? T.SILVER : T.COPPER;
              }
            }
          }
        }
        cells[row + x] = t;
      }
    }
  }

  function overlaps(list, x0, y0, x1, y1, pad) {
    for (const r of list) {
      if (x0 < r.x1 + pad && x1 > r.x0 - pad && y0 < r.y1 + pad && y1 > r.y0 - pad) return true;
    }
    return false;
  }

  // Relics, the Golden Pixel and the solid-pixel count. Run after every row exists.
  function finalize(w) {
    const rng = mulberry32(w.seed ^ 0x9e3779b9);
    const cells = w.cells;
    w.relics = [];
    for (let i = 0; i < D.RELIC_COUNT; i++) {
      const def = D.RELICS[Math.floor(rng() * D.RELICS.length)];
      const rw = Math.max(...def.art.map(r => r.length)) * def.scale, rh = def.art.length * def.scale;
      for (let tries = 0; tries < 30; tries++) {
        const x0 = 30 + Math.floor(rng() * (W - 60 - rw));
        const y0 = D.SURFACE + 160 + Math.floor(rng() * (H - D.SURFACE - 220 - rh));
        if (overlaps(w.relics, x0, y0, x0 + rw, y0 + rh, 40)) continue;
        def.art.forEach((line, ry) => {
          for (let rx = 0; rx < line.length; rx++) {
            if (line[rx] !== 'X') continue;
            for (let py = 0; py < def.scale; py++) {
              const row = (y0 + ry * def.scale + py) * W + x0 + rx * def.scale;
              cells.fill(T.RELIC, row, row + def.scale);
            }
          }
        });
        w.relics.push({ name: def.name, x0, y0, x1: x0 + rw, y1: y0 + rh });
        break;
      }
    }

    // The Golden Pixel sits deep, fully buried, away from relics.
    for (let tries = 0; tries < 5000; tries++) {
      const x = 60 + Math.floor(rng() * (W - 120));
      const y = Math.floor(H * 0.62 + rng() * (H * 0.38 - 50));
      if (overlaps(w.relics, x, y, x + 1, y + 1, 12)) continue;
      let buried = true;
      for (let dy = -2; dy <= 2 && buried; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const t = cells[(y + dy) * W + x + dx];
          if (t === T.AIR || t === T.RELIC) { buried = false; break; }
        }
      }
      if (!buried) continue;
      cells[y * W + x] = T.GOLD;
      w.gold = { x, y };
      break;
    }

    let solid = 0;
    for (let i = 0; i < N; i++) { const t = cells[i]; if (t !== T.AIR && t !== T.RELIC) solid++; }
    w.solidTotal = solid;
  }

  function generate(w) {
    prepare(w);
    genRows(w, 0, H);
    finalize(w);
    return w;
  }

  // Re-applies a save's mined bitset to a freshly generated world.
  function applyMined(w, bits) {
    const cells = w.cells;
    let count = 0;
    const len = Math.min(bits.length, w.mined.length);
    for (let b = 0; b < len; b++) {
      const v = bits[b];
      if (!v) continue;
      for (let k = 0; k < 8; k++) {
        if ((v >> k) & 1) {
          const i = (b << 3) + k;
          if (i < N && cells[i] !== T.RELIC) { cells[i] = T.AIR; count++; }
        }
      }
      w.mined[b] = v;
    }
    w.minedCount = count;
  }

  PQ.World = { create, prepare, genRows, finalize, generate, applyMined, mulberry32, hash2, vnoise };
})();

<script>
// Pixel Quarry: the simulation. Pure logic, no DOM, so it runs under Node for tests.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, MAT = D.MAT, BALLS = D.BALLS;
  const W = D.W, H = D.H, MASK = D.TYPE_MASK, POI = D.POISON;
  const TS = Math.log2(D.TILE);
  const B = {};
  BALLS.forEach((b, i) => { B[b.key] = i; });

  function newState(seed) {
    const owned = {}, up = {};
    BALLS.forEach(b => { owned[b.key] = 0; up[b.key] = { dmg: 0, spd: 0, sp: 0 }; });
    owned.pebble = 1;                       // one free ball to start
    return {
      v: 1, seed: seed >>> 0,
      bits: 0, earned: 0, lifetime: 0, stars: 0,
      owned, up, global: { tap: 0, value: 0, radar: 0 },
      drop: { x: W / 2, y: 110 },
      found: false, foundTime: 0, goldReward: 0,
      playTime: 0, broken: 0, rate: 0,
      savedAt: Date.now(),
      settings: { particles: true },
      buyMode: 1,
    };
  }

  function Sim(world, state) {
    this.w = world;
    this.s = state;
    const M = D.MAX_BALLS;
    this.n = 0;
    this.bx = new Float32Array(M); this.by = new Float32Array(M);
    this.vx = new Float32Array(M); this.vy = new Float32Array(M);
    this.bt = new Uint8Array(M);
    this.cd = new Float32Array(M);
    this.pl = new Uint8Array(M);
    this.tilesX = Math.ceil(W / D.TILE);
    this.tilesY = Math.ceil(H / D.TILE);
    this.tileDirty = new Uint8Array(this.tilesX * this.tilesY).fill(1);
    this.ovDirty = new Uint8Array(this.tilesX * this.tilesY).fill(1);
    this.poison = new Int32Array(D.POISON_CAP);
    this.poisonGen = new Uint8Array(D.POISON_CAP);
    this.pn = 0;
    this.poisonT = 0;
    this.fxI = new Int32Array(256); this.fxT = new Uint8Array(256); this.fxn = 0;
    this.events = [];
    this.hist = [state.earned];
    this.rateT = 0;
    this.rng = PQ.World.mulberry32((state.seed ^ 0x5bd1e995) >>> 0);
    this.derive();
  }

  const P = Sim.prototype;

  // Recompute every number that depends on upgrades. Call after any purchase.
  P.derive = function () {
    const s = this.s;
    const sp = key => {
      const b = BALLS[B[key]];
      return b.special.base + b.special.step * s.up[key].sp;
    };
    this.valueMult = (1 + 0.25 * s.global.value) * (1 + D.STAR_BONUS * s.stars);
    this.tDmg = BALLS.map(b => Math.round(b.dmg * Math.pow(1.6, s.up[b.key].dmg)));
    this.tSpd = BALLS.map(b => b.speed * (1 + 0.15 * s.up[b.key].spd));
    this.pierceMax = BALLS.map(b => b.key === 'lancer' ? sp('lancer') : (b.key === 'drill' || b.key === 'seeker') ? 255 : 0);
    this.bombR = sp('bomb');
    this.venomGen = 4 + 2 * s.up.venom.sp;
    this.venomP = 0.42 + 0.03 * s.up.venom.sp;
    this.midas = sp('midas');
    this.steer = sp('seeker');
    this.tapDmg = Math.round(3 * Math.pow(1.6, s.global.tap));
    this.tapR = Math.min(10, 2 + Math.floor(s.global.tap / 3));
  };

  P.dirty = function (x, y) {
    const k = (y >> TS) * this.tilesX + (x >> TS);
    this.tileDirty[k] = 1;
    this.ovDirty[k] = 1;
  };

  P.spawn = function (t, x, y) {
    if (this.n >= D.MAX_BALLS) return false;
    const k = this.n++;
    this.bx[k] = x; this.by[k] = y;
    if (t === B.lancer) {
      const d = Math.floor(this.rng() * 4);
      this.vx[k] = [1, -1, 0, 0][d]; this.vy[k] = [0, 0, 1, -1][d];
    } else if (t === B.seeker && !this.s.found) {
      const g = this.w.gold, a = Math.atan2(g.y + 0.5 - y, g.x + 0.5 - x) + (this.rng() - 0.5) * 1.8 / this.steer;
      this.vx[k] = Math.cos(a); this.vy[k] = Math.sin(a);
    } else {
      const a = this.rng() * Math.PI * 2;
      this.vx[k] = Math.cos(a); this.vy[k] = Math.sin(a);
    }
    this.bt[k] = t;
    this.cd[k] = 0;
    this.pl[k] = this.pierceMax[t];
    return true;
  };

  // Damage one cell. Returns 1 broken, 0 damaged, 2 already empty, -1 unbreakable.
  P.hit = function (x, y, amount, mult) {
    const w = this.w, i = y * W + x, t = w.cells[i] & MASK;
    if (t === 0) return 2;
    const m = MAT[t];
    if (m.hard) return -1;
    const before = w.dmg[i], d = before + amount;
    if (d >= m.hp) { this.destroy(i, x, y, t, mult); return 1; }
    w.dmg[i] = d;
    if (((before * 4 / m.hp) | 0) !== ((d * 4 / m.hp) | 0)) this.dirty(x, y);
    return 0;
  };

  P.destroy = function (i, x, y, t, mult) {
    const w = this.w, s = this.s;
    w.cells[i] = 0;
    w.dmg[i] = 0;
    w.mined[i >> 3] |= 1 << (i & 7);
    w.minedCount++;
    const v = MAT[t].val * mult * this.valueMult;
    s.bits += v; s.earned += v; s.lifetime += v;
    s.broken++;
    this.dirty(x, y);
    if (this.fxn < 256) { this.fxI[this.fxn] = i; this.fxT[this.fxn] = t; this.fxn++; }
    const g = w.gold;
    if (t === T.GOLD) {
      s.found = true;
      s.foundTime = s.playTime;
      s.goldReward = Math.max(5e5, s.earned * 0.5);
      s.bits += s.goldReward;
      this.events.push({ type: 'gold' });
    } else if (Math.abs(x - g.x) + Math.abs(y - g.y) === 1) {
      this.dirty(g.x, g.y);                 // the gold may now be exposed
    }
  };

  P.explode = function (cx, cy, R, amount) {
    const cells = this.w.cells;
    for (let dy = -R; dy <= R; dy++) {
      const y = cy + dy;
      if (y < 0 || y >= H) continue;
      const span = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -span; dx <= span; dx++) {
        const x = cx + dx;
        if (x < 0 || x >= W || !(cells[y * W + x] & MASK)) continue;
        this.hit(x, y, amount, 1);
      }
    }
  };

  P.poisonCell = function (x, y, gen) {
    const cells = this.w.cells, i = y * W + x, c = cells[i];
    if ((c & POI) || this.pn >= D.POISON_CAP) return;
    const t = c & MASK;
    if (!t || MAT[t].hard) return;
    cells[i] = c | POI;
    this.poison[this.pn] = i;
    this.poisonGen[this.pn] = gen;
    this.pn++;
    this.dirty(x, y);
  };

  P.tickPoison = function () {
    const cells = this.w.cells, P_ = this.poison, G = this.poisonGen;
    const amt = Math.max(1, this.tDmg[B.venom]);
    const n0 = this.pn;
    let j = 0;
    for (let q = 0; q < n0; q++) {
      const i = P_[q], g = G[q];
      if (!(cells[i] & POI)) continue;      // broken by something else
      const x = i % W, y = (i / W) | 0;
      if (this.hit(x, y, amt, 1) === 1) {
        if (g < this.venomGen) {
          if (x > 0 && this.rng() < this.venomP) this.poisonCell(x - 1, y, g + 1);
          if (x < W - 1 && this.rng() < this.venomP) this.poisonCell(x + 1, y, g + 1);
          if (y > 0 && this.rng() < this.venomP) this.poisonCell(x, y - 1, g + 1);
          if (y < H - 1 && this.rng() < this.venomP) this.poisonCell(x, y + 1, g + 1);
        }
      } else {
        P_[j] = i; G[j] = g; j++;
      }
    }
    for (let q = n0; q < this.pn; q++) { P_[j] = P_[q]; G[j] = G[q]; j++; }
    this.pn = j;
  };

  P.ballHit = function (k, t, cx, cy) {
    if (t === B.bomb && this.cd[k] <= 0) {
      this.cd[k] = D.BOMB_COOLDOWN;
      this.explode(cx, cy, this.bombR, this.tDmg[t] * 2);
      return (this.w.cells[cy * W + cx] & MASK) === T.RELIC ? -1 : 0;
    }
    const r = this.hit(cx, cy, this.tDmg[t], t === B.midas ? this.midas : 1);
    if (t === B.venom && r === 0) this.poisonCell(cx, cy, 0);
    return r;
  };

  P.moveBalls = function (dt) {
    const cells = this.w.cells, n = this.n, rng = this.rng;
    const bx = this.bx, by = this.by, VX = this.vx, VY = this.vy, bt = this.bt, cd = this.cd, pl = this.pl;
    const seekGold = !this.s.found;
    const gx = this.w.gold.x + 0.5, gy = this.w.gold.y + 0.5;
    for (let k = 0; k < n; k++) {
      const t = bt[k];
      let x = bx[k], y = by[k], vx = VX[k], vy = VY[k];
      if (cd[k] > 0) cd[k] -= dt;
      let dist = this.tSpd[t] * dt, hits = 0;
      while (dist > 0 && hits < 3) {
        const st = dist < 0.9 ? dist : 0.9;
        dist -= st;
        let nx = x + vx * st, ny = y + vy * st;
        if (nx < 0) { nx = -nx; vx = -vx; } else if (nx >= W) { nx = 2 * W - nx - 0.01; vx = -vx; }
        if (ny < 0) { ny = -ny; vy = -vy; } else if (ny >= H) { ny = 2 * H - ny - 0.01; vy = -vy; }
        const cx = nx | 0, cy = ny | 0;
        if (!(cells[cy * W + cx] & MASK)) { x = nx; y = ny; continue; }
        hits++;
        const r = this.ballHit(k, t, cx, cy);
        if (r === 1 && pl[k] > 0) { pl[k]--; x = nx; y = ny; continue; }
        const ox = x | 0, oy = y | 0;
        if (cx !== ox && cy !== oy) {
          const sx = (cells[oy * W + cx] & MASK) !== 0, sy = (cells[cy * W + ox] & MASK) !== 0;
          if (sx && !sy) vx = -vx;
          else if (sy && !sx) vy = -vy;
          else { vx = -vx; vy = -vy; }
        } else if (cx !== ox) vx = -vx;
        else if (cy !== oy) vy = -vy;
        else {
          // Buried inside a cell. Dig out, unless it is a relic: then go home.
          if (r === -1) { x = this.s.drop.x; y = this.s.drop.y; }
          vx = -vx; vy = -vy;
        }
        pl[k] = this.pierceMax[t];
        if (t === B.lancer) {
          if (rng() < 0.2) { const tmp = vx; vx = vy; vy = -tmp; }
        } else if (t === B.seeker && seekGold) {
          // Re-aim at the gold after every bounce. Instinct narrows the spread.
          const a = Math.atan2(gy - y, gx - x) + (rng() - 0.5) * 1.8 / this.steer;
          vx = Math.cos(a); vy = Math.sin(a);
        } else {
          const a = (rng() - 0.5) * 0.3, c = Math.cos(a), sn = Math.sin(a);
          const nvx = vx * c - vy * sn;
          vy = vx * sn + vy * c; vx = nvx;
        }
      }
      bx[k] = x; by[k] = y; VX[k] = vx; VY[k] = vy;
    }
  };

  P.step = function (dt) {
    const s = this.s;
    s.playTime += dt;
    this.moveBalls(dt);
    this.poisonT += dt;
    while (this.poisonT >= D.POISON_TICK) { this.poisonT -= D.POISON_TICK; this.tickPoison(); }
    this.rateT += dt;
    if (this.rateT >= 1) {
      this.rateT -= 1;
      this.hist.push(s.earned);
      if (this.hist.length > 11) this.hist.shift();
      s.rate = this.hist.length > 1 ? (this.hist[this.hist.length - 1] - this.hist[0]) / (this.hist.length - 1) : 0;
    }
  };

  // A tap on rock digs; a tap on open space moves the drop point.
  P.tap = function (wx, wy) {
    const x = Math.floor(wx), y = Math.floor(wy);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    const cells = this.w.cells, t = cells[y * W + x] & MASK;
    if (t === 0) { this.s.drop = { x: x + 0.5, y: y + 0.5 }; return 'drop'; }
    if (t === T.RELIC) return 'relic';
    const R = this.tapR;
    for (let dy = -R; dy <= R; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= H) continue;
      const span = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -span; dx <= span; dx++) {
        const xx = x + dx;
        if (xx < 0 || xx >= W || !(cells[yy * W + xx] & MASK)) continue;
        this.hit(xx, yy, this.tapDmg, 1);
      }
    }
    return 'dig';
  };

  // ---- shop ----
  P.unlocked = function (t) {
    const b = BALLS[t];
    return this.s.earned >= b.unlock || this.s.owned[b.key] > 0;
  };
  const unitCost = (b, n) => b.cost * Math.pow(1 + n / D.COST_K, D.COST_EXP);
  P.ballCost = function (t, count) {
    const b = BALLS[t], o = this.s.owned[b.key];
    let sum = 0;
    for (let i = 0; i < count; i++) sum += unitCost(b, o + i);
    return sum;
  };
  P.maxBuy = function (t) {
    const b = BALLS[t], room = D.MAX_BALLS - this.n;
    let o = this.s.owned[b.key], left = this.s.bits, c = 0;
    while (c < room) {
      const u = unitCost(b, o);
      if (u > left) break;
      left -= u; o++; c++;
    }
    return c;
  };
  P.buyBall = function (t, count) {
    if (!this.unlocked(t)) return 0;
    count = Math.min(count, D.MAX_BALLS - this.n);
    if (count <= 0) return 0;
    const cost = this.ballCost(t, count);
    if (cost > this.s.bits) return 0;
    this.s.bits -= cost;
    this.s.owned[BALLS[t].key] += count;
    for (let i = 0; i < count; i++) this.spawn(t, this.s.drop.x, this.s.drop.y);
    return count;
  };

  P.ballUpMax = function (t, kind) {
    const b = BALLS[t];
    return kind === 'sp' ? (b.special ? b.special.max : 0) : D.BALL_UP[kind].max;
  };
  P.ballUpCost = function (t, kind) {
    const b = BALLS[t], U = D.BALL_UP[kind];
    return b.cost * U.mul * Math.pow(U.grow, this.s.up[b.key][kind]);
  };
  P.buyBallUp = function (t, kind) {
    const b = BALLS[t], lv = this.s.up[b.key];
    if (!this.s.owned[b.key] || lv[kind] >= this.ballUpMax(t, kind)) return false;
    const cost = this.ballUpCost(t, kind);
    if (cost > this.s.bits) return false;
    this.s.bits -= cost;
    lv[kind]++;
    this.derive();
    return true;
  };

  P.upDef = key => D.UP.find(u => u.key === key);
  P.upCost = function (key) {
    const u = this.upDef(key), lvl = this.s.global[key];
    if (lvl >= u.max) return Infinity;
    return u.costs ? u.costs[lvl] : u.cost * Math.pow(u.grow, lvl);
  };
  P.buyUp = function (key) {
    const cost = this.upCost(key);
    if (cost > this.s.bits) return false;
    this.s.bits -= cost;
    this.s.global[key]++;
    this.derive();
    return true;
  };

  // Bits paid for time away, at a share of the last measured income.
  P.offline = function (seconds) {
    const sec = Math.min(Math.max(0, seconds), D.OFFLINE_CAP);
    const gain = sec * (this.s.rate || 0) * D.OFFLINE_RATE;
    this.s.bits += gain; this.s.earned += gain; this.s.lifetime += gain;
    return { seconds: sec, gain };
  };

  // ---- persistence of balls ----
  P.exportBalls = function () {
    const out = new Float32Array(this.n * 5);
    for (let k = 0; k < this.n; k++) {
      out.set([this.bx[k], this.by[k], this.vx[k], this.vy[k], this.bt[k]], k * 5);
    }
    return out;
  };
  P.importBalls = function (arr) {
    this.n = 0;
    const cells = this.w.cells;
    for (let o = 0; o + 4 < arr.length && this.n < D.MAX_BALLS; o += 5) {
      const t = arr[o + 4] | 0;
      if (t < 0 || t >= BALLS.length) continue;
      let x = arr[o], y = arr[o + 1];
      if (!(x >= 0 && x < W && y >= 0 && y < H) || (cells[(y | 0) * W + (x | 0)] & MASK) === T.RELIC) {
        x = this.s.drop.x; y = this.s.drop.y;
      }
      const k = this.n;
      this.spawn(t, x, y);
      const vx = arr[o + 2], vy = arr[o + 3], l = Math.hypot(vx, vy);
      if (l > 0.5) { this.vx[k] = vx / l; this.vy[k] = vy / l; }
    }
  };
  // Balls the player owns but that are not in the world (first start, lost save).
  P.spawnMissing = function () {
    const have = BALLS.map(() => 0);
    for (let k = 0; k < this.n; k++) have[this.bt[k]]++;
    BALLS.forEach((b, t) => {
      for (let i = have[t]; i < this.s.owned[b.key]; i++) this.spawn(t, this.s.drop.x, this.s.drop.y);
    });
  };

  // State for the next world after finding the Golden Pixel.
  function prestige(s, seed) {
    const next = newState(seed);
    next.stars = s.stars + (s.found ? 1 : 0);
    next.lifetime = s.lifetime;
    next.settings = s.settings;
    next.buyMode = s.buyMode;
    return next;
  }

  PQ.Sim = Sim;
  PQ.newState = newState;
  PQ.prestige = prestige;
  PQ.BALL = B;
})();
