<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Quarry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Ten million pixels, one of them gold. Buy balls, mine the world, find the Golden Pixel.">
<meta name="theme-color" content="#0f0d15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Quarry">
<link rel="manifest" href="manifest.webmanifest"><!--pwa-->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><!--pwa-->
<link rel="icon" type="image/png" href="icons/icon-192.png"><!--pwa-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: the quarry canvas fills the screen; a translucent HUD strip rides the top,
   a pull-up shop sheet sits at the bottom. One deliberate dark world, one gold accent. */
:root {
  --ground: #0f0d15;
  --panel: #18151f;
  --panel-2: #221e2c;
  --line: #312b3f;
  --ink: #ece6d8;
  --muted: #9a93a8;
  --gold: #ffd640;
  --gold-ink: #1c1604;
  --warn: #ff6a58;
  --display: 'Pixelify Sans', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ---- HUD ---- */
.hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 18px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  background: linear-gradient(to bottom, rgba(15, 13, 21, 0.88) 55%, rgba(15, 13, 21, 0));
  pointer-events: none;
}
.hud > * { pointer-events: auto; min-width: 0; }
.bits {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 700 30px/1 var(--display);
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.bits::before {
  content: '';
  flex: none;
  width: 13px; height: 13px;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(255, 214, 64, 0.55);
}
.rate { margin-top: 5px; font: 500 17px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.hud-right { text-align: right; }
.ballcount { font: 500 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.ballcount small { font: 13px var(--body); color: var(--muted); }
.mini-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.chip {
  min-height: 34px;
  padding: 0 12px;
  background: rgba(24, 21, 31, 0.9);
  border: 1px solid var(--line);
  font-size: 13px;
  letter-spacing: 0.04em;
}
.chip:active { background: var(--panel-2); }

.radar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  padding: 5px 10px;
  background: rgba(24, 21, 31, 0.9);
  border: 1px solid var(--line);
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.radar[hidden] { display: none; }
.heat { flex: none; width: 64px; height: 6px; background: var(--line); }
.heat i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #4aa8ff, var(--gold) 65%, var(--warn)) 0 0 / 64px 100%;
  transition: width 0.4s;
}

/* ---- shop sheet ---- */
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
}
@media (min-width: 561px) { .sheet { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.sheet-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 6px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
.tabs button {
  position: relative;
  min-height: 44px;
  padding: 0 10px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  font: 500 16px var(--display);
  color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.dot { position: absolute; top: 9px; right: 2px; width: 6px; height: 6px; background: var(--gold); }
.buyrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.buymode { display: flex; border: 1px solid var(--line); flex: none; }
.buymode button {
  min-height: 32px;
  min-width: 38px;
  padding: 0 7px;
  background: none;
  border: 0;
  font-size: 13px;
  color: var(--muted);
}
.buymode button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
.grip {
  flex: none;
  width: 36px; height: 36px;
  background: none;
  border: 1px solid var(--line);
  position: relative;
}
.grip::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 10px; height: 10px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: translate(-50%, -75%) rotate(45deg);
}
.sheet:not(.open) .grip::before { transform: translate(-50%, -25%) rotate(-135deg); }
.sheet-body {
  max-height: 0;
  overflow: hidden;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  transition: max-height 0.22s ease;
}
.sheet.open .sheet-body { max-height: 40vh; max-height: 40dvh; overflow-y: auto; overscroll-behavior: contain; }
.panel { padding-bottom: 12px; }

.group-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 0 2px;
  font: 500 13px var(--display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.row {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row.plain { grid-template-columns: minmax(0, 1fr) auto; }
.swatch { width: 14px; height: 14px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45); }
.name { font: 500 17px/1.2 var(--display); }
.name .count, .name .lv { font: 13px var(--body); color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.desc { margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.row.locked .name, .row.locked .swatch { opacity: 0.45; filter: grayscale(1); }
.row.mystery .swatch { background: var(--line); }
.row.ready .swatch { animation: pulse 1.2s ease-in-out infinite; }
.row.ready .buy:not(:disabled) { background: rgba(255, 214, 64, 0.12); }
.prog { height: 4px; margin-top: 6px; background: var(--line); }
.prog i { display: block; height: 100%; width: 0; background: var(--gold); }
.prog[hidden] { display: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 214, 64, 0.35); } }

/* Unlock reveal: the new ball bouncing on a strip of rock */
.reveal { position: relative; height: 72px; margin: -4px 0 10px; border-bottom: 3px solid var(--line); overflow: hidden; }
.reveal i {
  position: absolute; left: calc(50% - 9px); bottom: 0; width: 18px; height: 18px;
  background: var(--c); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
  animation: hop 0.9s cubic-bezier(0.3, 0, 0.7, 1) infinite alternate;
}
@keyframes hop { from { transform: translateY(0) scaleY(0.8); } 20% { transform: translateY(-6px) scaleY(1); } to { transform: translateY(-50px); } }
.kicker { margin: 0; font: 500 12px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .reveal i, .row.ready .swatch { animation: none; } }
.buy {
  min-width: 96px;
  min-height: 46px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 1px;
  padding: 5px 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.buy .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.buy .cost { font: 500 16px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.buy.afford { border-color: rgba(255, 214, 64, 0.6); }
.buy:disabled { cursor: default; opacity: 0.5; }
.buy:disabled .cost { color: var(--muted); }
.buy:not(:disabled):active { transform: translateY(1px); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 12px 0 4px; }
.stats div { min-width: 0; }
.stats dt { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 500 19px var(--display); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn {
  min-height: 44px;
  padding: 0 14px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 14px;
}
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--gold); }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.confirm { margin-top: 10px; padding: 12px; border: 1px solid var(--warn); }
.confirm p { margin: 0 0 8px; font-size: 14px; }
textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 84px;
  margin-top: 8px;
  padding: 8px;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--line);
  font: 11px/1.3 ui-monospace, Menlo, monospace;
  -webkit-user-select: text;
  user-select: text;
  word-break: break-all;
}

/* ---- toast, modal, loading ---- */
.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 96px);
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 8px 14px;
  background: rgba(24, 21, 31, 0.96);
  border: 1px solid var(--line);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
}
.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(6, 5, 9, 0.72);
}
.modal[hidden] { display: none; }
.card {
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 22px 20px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.card h2 { margin: 0 0 10px; font: 700 26px/1.1 var(--display); color: var(--gold); text-wrap: balance; }
.card p { margin: 0 0 10px; color: var(--ink); line-height: 1.45; }
.card p.sub { color: var(--muted); font-size: 14px; }
.card ul { margin: 0 0 12px; padding-left: 18px; color: var(--muted); font-size: 14px; }
.card li { margin: 4px 0; }
.card .actions { margin-top: 16px; }
.card .big { font: 700 34px var(--display); color: var(--gold); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }

.loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 18px;
  background: var(--ground);
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.loading[hidden] { display: none; }
.logo { font: 700 40px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.logo b { color: var(--gold); margin-left: 10px; font-weight: 700; }
.bar { width: 220px; max-width: 70vw; height: 8px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); }
#loadText { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .sheet-body, .heat i { transition: none; }
}

</style>
</head>
<body>
<canvas id="world" aria-label="The quarry. Drag to look around, pinch to zoom, tap rock to dig, tap open space to move the drop point."></canvas>

<header class="hud">
  <div class="hud-left">
    <div class="bits" id="bits" aria-live="off">0</div>
    <div class="rate" id="rate">+0 bits/s</div>
    <div class="radar" id="radar" title="Gold radar: how close your nearest ball is to the Golden Pixel" hidden>
      <span class="heat"><i id="heat"></i></span>
      <span id="radarText">Cold</span>
    </div>
  </div>
  <div class="hud-right">
    <div class="ballcount"><span id="ballCount">1</span> <small>balls</small></div>
    <div class="mini-btns">
      <button class="chip" id="btnDrop" type="button" title="Jump to the drop point">Drop</button>
      <button class="chip" id="btnMap" type="button" title="Zoom out to the whole world">Map</button>
    </div>
  </div>
</header>

<section class="sheet open" id="sheet" aria-label="Shop">
  <div class="sheet-bar">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-balls" data-tab="balls" aria-selected="true">Balls<span class="dot" id="ballDot" hidden></span></button>
      <button type="button" role="tab" id="tab-upgrades" data-tab="upgrades" aria-selected="false">Upgrades<span class="dot" id="upDot" hidden></span></button>
      <button type="button" role="tab" id="tab-stars" data-tab="stars" aria-selected="false">Stars<span class="dot" id="starDot" hidden></span></button>
      <button type="button" role="tab" id="tab-world" data-tab="world" aria-selected="false">World</button>
    </nav>
    <button type="button" class="grip" id="grip" aria-label="Hide shop" aria-expanded="true"></button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="panel" id="panel-balls" role="tabpanel"></div>
    <div class="panel" id="panel-upgrades" role="tabpanel" hidden></div>
    <div class="panel" id="panel-stars" role="tabpanel" hidden></div>
    <div class="panel" id="panel-world" role="tabpanel" hidden></div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<div class="loading" id="loading">
  <div class="logo">Pixel<b>Quarry</b></div>
  <div class="bar"><i id="loadBar"></i></div>
  <p id="loadText">Generating 10,000,000 pixels</p>
</div>

<script>
// Pixel Quarry: all tables and constants. No logic lives here.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ = root.PQ || {};

  const W = 2500, H = 4000;               // 10,000,000 pixels

  PQ.DATA = {
    W, H, N: W * H,
    TILE: 128,                              // render tile edge, world px
    OV: 2,                                  // overview downscale factor
    SURFACE: 220,                           // mean ground line, rows from the top
    MAX_BALLS: 4000,
    FOG: 4,                                 // fog-of-war cell edge, world px (code shifts by 2: keep it 4)
    SIGHT: 20,                              // how far a ball lights up the rock around it, px
    RELIC_REWARD_S: 30,                     // a relic find pays this many seconds of income
    TYPE_MASK: 0x0f,
    POISON: 0x80,

    // Cell types. hp = hits of 1 damage, val = bits paid when broken.
    // col = base colour; the renderer derives shades from it.
    MAT: [
      { id: 0,  key: 'air',      name: 'Air' },
      { id: 1,  key: 'grass',    name: 'Turf',      hp: 1,   val: 1,   col: [86, 148, 70] },
      { id: 2,  key: 'soil',     name: 'Topsoil',   hp: 1,   val: 1,   col: [122, 86, 58] },
      { id: 3,  key: 'clay',     name: 'Clay',      hp: 3,   val: 4,   col: [168, 104, 72] },
      { id: 4,  key: 'stone',    name: 'Stone',     hp: 8,   val: 14,  col: [118, 116, 122] },
      { id: 5,  key: 'basalt',   name: 'Basalt',    hp: 40,  val: 60,  col: [66, 64, 78] },
      { id: 6,  key: 'obsidian', name: 'Obsidian',  hp: 140, val: 240, col: [38, 28, 54] },
      { id: 7,  key: 'copper',   name: 'Copper',    hp: 6,   val: 60,  col: [214, 122, 62] },
      { id: 8,  key: 'silver',   name: 'Silver',    hp: 20,  val: 400, col: [196, 210, 222] },
      { id: 9,  key: 'amethyst', name: 'Amethyst',  hp: 50,  val: 3000, col: [178, 92, 232] },
      { id: 10, key: 'relic',    name: 'Relic',     hard: true,         col: [222, 200, 150] },
      { id: 11, key: 'gold',     name: 'Golden Pixel', hp: 200, val: 0, col: [255, 206, 46] },
      // Deep rock: only in worlds past the first (see DEPTH). hp tops out at 255, the dmg byte.
      { id: 12, key: 'magma',    name: 'Magma rock', hp: 210, val: 420, col: [132, 50, 32] },
      { id: 13, key: 'adamant',  name: 'Adamant',    hp: 255, val: 700, col: [44, 74, 88] },
    ],
    T: { AIR: 0, GRASS: 1, SOIL: 2, CLAY: 3, STONE: 4, BASALT: 5, OBSIDIAN: 6,
         COPPER: 7, SILVER: 8, AMETHYST: 9, RELIC: 10, GOLD: 11, MAGMA: 12, ADAMANT: 13 },

    // Ball types. speed in world px/s, dmg per hit, cost grows by GROWTH per owned.
    // unlock = bits earned in the current world before the type can be bought.
    BALLS: [
      { key: 'pebble', name: 'Pebble', color: '#e9e4d6', dmg: 1,  speed: 46,  cost: 15,     unlock: 0,
        desc: 'Bounces around and chips whatever it hits.' },
      { key: 'lancer', name: 'Lancer', color: '#4aa8ff', dmg: 3,  speed: 120, cost: 400,    unlock: 300,
        desc: 'Only travels in straight lines. Cuts long, clean tunnels.',
        special: { key: 'pierce', name: 'Pierce', desc: 'Keeps going through 1 more broken pixel', max: 10, base: 0, step: 1 } },
      { key: 'bomb',   name: 'Bomb',   color: '#ff5a48', dmg: 2,  speed: 50,  cost: 4000,   unlock: 3500,
        desc: 'Blows out a circle of pixels on impact, then recharges.',
        special: { key: 'radius', name: 'Blast radius', desc: '+1 px blast radius', max: 10, base: 4, step: 1 } },
      { key: 'venom',  name: 'Venom',  color: '#6fe05a', dmg: 2,  speed: 52,  cost: 40000,  unlock: 35000,
        desc: 'Poisons what it touches. Poison eats outward through the rock.',
        special: { key: 'spread', name: 'Virulence', desc: 'Poison spreads further', max: 8, base: 0, step: 1 } },
      { key: 'midas',  name: 'Midas',  color: '#ff9b2e', dmg: 4,  speed: 60,  cost: 400000, unlock: 300000,
        desc: 'Every pixel it breaks pays out several times over.',
        special: { key: 'mult', name: 'Alchemy', desc: '+1× payout', max: 12, base: 4, step: 1 } },
      { key: 'drill',  name: 'Drill',  color: '#b46cff', dmg: 30, speed: 40,  cost: 1.2e7,  unlock: 8e6,
        desc: 'Bores straight through anything it can break in one hit.' },
      { key: 'seeker', name: 'Seeker', color: '#37e2d6', dmg: 60, speed: 70,  cost: 2.5e8,  unlock: 1.5e8,
        desc: 'Homes in on the Golden Pixel, boring through soft rock on the way.',
        special: { key: 'steer', name: 'Instinct', desc: 'Steers harder toward the gold', max: 8, base: 1, step: 1 } },
    ],
    // A ball type is unlocked by hand once its `unlock` bits are earned: UNLOCK_MULT x its cost,
    // and the first ball comes with it.
    UNLOCK_MULT: 2,
    // Owning this many of a type multiplies what that type earns by MILESTONE_MULT, each time.
    MILESTONES: [10, 25, 50, 100, 200, 400, 800, 1600],
    MILESTONE_MULT: 1.5,
    // Scales every pixel's value; the main dial for how long a world takes.
    VALUE_SCALE: 0.25,
    // Ball n of a type costs cost * (1 + n / COST_K)^COST_EXP, so swarms of thousands stay reachable.
    COST_K: 8,
    COST_EXP: 2,

    // Per-ball-type upgrades: cost = ball.cost * mul * grow^level
    BALL_UP: {
      dmg: { name: 'Damage', mul: 6, grow: 2.6, max: 25, desc: '+60% damage' },
      spd: { name: 'Speed',  mul: 4, grow: 2.2, max: 12, desc: '+15% speed' },
      sp:  { mul: 10, grow: 3.0 },
    },

    // Global upgrades
    UP: [
      { key: 'tap',   name: 'Pickaxe',   desc: 'Tapping rock hits harder and wider.', cost: 40,    grow: 2.4, max: 40 },

<script>
// Pixel Quarry: world generation. Same seed always gives the same world, which
// is what lets a save store only which pixels were mined.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T;
  const W = D.W, H = D.H, N = D.N;
  const FW = Math.ceil(W / D.FOG), FH = Math.ceil(H / D.FOG);

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function hash2(x, y, s) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(x - xi), v = smooth(y - yi);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s);
    const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  function vnoise1(x, s) {
    const xi = Math.floor(x), u = smooth(x - xi);
    const a = hash2(xi, 0, s), b = hash2(xi + 1, 0, s);
    return a + (b - a) * u;
  }

  // Low-frequency noise sampled every `step` px along a row and lerped between.
  function rowNoise(buf, y, fx, fy, s, step) {
    let prev = vnoise(0, y * fy, s);
    for (let x0 = 0; x0 < W; x0 += step) {
      const next = vnoise((x0 + step) * fx, y * fy, s);
      const end = Math.min(W, x0 + step);
      for (let x = x0; x < end; x++) buf[x] = prev + (next - prev) * ((x - x0) / step);
      prev = next;
    }
  }

  function create(seed, depth) {
    return {
      W, H, N, seed: seed >>> 0,
      depth: depth | 0,                     // worlds cleared before this one: deeper, harder rock
      cells: new Uint8Array(N),
      dmg: new Uint8Array(N),
      mined: new Uint8Array((N + 7) >> 3),
      surface: new Int16Array(W),
      fog: new Uint8Array(FW * FH),         // 0 hidden .. 255 seen, one per FOG x FOG cell
      relicCell: new Uint8Array(FW * FH),   // relic index + 1 for fog cells that hold relic pixels
      FW, FH,
      relics: [],
      gold: { x: 0, y: 0 },
      solidTotal: 0,
      minedCount: 0,
    };
  }

  function prepare(w) {
    const s = w.seed;
    for (let x = 0; x < W; x++) {
      w.surface[x] = Math.round(D.SURFACE
        + (vnoise1(x / 260, s + 1) - 0.5) * 110
        + (vnoise1(x / 48, s + 2) - 0.5) * 26
        + (vnoise1(x / 9, s + 3) - 0.5) * 4);
    }
  }

  const warpBuf = new Float32Array(W), caveA = new Float32Array(W), caveB = new Float32Array(W);

  function genRows(w, y0, y1) {
    const s = w.seed, cells = w.cells, surface = w.surface;
    const magmaF = D.DEPTH.magma(w.depth), adamF = D.DEPTH.adamant(w.depth);
    for (let y = y0; y < y1; y++) {
      rowNoise(warpBuf, y, 1 / 140, 1 / 140, s + 4, 16);
      rowNoise(caveA, y, 1 / 90, 1 / 55, s + 5, 8);
      rowNoise(caveB, y, 1 / 26, 1 / 26, s + 6, 4);
      const caveThr = 0.70 - 0.05 * (y / H);
      const row = y * W;
      let blk = 1;
      for (let x = 0; x < W; x++) {
        if ((x & 15) === 0) blk = hash2(x >> 4, y >> 4, s + 8);
        const sf = surface[x];
        let t;
        if (y < sf) t = T.AIR;
        else {
          const d = y - sf;
          if (d < 3) t = T.GRASS;
          else {
            const f = (y + (warpBuf[x] - 0.5) * 170) / H;
            t = f < 0.17 ? T.SOIL : f < 0.33 ? T.CLAY : f < 0.56 ? T.STONE : f < 0.80 ? T.BASALT : T.OBSIDIAN;
            if (f >= magmaF) t = f >= adamF ? T.ADAMANT : T.MAGMA;
            if (d > 26) {
              if (caveA[x] * 0.62 + caveB[x] * 0.38 > caveThr) t = T.AIR;
              else if (blk < 0.12 && vnoise(x / 5, y / 5, s + 9) > 0.64) {
                if (f < 0.30) t = T.COPPER;
                else if (f < 0.60) t = blk < 0.04 ? T.SILVER : T.COPPER;
                else t = blk < 0.015 ? T.AMETHYST : blk < 0.06 ? T.SILVER : T.COPPER;
              }
            }
          }
        }
        cells[row + x] = t;
      }
    }
  }

  function overlaps(list, x0, y0, x1, y1, pad) {
    for (const r of list) {
      if (x0 < r.x1 + pad && x1 > r.x0 - pad && y0 < r.y1 + pad && y1 > r.y0 - pad) return true;
    }
    return false;
  }

  // Relics, the Golden Pixel and the solid-pixel count. Run after every row exists.
  function finalize(w) {
    const rng = mulberry32(w.seed ^ 0x9e3779b9);
    const cells = w.cells;
    w.relics = PQ.Relics.place(w, rng);

    // The Golden Pixel sits deep, fully buried, away from relics. Deeper worlds bury it lower.
    const top = Math.floor(H * D.DEPTH.goldTop(w.depth));
    for (let tries = 0; tries < 5000; tries++) {
      const x = 60 + Math.floor(rng() * (W - 120));
      const y = top + Math.floor(rng() * (H - 50 - top));
      if (overlaps(w.relics, x, y, x + 1, y + 1, 12)) continue;
      let buried = true;
      for (let dy = -2; dy <= 2 && buried; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const t = cells[(y + dy) * W + x + dx];
          if (t === T.AIR || t === T.RELIC) { buried = false; break; }
        }
      }
      if (!buried) continue;
      cells[y * W + x] = T.GOLD;
      w.gold = { x, y };
      break;
    }

    let solid = 0;
    for (let i = 0; i < N; i++) { const t = cells[i]; if (t !== T.AIR && t !== T.RELIC) solid++; }
    w.solidTotal = solid;

    w.relicCell.fill(0);
    w.relics.forEach((r, idx) => {
      for (let y = Math.max(0, r.y0); y < Math.min(H, r.y1); y++) {
        for (let x = Math.max(0, r.x0); x < Math.min(W, r.x1); x++) {
          if (cells[y * W + x] === T.RELIC) w.relicCell[(y >> 2) * FW + (x >> 2)] = idx + 1;
        }
      }
    });
    initFog(w);
  }

  // The sky and a thin skin of ground start uncovered; everything below is fog.
  function initFog(w) {
    w.fog.fill(0);
    for (let cx = 0; cx < FW; cx++) {
      let sf = H;
      for (let x = cx * 4; x < Math.min(W, cx * 4 + 4); x++) sf = Math.min(sf, w.surface[x]);
      const rows = Math.min(FH, Math.ceil((sf + 10) / 4));
      for (let cy = 0; cy < rows; cy++) w.fog[cy * FW + cx] = 255;
    }
  }

  // For saves made before fog existed: uncover everything already mined, plus a margin.
  function fogFromMined(w) {
    const fog = w.fog, m = w.mined;
    for (let b = 0; b < m.length; b++) {
      if (!m[b]) continue;
      for (let k = 0; k < 8; k++) {
        if (!((m[b] >> k) & 1)) continue;
        const i = (b << 3) + k, x = i % W, y = (i / W) | 0;
        fog[(y >> 2) * FW + (x >> 2)] = 255;
      }
    }
    for (let pass = 0; pass < 4; pass++) {
      const src = fog.slice();
      for (let cy = 0; cy < FH; cy++) {
        for (let cx = 0; cx < FW; cx++) {
          const k = cy * FW + cx;
          if (src[k] === 255) continue;
          if ((cx > 0 && src[k - 1] === 255) || (cx < FW - 1 && src[k + 1] === 255) ||
              (cy > 0 && src[k - FW] === 255) || (cy < FH - 1 && src[k + FW] === 255)) fog[k] = 255;
        }
      }
    }
  }

  function generate(w) {
    prepare(w);
    genRows(w, 0, H);
    finalize(w);
    return w;
  }

  // Re-applies a save's mined bitset to a freshly generated world. With keepGold,
  // the Golden Pixel survives even if the save mined that spot (a save made before
  // a world-generation change can point at rock that is now the gold).
  function applyMined(w, bits, keepGold) {
    const cells = w.cells, goldI = w.gold.y * W + w.gold.x;
    let count = 0;
    const len = Math.min(bits.length, w.mined.length);
    for (let b = 0; b < len; b++) {
      const v = bits[b];
      if (!v) continue;
      for (let k = 0; k < 8; k++) {
        if ((v >> k) & 1) {
          const i = (b << 3) + k;
          if (i < N && cells[i] !== T.RELIC && !(keepGold && i === goldI)) { cells[i] = T.AIR; count++; }
        }
      }
      w.mined[b] = v;
    }
    w.minedCount = count;
  }

  PQ.World = { create, prepare, genRows, finalize, generate, applyMined, initFog, fogFromMined, mulberry32, hash2, vnoise };
})();

<script>
// Pixel Quarry: relics. Each one is a 2D distance field at 1 px resolution, lit as
// a bevelled height field and textured by material. Relic cells are unbreakable;
// their dmg byte holds the shaded tone (material << 5 | brightness 0..31).
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, W = D.W, H = D.H;
  const hyp = Math.hypot;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const M = { BONE: 0, STAIN: 1, IRON: 2, RUST: 3, BRONZE: 4, VERDI: 5, CLAY: 6, FOSSIL: 7 };

  // ---- distance-field primitives (negative inside) ----
  const circle = (x, y, cx, cy, r) => hyp(x - cx, y - cy) - r;
  const ring = (x, y, cx, cy, r, t) => Math.abs(hyp(x - cx, y - cy) - r) - t;
  function capsule(x, y, ax, ay, bx, by, ra, rb) {
    const pax = x - ax, pay = y - ay, bax = bx - ax, bay = by - ay;
    const h = clamp((pax * bax + pay * bay) / (bax * bax + bay * bay), 0, 1);
    return hyp(pax - bax * h, pay - bay * h) - (ra + (rb - ra) * h);
  }
  function ellipse(x, y, cx, cy, rx, ry) {
    return (hyp((x - cx) / rx, (y - cy) / ry) - 1) * Math.min(rx, ry);
  }
  function box(x, y, cx, cy, hx, hy, r) {
    const qx = Math.abs(x - cx) - hx + r, qy = Math.abs(y - cy) - hy + r;
    return hyp(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
  }
  function smin(a, b, k) {
    const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
    return b + (a - b) * h - k * h * (1 - h);
  }
  const noise = (x, y, s) => PQ.World.vnoise(x, y, s);

  // ---- the relics; coordinates are px at scale 1, origin at the centre ----
  const KINDS = [
    {
      name: 'Femur', weight: 3, hw: 78, hh: 24, bevel: 7, tilt: Math.PI, base: M.BONE,
      sdf(x, y) {
        const yb = y - 4 * (1 - (x / 62) * (x / 62));            // a slight bow in the shaft
        let d = capsule(x, yb, -48, 0, 48, 0, 6.5, 7);
        d = smin(d, capsule(x, y, -50, 0, -62, -7, 7, 8), 5);      // neck
        d = smin(d, circle(x, y, -65, -9, 11.5), 4);              // head
        d = smin(d, circle(x, y, -55, 8, 8), 5);                  // trochanter
        d = smin(d, box(x, y, 54, 1, 6, 12, 4), 6);
        d = smin(d, circle(x, y, 61, -6, 10.5), 5);               // condyles
        d = smin(d, circle(x, y, 62, 8, 10.5), 5);
        return Math.max(d, -ellipse(x, y, 67, 1, 3.5, 2.5));      // notch between condyles
      },
    },
    {
      name: 'Spine and ribs', weight: 2, hw: 84, hh: 74, bevel: 5, tilt: 0.5, base: M.BONE,
      sdf(x, y) {
        let d = 1e9;
        for (let i = 0; i < 7; i++) {
          const vx = -66 + i * 21, vy = -40 + 5 * Math.sin(i * 0.7);
          if (x < vx - 16 || x > vx + 38) continue;               // too far to matter
          const L = 1.15 - Math.abs(i - 3) * 0.1;                  // middle ribs longest
          if (x < vx + 16) {
            d = Math.min(d, box(x, y, vx, vy, 9, 7, 3.5));        // vertebra
            d = smin(d, capsule(x, y, vx, vy - 5, vx + 7, vy - 21, 3.6, 1.8), 3);   // spinous process
          }
          if (x < vx - 10 || y < vy - 8) continue;
          // A rib arcs out from the spine and sweeps back as it drops.
          let r = 1e9, px = vx + 3, py = vy + 4;
          for (let k = 1; k <= 5; k++) {
            const a = 0.15 + k * 0.32, nx = vx + 3 + Math.sin(a) * 26 * L - k * 2, ny = vy + 4 + (1 - Math.cos(a)) * 40 * L + k * 8 * L;
            r = smin(r, capsule(x, y, px, py, nx, ny, 3.3 - k * 0.3, 3.3 - (k + 1) * 0.3), 2.5);
            px = nx; py = ny;
          }
          d = Math.min(d, r);
        }
        return d;
      },
    },
    {
      name: 'Canid skull', weight: 2, hw: 74, hh: 40, bevel: 9, tilt: 0.6, base: M.BONE,
      sdf(x, y) {
        let d = ellipse(x, y, 20, -8, 40, 27);                    // braincase
        d = smin(d, circle(x, y, 52, -2, 15), 8);                 // back of the skull
        d = smin(d, capsule(x, y, -6, 0, -62, 10, 19, 8), 10);    // muzzle
        d = smin(d, capsule(x, y, 0, -34, 50, -22, 2.5, 2), 4);   // sagittal crest
        d = smin(d, capsule(x, y, -12, 10, 30, 12, 5, 4), 4);     // cheekbone
        d = Math.max(d, -circle(x, y, -6, -8, 10));               // eye socket
        d = Math.max(d, -ellipse(x, y, -64, 6, 5, 4));            // nostril
        d = Math.min(d, capsule(x, y, -46, 14, -49, 31, 4, 1.2)); // canine
        for (let i = 0; i < 5; i++) {
          const tx = -35 + i * 9;
          d = Math.min(d, capsule(x, y, tx, 15, tx + 1, i === 3 ? 26 : 22, 3.4, 1.2));
        }
        let j = capsule(x, y, -58, 31, 26, 31, 5.5, 8);           // lower jaw
        j = smin(j, capsule(x, y, 26, 31, 40, 14, 8, 7), 6);
        j = smin(j, circle(x, y, 43, 27, 6), 3);
        for (let i = 0; i < 4; i++) j = Math.min(j, capsule(x, y, -40 + i * 11, 26, -40 + i * 11, 21, 3, 1.2));
        return Math.min(d, j);
      },
    },
    {
      name: 'Ammonite', weight: 2, hw: 58, hh: 54, bevel: 6, tilt: Math.PI, base: M.FOSSIL,
      sdf(x, y) { return ellipse(x, y, 0, 0, 56, 52) + 1.5 * (noise(x / 5, y / 5, 11) - 0.5); },
      height(x, y) {
        const r = hyp(x, y) + 0.01, th = Math.atan2(y, x);
        let f = (Math.log(r / 2.5) / 0.16 - th) / (2 * Math.PI);
        f -= Math.floor(f);
        const tube = Math.sin(Math.PI * f);                      // each whorl is a rounded tube
        const ribs = Math.max(0, Math.sin(th * 26 + Math.log(r) * 4));
        return 0.3 + 0.7 * tube + 0.18 * ribs * tube;
      },
    },
    {
      name: 'Iron anchor', weight: 1, hw: 60, hh: 78, bevel: 4, tilt: 0.9, base: M.IRON,
      sdf(x, y) {
        let d = box(x, y, 0, -2, 4.5, 46, 2);                     // shank

        d = Math.min(d, box(x, y, 0, -38, 30, 4, 2), circle(x, y, -31, -38, 5), circle(x, y, 31, -38, 5));
        d = smin(d, Math.max(ring(x, y, 0, 0, 44, 5), 12 - y), 4); // arms
        d = Math.min(d, capsule(x, y, -40, 22, -50, 3, 9, 2), capsule(x, y, 40, 22, 50, 3, 9, 2));
        return smin(d, circle(x, y, 0, 44, 7), 4);                // crown
      },
    },
    {
      name: 'Bronze gear', weight: 1, hw: 50, hh: 50, bevel: 3, tilt: Math.PI, base: M.BRONZE,
      sdf(x, y) {
        const r = hyp(x, y), th = Math.atan2(y, x);
        const tooth = clamp((Math.cos(th * 12) + 0.15) * 2.2, 0, 1) * 7;
        let d = r - (39 + tooth);
        d = Math.max(d, 9 - r);                                   // axle hole
        const win = Math.max(Math.abs(r - 24) - 7.5, (Math.cos(th * 5) - 0.35) * r * 0.45);
        return Math.max(d, -win);                                  // windows between spokes
      },
      height(x, y) {
        const r = hyp(x, y);
        return r > 31 || r < 14 ? 1 : 0.72;                       // raised rim and hub
      },
    },
    {
      name: 'Amphora', weight: 1, hw: 40, hh: 70, bevel: 9, tilt: 1.2, base: M.CLAY,
      sdf(x, y) {
        let d = ellipse(x, y, 0, 8, 29, 42);
        d = smin(d, box(x, y, 0, -40, 9, 14, 3), 8);
        d = Math.min(d, box(x, y, 0, -55, 13, 3.5, 2));
        for (const s of [-1, 1]) {
          let hnd = capsule(x, y, s * 9, -48, s * 22, -46, 3, 3);
          hnd = smin(hnd, capsule(x, y, s * 22, -46, s * 26, -26, 3, 3.2), 3);
          d = smin(d, hnd, 3);

        d = smin(d, capsule(x, y, 0, 46, 0, 64, 9, 4), 6);         // foot

      },
      mat(x, y) { return (y > -20 && y < -15) || (y > 17 && y < 22) || (y > 27 && y < 29) ? M.STAIN : M.CLAY; },
    },
    {
      name: 'Sword', weight: 1, hw: 94, hh: 20, bevel: 4, tilt: Math.PI, base: M.IRON,
      sdf(x, y) {
        let d = capsule(x, y, -58, 0, 64, 0, 7, 1.2);              // blade
        d = Math.min(d, box(x, y, -62, 0, 3.5, 17, 2));            // crossguard
        d = Math.min(d, capsule(x, y, -66, 0, -82, 0, 3.2, 3.2));  // grip
        return Math.min(d, circle(x, y, -87, 0, 5.5));             // pommel
      },
      height(x, y) { return x > -55 ? 1 - 0.4 * Math.exp(-y * y / 1.5) : 1; },   // fuller
      mat(x) { return x < -59 ? M.BRONZE : M.IRON; },
    },
    {
      name: 'Pawprint slab', weight: 1, hw: 50, hh: 46, bevel: 5, tilt: 0.7, base: M.FOSSIL,
      sdf(x, y) { return box(x, y, 0, 0, 46, 42, 12) + 5 * (noise(x / 7, y / 7, 3) - 0.5); },
      height(x, y) {
        const dip = (cx, cy, rx, ry) => clamp(-ellipse(x, y, cx, cy, rx, ry) / 4, 0, 1);
        const sink = Math.max(dip(0, 14, 17, 13), dip(-22, -10, 7, 9), dip(-8, -23, 7, 9),
          dip(8, -23, 7, 9), dip(22, -10, 7, 9));

    },
  ];
  const TOTAL = KINDS.reduce((a, k) => a + k.weight, 0);

  const LX = -0.55, LY = -0.65, LZ = 0.53;

  // Rasterise one relic into the world, centred on (cx, cy), rotated by `a`, scaled by `s`.
  // Returns its bounding box.
  function stamp(w, kind, cx, cy, a, s, seed) {
    const R = Math.ceil(hyp(kind.hw, kind.hh) * s) + 2, n = 2 * R + 1;
    const x0 = cx - R, y0 = cy - R;
    const dist = new Float32Array(n * n).fill(1e9), ht = new Float32Array(n * n), prof = new Float32Array(n * n);
    const lxs = new Float32Array(n * n), lys = new Float32Array(n * n);
    const ca = Math.cos(a), sa = Math.sin(a), bevel = kind.bevel * s;
    // Coarse pass: a 4 px block whose centre is well outside the shape is skipped.
    const B = 4, nb = Math.ceil(n / B), far = new Uint8Array(nb * nb);
    for (let bj = 0; bj < nb; bj++) {
      for (let bi = 0; bi < nb; bi++) {
        const dx = bi * B + B / 2 - R, dy = bj * B + B / 2 - R;
        far[bj * nb + bi] = kind.sdf((dx * ca + dy * sa) / s, (-dx * sa + dy * ca) / s) * s > 7 ? 1 : 0;
      }
    }
    for (let j = 0; j < n; j++) {
      const y = y0 + j;
      if (y < 0 || y >= H) continue;
      for (let i = 0; i < n; i++) {
        const x = x0 + i;
        if (x < 0 || x >= W || far[((j / B) | 0) * nb + ((i / B) | 0)]) continue;
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        const lx = (dx * ca + dy * sa) / s, ly = (-dx * sa + dy * ca) / s;
        const k = j * n + i, d = kind.sdf(lx, ly) * s;
        dist[k] = d;
        if (d >= 0) continue;
        const u = Math.min(1, -d / bevel), p = Math.sqrt(1 - (1 - u) * (1 - u));
        prof[k] = p;
        ht[k] = bevel * p * (kind.height ? kind.height(lx, ly) : 1);
        lxs[k] = lx; lys[k] = ly;
      }
    }
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let j = 1; j < n - 1; j++) {
      for (let i = 1; i < n - 1; i++) {
        const k = j * n + i, d = dist[k];
        if (d >= 0) continue;
        const x = x0 + i, y = y0 + j, lx = lxs[k], ly = lys[k], p = prof[k];
        if (-d < 5 * s && noise(lx / 10, ly / 10, seed + 41) + noise(lx / 3, ly / 3, seed + 42) * 0.35 > 0.98 + (-d / (5 * s)) * 0.12) continue;   // still buried
        // Surface normal from the height field; light it.
        let nx = ht[k - 1] - ht[k + 1], ny = ht[k - n] - ht[k + n], nz = 2;
        const nl = hyp(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
        const diff = Math.max(0, nx * LX + ny * LY + nz * LZ);
        const nh = Math.max(0, (nx * HX + ny * HY + nz * HZ) / HL);

        let m = kind.mat ? kind.mat(lx, ly) : kind.base, mul = 1;
        const grain = PQ.World.hash2(x, y, seed + 40);
        if (m === M.BONE) {
          if (noise(lx / 18, ly / 18, seed + 31) * 0.7 + (1 - p) * 0.55 > 0.8) m = M.STAIN;
          mul = 1 + (noise(lx / 2.2, ly / 2.2, seed + 32) - 0.5) * 0.22;
          if (grain < 0.035) mul *= 0.72;                         // pores
        } else if (m === M.IRON) {
          if (noise(lx / 11, ly / 11, seed + 34) + (grain - 0.5) * 0.25 > 0.58) m = M.RUST;
          mul = 1 + (noise(lx / 1.7, ly / 1.7, seed + 35) - 0.5) * 0.3;
          if (grain < 0.07) mul *= 0.65;                          // pitting
        } else if (m === M.BRONZE) {
          if (noise(lx / 8, ly / 8, seed + 36) * 0.6 + (1 - p) * 0.7 > 0.72) m = M.VERDI;
          mul = 1 + (noise(lx / 2, ly / 2, seed + 37) - 0.5) * 0.14;
        } else if (m === M.CLAY) {
          mul = 1 + (noise(lx / 3, ly / 3, seed + 38) - 0.5) * 0.16;
          if (grain < 0.02) mul *= 0.8;
        } else if (m === M.FOSSIL) {
          mul = 1 + (noise(lx / 2.5, ly / 2.5, seed + 39) - 0.5) * 0.26 + (grain - 0.5) * 0.08;
        }
        if (m !== M.IRON && m !== M.RUST && Math.abs(noise(lx / 16, ly / 16, seed + 33) - 0.5) < 0.012) mul *= 0.45;   // hairline cracks
        if (-d < 1.1) mul *= 0.55;                                // dark rim where it meets the rock

        const shiny = m === M.IRON ? 0.35 : m === M.BRONZE ? 0.3 : m === M.BONE ? 0.1 : 0.04;
        const b = (0.2 + 0.8 * diff + shiny * Math.pow(nh, 20)) * mul;
        const tone = (m << 5) | clamp(Math.round(b * 31), 0, 31);
        const idx = y * W + x;
        w.cells[idx] = T.RELIC;
        w.dmg[idx] = tone;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    return { x0: minX, y0: minY, x1: maxX + 1, y1: maxY + 1 };
  }

  function overlaps(list, x0, y0, x1, y1, pad) {
    for (const r of list) {
      if (x0 < r.x1 + pad && x1 > r.x0 - pad && y0 < r.y1 + pad && y1 > r.y0 - pad) return true;
    }
    return false;
  }

  // Scatter D.RELIC_COUNT relics below the surface. Uses the world's rng stream.
  function place(w, rng) {
    const list = [];
    for (let i = 0; i < D.RELIC_COUNT; i++) {
      let pick = rng() * TOTAL, kind = KINDS[0];
      for (const k of KINDS) { pick -= k.weight; if (pick < 0) { kind = k; break; } }
      const s = 0.85 + rng() * 0.35, a = (rng() - 0.5) * 2 * kind.tilt;
      const R = Math.ceil(hyp(kind.hw, kind.hh) * s) + 2;
      for (let tries = 0; tries < 30; tries++) {
        const cx = R + 30 + Math.floor(rng() * (W - 2 * R - 60));
        const cy = D.SURFACE + 160 + R + Math.floor(rng() * (H - D.SURFACE - 220 - 2 * R));
        if (overlaps(list, cx - R, cy - R, cx + R, cy + R, 30)) continue;
        const bb = stamp(w, kind, cx, cy, a, s, w.seed + i * 101);
        list.push({ name: kind.name, x0: cx - R, y0: cy - R, x1: cx + R, y1: cy + R, shape: bb });
        break;
      }
    }
    return list;
  }

  PQ.Relics = { KINDS, M, stamp, place };
})();

<script>
// Pixel Quarry: the simulation. Pure logic, no DOM, so it runs under Node for tests.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, MAT = D.MAT, BALLS = D.BALLS;
  const W = D.W, H = D.H, MASK = D.TYPE_MASK, POI = D.POISON;
  const TS = Math.log2(D.TILE);
  const B = {};
  BALLS.forEach((b, i) => { B[b.key] = i; });

  // How many ownership milestones a count has passed, and the next one (or 0 when done).
  function milestone(owned) {
    let lv = 0;
    while (lv < D.MILESTONES.length && owned >= D.MILESTONES[lv]) lv++;
    return { lv, next: D.MILESTONES[lv] || 0, prev: lv ? D.MILESTONES[lv - 1] : 0 };
  }

  function newPerks() {
    const p = {};
    D.STAR_PERKS.forEach(k => { p[k.key] = 0; });
    return p;
  }
  const PERK = {};
  D.STAR_PERKS.forEach(k => { PERK[k.key] = k; });
  const perkVal = (s, key) => PERK[key].vals[s.perks[key]];

  function newState(seed) {
    const owned = {}, up = {};
    BALLS.forEach(b => { owned[b.key] = 0; up[b.key] = { dmg: 0, spd: 0, sp: 0 }; });
    owned.pebble = 1;                       // one free ball to start
    const unlocked = { pebble: true };
    return {
      v: 1, seed: seed >>> 0,
      bits: 0, earned: 0, lifetime: 0, stars: 0,
      depth: 0, spent: 0, perks: newPerks(),   // depth = Golden Pixels found; spent = stars spent on perks
      owned, up, unlocked, global: { tap: 0, value: 0, radar: 0 },
      drop: { x: W / 2, y: 110 },
      found: false, foundTime: 0, goldReward: 0,
      relics: [],                           // indexes of relics uncovered in this world
      playTime: 0, broken: 0, rate: 0,
      savedAt: Date.now(),
      settings: { particles: true },
      buyMode: 1,
    };
  }

  function Sim(world, state) {
    this.w = world;
    this.s = state;
    const M = D.MAX_BALLS;
    this.n = 0;
    this.bx = new Float32Array(M); this.by = new Float32Array(M);
    this.vx = new Float32Array(M); this.vy = new Float32Array(M);
    this.bt = new Uint8Array(M);
    this.cd = new Float32Array(M);
    this.pl = new Uint8Array(M);
    this.lastCell = new Int32Array(M).fill(-1);   // fog cell each ball was last in
    this.tilesX = Math.ceil(W / D.TILE);
    this.tilesY = Math.ceil(H / D.TILE);
    this.tileDirty = new Uint8Array(this.tilesX * this.tilesY).fill(1);
    this.ovDirty = new Uint8Array(this.tilesX * this.tilesY).fill(1);
    this.poison = new Int32Array(D.POISON_CAP);
    this.poisonGen = new Uint8Array(D.POISON_CAP);
    this.pn = 0;
    this.poisonT = 0;
    this.fxI = new Int32Array(256); this.fxT = new Uint8Array(256); this.fxn = 0;
    this.events = [];
    this.hist = [state.earned];
    this.src = 0;                                         // who is breaking rock right now: ball type, or TAP
    this.acc = new Float64Array(BALLS.length + 1);        // bits per source this second
    this.typeRate = new Float64Array(BALLS.length + 1);   // smoothed bits/s per source
    this.rateT = 0;
    this.rng = PQ.World.mulberry32((state.seed ^ 0x5bd1e995) >>> 0);
    this.relicSeen = new Set(state.relics || []);
    this.derive();
  }

  const P = Sim.prototype;

  // Recompute every number that depends on upgrades. Call after any purchase.
  P.derive = function () {
    const s = this.s;
    const sp = key => {
      const b = BALLS[B[key]];
      return b.special.base + b.special.step * s.up[key].sp;
    };
    this.valueMult = (1 + 0.25 * s.global.value) * (1 + D.STAR_BONUS * s.stars);
    this.tDmg = BALLS.map(b => Math.round(b.dmg * Math.pow(1.6, s.up[b.key].dmg)));
    this.tMult = BALLS.map(b => Math.pow(D.MILESTONE_MULT, milestone(s.owned[b.key]).lv));
    this.tSpd = BALLS.map(b => b.speed * (1 + 0.15 * s.up[b.key].spd));
    this.pierceMax = BALLS.map(b => b.key === 'lancer' ? sp('lancer') : (b.key === 'drill' || b.key === 'seeker') ? 255 : 0);
    this.bombR = sp('bomb');
    this.venomGen = 4 + 2 * s.up.venom.sp;
    this.venomP = 0.42 + 0.03 * s.up.venom.sp;
    this.midas = sp('midas');
    this.steer = sp('seeker');
    this.tapDmg = Math.round(3 * Math.pow(1.6, s.global.tap));
    this.tapR = Math.min(10, 2 + Math.floor(s.global.tap / 3));
    this.discount = 1 - perkVal(s, 'cheap');
    this.offRate = D.OFFLINE_RATE + perkVal(s, 'night');
    this.offCap = D.OFFLINE_CAP + 2 * 3600 * s.perks.night;
    this.relicMult = perkVal(s, 'relic');
    this.soft = 1 / D.DEPTH.tough(this.w.depth || 0);
  };

  P.dirty = function (x, y) {
    const k = (y >> TS) * this.tilesX + (x >> TS);
    this.tileDirty[k] = 1;
    this.ovDirty[k] = 1;
  };

  // Lift the fog in a soft-edged circle: fully clear inside r - 4, fading out to r + 4.
  P.reveal = function (px, py, r) {
    const w = this.w, fog = w.fog, FW = w.FW, FH = w.FH;
    const cx0 = Math.max(0, Math.floor((px - r - 4) / 4)), cx1 = Math.min(FW - 1, Math.floor((px + r + 4) / 4));
    const cy0 = Math.max(0, Math.floor((py - r - 4) / 4)), cy1 = Math.min(FH - 1, Math.floor((py + r + 4) / 4));
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const k = cy * FW + cx, old = fog[k];
        if (old === 255) continue;
        const v = (r + 4 - Math.hypot(cx * 4 + 2 - px, cy * 4 + 2 - py)) * 32;
        if (v <= old) continue;
        const nv = v >= 255 ? 255 : v | 0;
        fog[k] = nv;
        // The renderer blends across cell edges, so neighbouring tiles may change too.
        this.dirty(Math.max(0, cx * 4 - 4), Math.max(0, cy * 4 - 4));
        this.dirty(Math.min(W - 1, cx * 4 + 7), Math.min(H - 1, cy * 4 + 7));
        if (old < 160 && nv >= 160 && w.relicCell[k]) this.discover(w.relicCell[k] - 1);
      }
    }
  };

  // A ball lights the rock around it. Skipped when everything in reach is already seen.
  P.revealBall = function (x, y) {
    const fog = this.w.fog, FW = this.w.FW, R = D.SIGHT;
    const at = (px, py) => {
      const cx = px < 0 ? 0 : px >= W ? (W - 1) >> 2 : px >> 2, cy = py < 0 ? 0 : py >= H ? (H - 1) >> 2 : py >> 2;
      return fog[cy * FW + cx];
    };
    const ix = x | 0, iy = y | 0;
    if (at(ix, iy) === 255 && at(ix - R, iy) === 255 && at(ix + R, iy) === 255 &&
        at(ix, iy - R) === 255 && at(ix, iy + R) === 255) return;
    this.reveal(x, y, R);
  };

  P.discover = function (i) {
    if (this.relicSeen.has(i)) return;
    this.relicSeen.add(i);
    const s = this.s;
    s.relics.push(i);
    const reward = Math.max(500, (s.rate || 0) * D.RELIC_REWARD_S) * this.relicMult;
    s.bits += reward; s.earned += reward; s.lifetime += reward;
    this.events.push({ type: 'relic', i, name: this.w.relics[i].name, reward });
  };

  P.spawn = function (t, x, y) {
    if (this.n >= D.MAX_BALLS) return false;
    const k = this.n++;
    this.bx[k] = x; this.by[k] = y;
    if (t === B.lancer) {
      const d = Math.floor(this.rng() * 4);
      this.vx[k] = [1, -1, 0, 0][d]; this.vy[k] = [0, 0, 1, -1][d];
    } else if (t === B.seeker && !this.s.found) {
      const g = this.w.gold, a = Math.atan2(g.y + 0.5 - y, g.x + 0.5 - x) + (this.rng() - 0.5) * 1.8 / this.steer;
      this.vx[k] = Math.cos(a); this.vy[k] = Math.sin(a);
    } else {
      const a = this.rng() * Math.PI * 2;
      this.vx[k] = Math.cos(a); this.vy[k] = Math.sin(a);
    }
    this.bt[k] = t;
    this.cd[k] = 0;
    this.pl[k] = this.pierceMax[t];
    this.lastCell[k] = -1;
    return true;
  };

  // Damage one cell. Returns 1 broken, 0 damaged, 2 already empty, -1 unbreakable.
  P.hit = function (x, y, amount, mult) {
    const w = this.w, i = y * W + x, t = w.cells[i] & MASK;
    if (t === 0) return 2;
    const m = MAT[t];
    if (m.hard) return -1;
    if (this.soft < 1) {                    // deeper worlds: tougher rock, rounded at random
      const a = amount * this.soft;
      amount = a | 0;
      if (this.rng() < a - amount) amount++;
      if (!amount) return 0;
    }
    const before = w.dmg[i], d = before + amount;
    if (d >= m.hp) { this.destroy(i, x, y, t, mult); return 1; }
    w.dmg[i] = d;
    if (((before * 4 / m.hp) | 0) !== ((d * 4 / m.hp) | 0)) this.dirty(x, y);
    return 0;
  };

  P.destroy = function (i, x, y, t, mult) {
    const w = this.w, s = this.s;
    w.cells[i] = 0;
    w.dmg[i] = 0;
    w.mined[i >> 3] |= 1 << (i & 7);
    w.minedCount++;
    const v = MAT[t].val * mult * this.valueMult * D.VALUE_SCALE;
    this.acc[this.src] += v;
    s.bits += v; s.earned += v; s.lifetime += v;
    s.broken++;
    this.dirty(x, y);
    this.reveal(x, y, 6);
    if (this.fxn < 256) { this.fxI[this.fxn] = i; this.fxT[this.fxn] = t; this.fxn++; }
    const g = w.gold;
    if (t === T.GOLD) {
      s.found = true;
      s.foundTime = s.playTime;
      s.goldReward = Math.max(5e5, s.earned * 0.5);
      s.bits += s.goldReward;
      this.events.push({ type: 'gold' });

      this.dirty(g.x, g.y);                 // the gold may now be exposed
    }
  };

  P.explode = function (cx, cy, R, amount, mult) {
    const cells = this.w.cells;
    for (let dy = -R; dy <= R; dy++) {
      const y = cy + dy;
      if (y < 0 || y >= H) continue;
      const span = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -span; dx <= span; dx++) {
        const x = cx + dx;
        if (x < 0 || x >= W || !(cells[y * W + x] & MASK)) continue;
        this.hit(x, y, amount, mult);
      }
    }
  };

  P.poisonCell = function (x, y, gen) {
    const cells = this.w.cells, i = y * W + x, c = cells[i];
    if ((c & POI) || this.pn >= D.POISON_CAP) return;
    const t = c & MASK;
    if (!t || MAT[t].hard) return;

    this.poison[this.pn] = i;
    this.poisonGen[this.pn] = gen;

  };

  P.tickPoison = function () {
    const cells = this.w.cells, P_ = this.poison, G = this.poisonGen;
    const amt = Math.max(1, this.tDmg[B.venom]), mult = this.tMult[B.venom];
    this.src = B.venom;

      const i = P_[q], g = G[q];

          if (x < W - 1 && this.rng() < this.venomP) this.poisonCell(x + 1, y, g + 1);
          if (y > 0 && this.rng() < this.venomP) this.poisonCell(x, y - 1, g + 1);
          if (y < H - 1 && this.rng() < this.venomP) this.poisonCell(x, y + 1, g + 1);
        }
      } else {
        P_[j] = i; G[j] = g; j++;
      }
    }
    for (let q = n0; q < this.pn; q++) { P_[j] = P_[q]; G[j] = G[q]; j++; }

  };

  P.ballHit = function (k, t, cx, cy) {
    this.src = t;
    if (t === B.bomb && this.cd[k] <= 0) {
      this.cd[k] = D.BOMB_COOLDOWN;
      this.explode(cx, cy, this.bombR, this.tDmg[t] * 2, this.tMult[t]);
      return (this.w.cells[cy * W + cx] & MASK) === T.RELIC ? -1 : 0;
    }
    const r = this.hit(cx, cy, this.tDmg[t], (t === B.midas ? this.midas : 1) * this.tMult[t]);
    if (t === B.venom && r === 0) this.poisonCell(cx, cy, 0);
    return r;
  };

  P.moveBalls = function (dt) {
    const cells = this.w.cells, n = this.n, rng = this.rng;
    const bx = this.bx, by = this.by, VX = this.vx, VY = this.vy, bt = this.bt, cd = this.cd, pl = this.pl;
    const seekGold = !this.s.found;
    const gx = this.w.gold.x + 0.5, gy = this.w.gold.y + 0.5;
    for (let k = 0; k < n; k++) {
      const t = bt[k];
      let x = bx[k], y = by[k], vx = VX[k], vy = VY[k];
      if (cd[k] > 0) cd[k] -= dt;
      let dist = this.tSpd[t] * dt, hits = 0;
      while (dist > 0 && hits < 3) {
        const st = dist < 0.9 ? dist : 0.9;
        dist -= st;
        let nx = x + vx * st, ny = y + vy * st;
        if (nx < 0) { nx = -nx; vx = -vx; } else if (nx >= W) { nx = 2 * W - nx - 0.01; vx = -vx; }
        if (ny < 0) { ny = -ny; vy = -vy; } else if (ny >= H) { ny = 2 * H - ny - 0.01; vy = -vy; }
        const cx = nx | 0, cy = ny | 0;
        if (!(cells[cy * W + cx] & MASK)) { x = nx; y = ny; continue; }
        hits++;
        const r = this.ballHit(k, t, cx, cy);
        if (r === 1 && pl[k] > 0) { pl[k]--; x = nx; y = ny; continue; }
        const ox = x | 0, oy = y | 0;
        if (cx !== ox && cy !== oy) {

          if (sx && !sy) vx = -vx;
          else if (sy && !sx) vy = -vy;
          else { vx = -vx; vy = -vy; }
        } else if (cx !== ox) vx = -vx;
        else if (cy !== oy) vy = -vy;
        else {

          if (r === -1) { x = this.s.drop.x; y = this.s.drop.y; }

        }

  // unlocked: can be bought. canUnlock: earned enough in this world, waiting to be unlocked.
  P.unlocked = function (t) { return !!this.s.unlocked[BALLS[t].key]; };
  P.canUnlock = function (t) { return !this.unlocked(t) && this.s.earned >= BALLS[t].unlock; };
  P.unlockCost = function (t) { return BALLS[t].cost * D.UNLOCK_MULT * this.discount; };

    if (!this.canUnlock(t) || this.n >= D.MAX_BALLS) return false;

  P.ballCost = function (t, count) {
    const b = BALLS[t], o = this.s.owned[b.key];

  P.maxBuy = function (t) {
    const b = BALLS[t], room = D.MAX_BALLS - this.n;

  P.buyBall = function (t, count) {
    if (!this.unlocked(t)) return 0;

    if (cost > this.s.bits) return 0;

  P.ballUpMax = function (t, kind) {

  };
  P.ballUpCost = function (t, kind) {

  P.buyBallUp = function (t, kind) {
    const b = BALLS[t], lv = this.s.up[b.key];

    const cost = this.ballUpCost(t, kind);
    if (cost > this.s.bits) return false;
    this.s.bits -= cost;
    lv[kind]++;
    this.derive();
    return true;
  };

  P.upDef = key => D.UP.find(u => u.key === key);
  P.upCost = function (key) {
    const u = this.upDef(key), lvl = this.s.global[key];
    if (lvl >= u.max) return Infinity;
    return u.costs ? u.costs[lvl] : u.cost * Math.pow(u.grow, lvl);
  };
  P.buyUp = function (key) {
    const cost = this.upCost(key);
    if (cost > this.s.bits) return false;
    this.s.bits -= cost;
    this.s.global[key]++;
    this.derive();
    return true;
  };

  // ---- star perks ----
  P.perkCost = function (key) {
    const k = PERK[key], lvl = this.s.perks[key];
    return lvl >= k.costs.length ? Infinity : k.costs[lvl];
  };
  P.starsLeft = function () { return this.s.stars - this.s.spent; };
  P.buyPerk = function (key) {
    const cost = this.perkCost(key);
    if (cost > this.starsLeft()) return false;
    this.s.spent += cost;
    this.s.perks[key]++;

    this.derive();
    return true;
  };

  // ---- radar ----
  // Distance from the gold to the nearest ball: what the radar meter reads.
  P.goldDistance = function () {
    const g = this.w.gold, gx = g.x + 0.5, gy = g.y + 0.5;
    let best = Infinity;
    for (let k = 0; k < this.n; k++) {

  P.radarZone = function (level) {

  // Bits paid for time away, at a share of the last measured income.
  P.offline = function (seconds) {
    const sec = Math.min(Math.max(0, seconds), this.offCap);

  };

  // ---- persistence of balls ----
  P.exportBalls = function () {
    const out = new Float32Array(this.n * 5);
    for (let k = 0; k < this.n; k++) {

  };
  P.importBalls = function (arr) {
    this.n = 0;
    const cells = this.w.cells;

      const t = arr[o + 4] | 0;
      if (t < 0 || t >= BALLS.length) continue;
      let x = arr[o], y = arr[o + 1];

      this.spawn(t, x, y);
      const vx = arr[o + 2], vy = arr[o + 3], l = Math.hypot(vx, vy);

  // Balls the player owns but that are not in the world (first start, lost save).
  P.spawnMissing = function () {
    const have = BALLS.map(() => 0);
    for (let k = 0; k < this.n; k++) have[this.bt[k]]++;
    BALLS.forEach((b, t) => {
      for (let i = have[t]; i < this.s.owned[b.key]; i++) this.spawn(t, this.s.drop.x, this.s.drop.y);
    });
  };

  // State for the next world. Finding the gold pays stars and makes the next world deeper;
  // starting over without it keeps both as they were. Star perks apply here.
  function prestige(s, seed) {
    const next = newState(seed);
    next.depth = s.depth + (s.found ? 1 : 0);
    next.stars = s.stars + (s.found ? D.DEPTH.stars(s.depth) : 0);
    next.spent = s.spent;
    next.perks = Object.assign(newPerks(), s.perks);
    next.lifetime = s.lifetime;
    next.settings = s.settings;
    next.buyMode = s.buyMode;
    const head = perkVal(next, 'start');
    next.bits = next.earned = head;
    const keep = perkVal(next, 'tools');
    next.global.tap = Math.floor(s.global.tap * keep);
    next.global.value = Math.floor(s.global.value * keep);
    next.global.radar = perkVal(next, 'radar');
    return next;
  }

  PQ.Sim = Sim;
  PQ.newState = newState;
  PQ.prestige = prestige;
  PQ.newPerks = newPerks;
  PQ.milestone = milestone;
  PQ.BALL = B;
})();

<script>
// Pixel Quarry: canvas renderer. The world is drawn from 128 px tiles that are
// only re-rendered when the sim marks them dirty, over a half-resolution
// overview image that covers the far zoom levels.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, MAT = D.MAT;
  const W = D.W, H = D.H, TL = D.TILE, OV = D.OV, MASK = D.TYPE_MASK;
  const CACHE_MAX = 180;
  const OV_ZOOM = 0.5;                       // below this zoom, draw only the overview

  const pack = (r, g, b) => ((255 << 24) | (Math.min(255, Math.max(0, b | 0)) << 16) | (Math.min(255, Math.max(0, g | 0)) << 8) | Math.min(255, Math.max(0, r | 0))) >>> 0;
  const lerp = (a, b, t) => a + (b - a) * t;

  function buildPalette() {

    const pal = new Uint32Array(16 * 32);
    const shade = [0.84, 0.93, 1.0, 1.09], crack = [1, 0.84, 0.7, 0.56];
    MAT.forEach(m => {
      if (!m.col) return;
      for (let p = 0; p < 2; p++) for (let st = 0; st < 4; st++) for (let sh = 0; sh < 4; sh++) {
        let [r, g, b] = m.col.map(c => c * shade[sh] * crack[st]);
        if (p) { r = lerp(r, 70, 0.5); g = lerp(g, 230, 0.5); b = lerp(b, 80, 0.5); }
        pal[(m.id << 5) | (p << 4) | (st << 2) | sh] = pack(r, g, b);
      }
    });
    return pal;
  }

  // 8 relic materials x 32 brightness steps, from each material's shadow-mid-light ramp.
  function buildRelicPalette() {
    const pal = new Uint32Array(256);
    D.RELIC_MATS.forEach((m, mi) => {
      const [s, md, l] = m.ramp;
      for (let lv = 0; lv < 32; lv++) {
        const t = lv / 31;
        const c = t < 0.55 ? s.map((v, k) => lerp(v, md[k], t / 0.55)) : md.map((v, k) => lerp(v, l[k], (t - 0.55) / 0.45));
        pal[(mi << 5) | lv] = pack(c[0], c[1], c[2]);
      }

    return pal;
  }

  // 4x4 ordered-dither thresholds (1..255): fog edges break up into a pixel-art stipple.
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(b => Math.round((b + 0.5) * 16));

  function buildStageLUT() {
    const lut = new Uint8Array(16 * 256);
    MAT.forEach(m => {
      if (!m.hp) return;
      for (let d = 0; d < 256; d++) lut[(m.id << 8) | d] = Math.min(3, (d * 4 / m.hp) | 0);
    });
    return lut;
  }

  function buildShadeTex(seed) {
    const tex = new Uint8Array(256 * 256);
    for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
      const h = PQ.World.hash2(x, y, seed + 99);
      tex[(y << 8) | x] = h < 0.15 ? 0 : h < 0.55 ? 1 : h < 0.9 ? 2 : 3;
    }

  }

  function Renderer(canvas, world, sim) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.w = world;
    this.sim = sim;
    this.pal = buildPalette();
    this.stage = buildStageLUT();
    this.relicPal = buildRelicPalette();
    // Unexplored rock: dark slate, coarse grain so it never reads as real strata.
    this.fogCol = [0.8, 0.92, 1, 1.1].map(k => pack(34 * k, 31 * k, 42 * k));
    this.shade = buildShadeTex(world.seed);
    this.goldCol = [pack(255, 214, 64), pack(255, 236, 140), pack(255, 196, 30), pack(255, 248, 200)];

    this.sky = new Uint32Array(H);
    this.cave = new Uint32Array(H);

    this.ovCtx = this.ov.getContext('2d');

  // Fog at a pixel, bilinear between the 4 px fog cells (0 hidden .. 255 seen).

    const gx = (x + 0.5) / 4 - 0.5, gy = (y + 0.5) / 4 - 0.5;
    let x0 = Math.floor(gx), y0 = Math.floor(gy);
    const fx = gx - x0, fy = gy - y0;
    const x1 = Math.min(FW - 1, x0 + 1), y1 = Math.min(FH - 1, y0 + 1);
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    const a = fog[y0 * FW + x0], b = fog[y0 * FW + x1], c = fog[y1 * FW + x0], d = fog[y1 * FW + x1];

  R.fogged = function (x, y) {
    return this.fogAt(x, y) < BAYER[((y & 3) << 2) | (x & 3)];

  R.fogColor = function (x, y) { return this.fogCol[this.shade[(((y >> 1) & 255) << 8) | ((x >> 1) & 255)]]; };

  R.cellColor = function (i, x, y) {
    const c = this.w.cells[i], t = c & MASK;
    if (!t) return y < this.w.surface[x] ? this.sky[y] : this.cave[y];
    if (t === T.RELIC) return this.relicPal[this.w.dmg[i]];
    if (t === T.GOLD) return this.goldColor(i, x, y);
    const d = this.w.dmg[i];
    const st = d ? this.stage[(t << 8) | d] : 0;
    return this.pal[(t << 5) | ((c >> 7) << 4) | (st << 2) | this.shade[((y & 255) << 8) | (x & 255)]];
  };

  // The Golden Pixel looks like the rock around it until something touches its air.
  R.exposed = function (x, y) {
    const cells = this.w.cells, i = y * W + x;
    return (x > 0 && !(cells[i - 1] & MASK)) || (x < W - 1 && !(cells[i + 1] & MASK)) ||

  };
  R.goldColor = function (i, x, y) {

    const left = this.w.cells[i - 1] & MASK;
    const t = left && left !== T.GOLD && left !== T.RELIC ? left : T.BASALT;

  R.renderTile = function (tx, ty, ctx) {
    const x0 = tx * TL, y0 = ty * TL, w = Math.min(TL, W - x0), h = Math.min(TL, H - y0);
