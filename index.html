<script>
// Pixel Quarry: canvas renderer. The world is drawn from 128 px tiles that are
// only re-rendered when the sim marks them dirty, over a half-resolution
// overview image that covers the far zoom levels.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, MAT = D.MAT;
  const W = D.W, H = D.H, TL = D.TILE, OV = D.OV, MASK = D.TYPE_MASK;
  const CACHE_MAX = 180;
  const OV_ZOOM = 0.5;                       // below this zoom, draw only the overview

  const pack = (r, g, b) => ((255 << 24) | (Math.min(255, Math.max(0, b | 0)) << 16) | (Math.min(255, Math.max(0, g | 0)) << 8) | Math.min(255, Math.max(0, r | 0))) >>> 0;
  const lerp = (a, b, t) => a + (b - a) * t;

  // The void: open space, and rock that is solid all round (or still unexplored).
  const BG = pack(14, 19, 15), DEEP = pack(8, 11, 9);
  const RELIC_COL = D.MAT[T.RELIC].col, UP_COL = pack(...D.MAT[T.UPGRADE].col);

  // Exposed rock glows in its colour. index = type << 5 | poisoned << 4 | crack stage << 2 | glow
  // glow 2 = touches open space, 1 = one pixel further in.
  function buildPalette() {
    const pal = new Uint32Array(16 * 32).fill(DEEP);
    const glow = [0, 0.4, 1], crack = [1, 0.8, 0.62, 0.46];
    MAT.forEach(m => {
      if (!m.col) return;
      for (let p = 0; p < 2; p++) for (let st = 0; st < 4; st++) for (let gl = 1; gl < 3; gl++) {
        let [r, g, b] = m.col.map(c => c * crack[st]);
        if (p) { r = lerp(r, 90, 0.55); g = lerp(g, 255, 0.55); b = lerp(b, 110, 0.55); }
        const k = glow[gl];
        pal[(m.id << 5) | (p << 4) | (st << 2) | gl] = pack(lerp(8, r, k), lerp(11, g, k), lerp(9, b, k));
      }
    });
    return pal;
  }

  function buildStageLUT() {
    const lut = new Uint8Array(16 * 256);
    MAT.forEach(m => {
      if (!m.hp) return;
      for (let d = 0; d < 256; d++) lut[(m.id << 8) | d] = Math.min(3, (d * 4 / m.hp) | 0);
    });
    return lut;
  }

  function Renderer(canvas, world, sim) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.w = world;
    this.sim = sim;
    this.pal = buildPalette();
    this.stage = buildStageLUT();
    this.relicCol = [];
    for (let f = 0; f < 4; f++) this.relicCol.push(pack(...RELIC_COL.map(c => lerp(14, c, (f + 1) / 4))));
    this.goldCol = pack(255, 214, 64);

    this.cache = new Map();
    this.pool = [];
    this.tileImg = new ImageData(TL, TL);
    this.tileBuf = new Uint32Array(this.tileImg.data.buffer);

    this.ov = document.createElement('canvas');
    this.ov.width = Math.ceil(W / OV); this.ov.height = Math.ceil(H / OV);
    this.ovCtx = this.ov.getContext('2d');
    this.ovImg = new ImageData(TL / OV, TL / OV);
    this.ovBuf = new Uint32Array(this.ovImg.data.buffer);

    this.cam = { x: D.START.x, y: D.START.y, z: 6 };
    this.cssW = 1; this.cssH = 1; this.dpr = 1;
    this.parts = [];
    this.floats = [];
    this.arcs = [];
    this.time = 0;
    this.particles = true;
    this.radar = 0;
    this.safeTop = 0;
    this.safeBottom = 1;
  }

  const R = Renderer.prototype;

  R.resize = function () {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = this.canvas.getBoundingClientRect();
    this.cssW = Math.max(1, r.width); this.cssH = Math.max(1, r.height); this.dpr = dpr;
    this.canvas.width = Math.round(this.cssW * dpr);
    this.canvas.height = Math.round(this.cssH * dpr);
    this.clampCam();
  };

  R.minZoom = function () { return Math.min(this.cssW / W, this.cssH / H) * 0.92; };

  R.clampCam = function () {
    const c = this.cam;
    c.z = Math.min(40, Math.max(this.minZoom(), c.z));
    c.x = Math.min(W, Math.max(0, c.x));
    c.y = Math.min(H, Math.max(0, c.y));
  };

  R.toWorld = function (sx, sy) {
    const c = this.cam;
    return { x: c.x + (sx - this.cssW / 2) / c.z, y: c.y + (sy - this.cssH / 2) / c.z };
  };

  R.pan = function (dx, dy) {
    this.cam.x -= dx / this.cam.z;
    this.cam.y -= dy / this.cam.z;
    this.clampCam();
  };

  R.zoomAt = function (factor, sx, sy) {
    const before = this.toWorld(sx, sy);
    this.cam.z *= factor;
    this.clampCam();
    const after = this.toWorld(sx, sy);
    this.cam.x += before.x - after.x;
    this.cam.y += before.y - after.y;
    this.clampCam();
  };

  R.lookAt = function (x, y, z) {
    this.cam.x = x; this.cam.y = y;
    if (z) this.cam.z = z;
    this.clampCam();
  };

  // The world point at the middle of the open band between the HUD and the shop sheet.
  R.focus = function () {
    return this.toWorld(this.cssW / 2, (this.safeTop + this.safeBottom) / 2);
  };

  // Puts a point in that open band.
  R.lookAtDrop = function (d, z) {
    const zz = z || this.cam.z;
    this.lookAt(d.x, d.y + 0.2 * this.cssH / zz, zz);
  };

  // Fog at a pixel, bilinear between the 4 px fog cells (0 hidden .. 255 seen).
  R.fogAt = function (x, y) {
    const fog = this.w.fog, FW = this.w.FW, FH = this.w.FH;
    const gx = (x + 0.5) / 4 - 0.5, gy = (y + 0.5) / 4 - 0.5;
    let x0 = Math.floor(gx), y0 = Math.floor(gy);
    const fx = gx - x0, fy = gy - y0;
    const x1 = Math.min(FW - 1, x0 + 1), y1 = Math.min(FH - 1, y0 + 1);
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    const a = fog[y0 * FW + x0], b = fog[y0 * FW + x1], c = fog[y1 * FW + x0], d = fog[y1 * FW + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };

  // How much a rock pixel glows: 2 if it touches open space, 1 if open space is one pixel
  // further (diagonal, or two steps straight), 0 if it is solid all round.
  R.glow = function (i, x, y) {
    const c = this.w.cells;
    if ((x > 0 && !(c[i - 1] & MASK)) || (x < W - 1 && !(c[i + 1] & MASK)) ||
        (y > 0 && !(c[i - W] & MASK)) || (y < H - 1 && !(c[i + W] & MASK))) return 2;
    if (x > 0 && y > 0 && !(c[i - W - 1] & MASK)) return 1;
    if (x < W - 1 && y > 0 && !(c[i - W + 1] & MASK)) return 1;
    if (x > 0 && y < H - 1 && !(c[i + W - 1] & MASK)) return 1;
    if (x < W - 1 && y < H - 1 && !(c[i + W + 1] & MASK)) return 1;
    if ((x > 1 && !(c[i - 2] & MASK)) || (x < W - 2 && !(c[i + 2] & MASK)) ||
        (y > 1 && !(c[i - 2 * W] & MASK)) || (y < H - 2 && !(c[i + 2 * W] & MASK))) return 1;
    return 0;
  };

  // The Golden Pixel looks like the rock around it until something touches its air.
  R.exposed = function (x, y) {
    const cells = this.w.cells, i = y * W + x;
    return (x > 0 && !(cells[i - 1] & MASK)) || (x < W - 1 && !(cells[i + 1] & MASK)) ||
           (y > 0 && !(cells[i - W] & MASK)) || (y < H - 1 && !(cells[i + W] & MASK));
  };

  // Colour of one cell as drawn. fog: 0..255 for its fog cell.
  R.pixel = function (i, x, y, fog) {
    const cells = this.w.cells, c = cells[i], t = c & MASK;
    if (t === T.UPGRADE) return UP_COL;                  // seen through the dark
    if (fog < 96) return DEEP;
    if (!t) return BG;
    const f = fog >= 255 ? 3 : (fog - 96) * 4 / 160 | 0;
    if (t === T.RELIC) return this.relicCol[f];
    let tt = t;
    if (t === T.GOLD) {
      if (this.exposed(x, y)) return this.goldCol;
      const left = cells[i - 1] & MASK;
      tt = left && left !== T.GOLD && left !== T.RELIC && left !== T.UPGRADE ? left : T.BASALT;
    }
    const gl = this.glow(i, x, y);
    if (!gl) return DEEP;
    const d = this.w.dmg[i];
    const col = this.pal[(tt << 5) | ((c >> 7) << 4) | ((d && t !== T.GOLD ? this.stage[(tt << 8) | d] : 0) << 2) | (f < 2 && gl === 2 ? 1 : gl)];
    return col;
  };

  // Ignoring fog (the relic preview uses this).
  R.cellColor = function (i, x, y) { return this.pixel(i, x, y, 255); };

  R.renderTile = function (tx, ty, ctx) {
    const x0 = tx * TL, y0 = ty * TL, w = Math.min(TL, W - x0), h = Math.min(TL, H - y0);
    const buf = this.tileBuf, fog = this.w.fog, FW = this.w.FW;
    for (let yy = 0; yy < h; yy++) {
      const y = y0 + yy, row = y * W, o = yy * TL, frow = (y >> 2) * FW;
      for (let xx = 0; xx < w; xx++) {
        const x = x0 + xx;
        buf[o + xx] = this.pixel(row + x, x, y, fog[frow + (x >> 2)]);
      }
    }
    ctx.putImageData(this.tileImg, 0, 0, 0, 0, w, h);
  };

  // Overview pixels keep the brightest of the cells they cover, so thin glowing edges survive.
  R.renderOvBlock = function (tx, ty) {
    const B = TL / OV, x0 = tx * TL, y0 = ty * TL;
    const w = Math.min(B, Math.ceil((W - x0) / OV)), h = Math.min(B, Math.ceil((H - y0) / OV));
    const buf = this.ovBuf, fog = this.w.fog, FW = this.w.FW;
    for (let oy = 0; oy < h; oy++) {
      for (let ox = 0; ox < w; ox++) {
        let best = DEEP, lum = -1;
        for (let sy = 0; sy < OV; sy++) {
          const y = y0 + oy * OV + sy;
          if (y >= H) continue;
          for (let sx = 0; sx < OV; sx++) {
            const x = x0 + ox * OV + sx;
            if (x >= W) continue;
            const c = this.pixel(y * W + x, x, y, fog[(y >> 2) * FW + (x >> 2)]);
            const l = (c & 255) + ((c >> 8) & 255) + ((c >> 16) & 255);
            if (l > lum) { lum = l; best = c; }
          }
        }
        buf[oy * B + ox] = best;
      }
    }
    this.ovCtx.putImageData(this.ovImg, tx * B, ty * B, 0, 0, w, h);
  };

  // Rebuild every overview block (used once while loading). Returns a promise.
  R.buildOverview = async function (onProgress) {
    const sim = this.sim, tx = sim.tilesX, ty = sim.tilesY;
    for (let y = 0; y < ty; y++) {
      for (let x = 0; x < tx; x++) { this.renderOvBlock(x, y); sim.ovDirty[y * tx + x] = 0; }
      if (onProgress) onProgress((y + 1) / ty);
      if (y % 4 === 3) await new Promise(r => setTimeout(r, 0));
    }
  };

  R.getTile = function (k) {
    let e = this.cache.get(k);
    if (e) { this.cache.delete(k); this.cache.set(k, e); return e; }
    if (this.cache.size >= CACHE_MAX) {
      const oldK = this.cache.keys().next().value;
      this.pool.push(this.cache.get(oldK));
      this.cache.delete(oldK);
    }
    e = this.pool.pop();
    if (!e) {
      const cv = document.createElement('canvas');
      cv.width = TL; cv.height = TL;
      e = { cv, ctx: cv.getContext('2d') };
    }
    e.fresh = true;
    this.cache.set(k, e);
    return e;
  };

  R.draw = function (dt) {
    this.time += dt;
    const ctx = this.ctx, c = this.cam, z = c.z, dpr = this.dpr, sim = this.sim;
    const hw = this.cssW / 2, hh = this.cssH / 2;
    const toDX = wx => Math.round(((wx - c.x) * z + hw) * dpr);
    const toDY = wy => Math.round(((wy - c.y) * z + hh) * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#080b09';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    const vx0 = Math.max(0, c.x - hw / z), vx1 = Math.min(W, c.x + hw / z);
    const vy0 = Math.max(0, c.y - hh / z), vy1 = Math.min(H, c.y + hh / z);
    const tx0 = Math.floor(vx0 / TL), tx1 = Math.min(sim.tilesX - 1, Math.floor((vx1 - 0.001) / TL));
    const ty0 = Math.floor(vy0 / TL), ty1 = Math.min(sim.tilesY - 1, Math.floor((vy1 - 0.001) / TL));
    const visible = [];
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) visible.push(ty * sim.tilesX + tx);
    const useOv = z < OV_ZOOM || visible.length > CACHE_MAX - 20;
    // Redraws get a time budget per frame and take turns, so a slow phone
    // refreshes busy areas less often instead of dropping frames.
    const rot = this.rot = (this.rot + 7) | 0;
    const order = k => visible[(k + rot) % visible.length];

    // Overview: refresh what is in view, then draw it as the backdrop.
    let deadline = performance.now() + (useOv ? 5 : 1.5);
    for (let q = 0; q < visible.length && performance.now() < deadline; q++) {
      const k = order(q);
      if (sim.ovDirty[k]) { this.renderOvBlock(k % sim.tilesX, (k / sim.tilesX) | 0); sim.ovDirty[k] = 0; }
    }
    {
      const dx0 = toDX(vx0), dy0 = toDY(vy0), dx1 = toDX(vx1), dy1 = toDY(vy1);
      ctx.drawImage(this.ov, vx0 / OV, vy0 / OV, (vx1 - vx0) / OV, (vy1 - vy0) / OV, dx0, dy0, dx1 - dx0, dy1 - dy0);
    }

    if (!useOv) {
      deadline = performance.now() + 6;
      for (let q = 0; q < visible.length; q++) {
        const k = order(q);
        if (this.cache.has(k) && !sim.tileDirty[k]) continue;
        if (performance.now() > deadline) continue;
        this.renderTile(k % sim.tilesX, (k / sim.tilesX) | 0, this.getTile(k).ctx);
        sim.tileDirty[k] = 0;
      }
      for (const k of visible) {
        if (!this.cache.has(k)) continue;        // not drawn yet: the overview shows through
        const e = this.getTile(k);
        const x0 = (k % sim.tilesX) * TL, y0 = ((k / sim.tilesX) | 0) * TL;
        const w = Math.min(TL, W - x0), h = Math.min(TL, H - y0);
        const dx0 = toDX(x0), dy0 = toDY(y0);
        ctx.drawImage(e.cv, 0, 0, w, h, dx0, dy0, toDX(x0 + w) - dx0, toDY(y0 + h) - dy0);
      }
    }

    this.drawUpgrades(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawGold(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawParticles(ctx, dt, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawBalls(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
    this.drawArcs(ctx, dt, toDX, toDY);
    this.drawDrop(ctx, toDX, toDY);
    this.drawFloats(ctx, dt, toDX, toDY);
    if (this.radar >= 2 && !sim.s.found) this.drawZone(ctx, toDX, toDY);
    if (sim.last && sim.last.length) this.drawLast(ctx, toDX, toDY, vx0, vy0, vx1, vy1);
  };

  // The last pixels of rock in the world, ringed so they can be found at any zoom.
  R.drawLast = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const list = this.sim.last, dpr = this.dpr, m = 12 / this.cam.z;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 4);
    const r = (4 + 3 * pulse) * dpr;
    ctx.lineWidth = 1.5 * dpr;
    ctx.strokeStyle = `rgba(120,240,255,${0.5 + 0.4 * pulse})`;
    ctx.beginPath();
    for (const i of list) {
      const x = i % W, y = (i / W) | 0;
      if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
      const cx = toDX(x + 0.5), cy = toDY(y + 0.5);
      ctx.rect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.stroke();
  };

  // Balls are small squares with a fading streak behind them.
  R.drawBalls = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, n = sim.n, bx = sim.bx, by = sim.by, VX = sim.vx, VY = sim.vy, bt = sim.bt, z = this.cam.z, dpr = this.dpr;
    const size = Math.max(2, Math.min(6, z * 0.9)) * dpr, half = size / 2;
    const m = 14 / z, trail = Math.min(10, 26 / z);    // trail length in world px: ~26 screen px, at most 10 world px
    ctx.lineWidth = Math.max(1, size * 0.45);
    ctx.lineCap = 'round';
    for (let t = 0; t < D.BALLS.length; t++) {
      const col = D.BALLS[t].color;
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        if (bt[k] !== t) continue;
        const x = bx[k], y = by[k];
        if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
        const len = trail * sim.tSpd[t] / 60;
        ctx.moveTo(toDX(x - VX[k] * len), toDY(y - VY[k] * len));
        ctx.lineTo(toDX(x), toDY(y));
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col;
      for (let k = 0; k < n; k++) {
        if (bt[k] !== t) continue;
        const x = bx[k], y = by[k];
        if (x < vx0 - m || x > vx1 + m || y < vy0 - m || y > vy1 + m) continue;
        ctx.fillRect(toDX(x) - half, toDY(y) - half, size, size);
      }
    }
    ctx.lineCap = 'butt';
  };

  // Lightning arcs: a jagged purple line, gone in a moment.
  R.drawArcs = function (ctx, dt, toDX, toDY) {
    const fx = this.sim.arcFx;
    for (let q = 0; q + 3 < fx.length; q += 4) {
      if (this.arcs.length < 120) this.arcs.push({ x0: fx[q], y0: fx[q + 1], x1: fx[q + 2], y1: fx[q + 3], life: 0.16 });
    }
    fx.length = 0;
    if (!this.arcs.length) return;
    const dpr = this.dpr, keep = [];
    ctx.save();
    ctx.lineJoin = 'round';
    for (const a of this.arcs) {
      a.life -= dt;
      if (a.life <= 0) continue;
      keep.push(a);
      const dx = a.x1 - a.x0, dy = a.y1 - a.y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
      ctx.beginPath();
      ctx.moveTo(toDX(a.x0), toDY(a.y0));
      for (let k = 1; k < 4; k++) {
        const j = (Math.random() - 0.5) * L * 0.35;
        ctx.lineTo(toDX(a.x0 + dx * k / 4 + nx * j), toDY(a.y0 + dy * k / 4 + ny * j));
      }
      ctx.lineTo(toDX(a.x1), toDY(a.y1));
      ctx.globalAlpha = Math.min(1, a.life * 8);
      ctx.strokeStyle = '#a35cff'; ctx.lineWidth = 3 * dpr; ctx.stroke();
      ctx.strokeStyle = '#efe0ff'; ctx.lineWidth = 1 * dpr; ctx.stroke();
    }
    ctx.restore();
    this.arcs = keep;
  };

  // Upgrade pixels glow through the dark at every zoom, so they can be aimed for.
  R.drawUpgrades = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const list = this.w.upgrades, cells = this.w.cells, dpr = this.dpr, z = this.cam.z;
    if (!list) return;
    const pulse = 0.75 + 0.25 * Math.sin(this.time * 3);
    const size = Math.max(2 * dpr, z * dpr), half = size / 2;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff40e0';
    for (let q = 0; q < list.length; q++) {
      const i = list[q];
      if ((cells[i] & MASK) !== T.UPGRADE) continue;
      const x = i % W, y = (i / W) | 0;
      if (x < vx0 - 2 || x > vx1 + 2 || y < vy0 - 2 || y > vy1 + 2) continue;
      ctx.fillRect(toDX(x + 0.5) - half, toDY(y + 0.5) - half, size, size);
    }
    ctx.globalAlpha = 1;
  };

  R.drawParticles = function (ctx, dt, toDX, toDY, vx0, vy0, vx1, vy1) {
    const sim = this.sim, z = this.cam.z;
    if (this.particles && z >= 1.5) {
      for (let f = 0; f < sim.fxn && this.parts.length < 320; f++) {
        const i = sim.fxI[f], x = i % W, y = (i / W) | 0;
        if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
        const col = MAT[sim.fxT[f]].col;
        this.parts.push({ x: x + 0.5, y: y + 0.5, vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 25 - 5, life: 0.5 + Math.random() * 0.3,
          col: `rgb(${col[0]},${col[1]},${col[2]})` });
      }
    }
    sim.fxn = 0;
    const size = Math.max(1, z * 0.7) * this.dpr;
    const keep = [];
    for (const p of this.parts) {
      p.life -= dt;
      if (p.life <= 0) continue;
      p.vy += 90 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.col;
      ctx.fillRect(toDX(p.x) - size / 2, toDY(p.y) - size / 2, size, size);
      keep.push(p);
    }
    ctx.globalAlpha = 1;
    this.parts = keep;
  };

  R.drawGold = function (ctx, toDX, toDY, vx0, vy0, vx1, vy1) {
    const s = this.sim.s, g = this.w.gold;
    if (s.found || g.x < vx0 - 20 || g.x > vx1 + 20 || g.y < vy0 - 20 || g.y > vy1 + 20) return;
    if (!this.exposed(g.x, g.y) || this.fogAt(g.x, g.y) < 128) return;
    const cx = toDX(g.x + 0.5), cy = toDY(g.y + 0.5), dpr = this.dpr;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 5);
    ctx.strokeStyle = `rgba(255,214,64,${0.45 + 0.5 * pulse})`;
    ctx.lineWidth = 2 * dpr;
    const r = (10 + 6 * pulse) * dpr;
    ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
  };

  // "+bits" numbers that drift up from a tap and fade.
  R.float = function (x, y, text) {
    if (this.floats.length > 24) this.floats.shift();
    this.floats.push({ x, y, text, t: 0 });
  };
  R.drawFloats = function (ctx, dt, toDX, toDY) {
    if (!this.floats.length) return;
    const dpr = this.dpr, keep = [];
    ctx.save();
    ctx.font = `700 ${16 * dpr}px 'PQ Digits', 'Pixelify Sans', sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3 * dpr;
    ctx.strokeStyle = 'rgba(11,10,16,0.85)';
    for (const f of this.floats) {
      f.t += dt;
      if (f.t > 1) continue;
      const x = toDX(f.x), y = toDY(f.y) - (12 + 36 * f.t) * dpr;
      ctx.globalAlpha = f.t < 0.6 ? 1 : 1 - (f.t - 0.6) / 0.4;
      ctx.strokeText(f.text, x, y);
      ctx.fillStyle = '#ffd640';
      ctx.fillText(f.text, x, y);
      keep.push(f);
    }
    ctx.restore();
    this.floats = keep;
  };

  // The launcher: a green arrow pointing where new balls fire.
  R.drawDrop = function (ctx, toDX, toDY) {
    const d = this.sim.s.drop, dpr = this.dpr, a = this.sim.s.aim;
    ctx.save();
    ctx.translate(toDX(d.x), toDY(d.y));
    ctx.rotate(a);
    ctx.scale(dpr, dpr);
    ctx.beginPath();
    ctx.moveTo(13, 0); ctx.lineTo(-6, -8); ctx.lineTo(-2, 0); ctx.lineTo(-6, 8); ctx.closePath();
    ctx.fillStyle = 'rgba(8,11,9,0.85)';
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#6dff7c';
    ctx.stroke();
    ctx.restore();
  };

  // The radar's search ring: the gold is somewhere inside it.
  R.drawZone = function (ctx, toDX, toDY) {
    const zn = this.sim.radarZone(this.radar), dpr = this.dpr;
    if (!zn) return;
    const cx = toDX(zn.x), cy = toDY(zn.y), r = zn.r * this.cam.z * dpr;
    ctx.save();
    ctx.lineWidth = 2 * dpr;
    ctx.setLineDash([7 * dpr, 6 * dpr]);
    ctx.lineDashOffset = -this.time * 8 * dpr;
    ctx.strokeStyle = 'rgba(11,10,16,0.7)';
    ctx.beginPath(); ctx.arc(cx, cy, r + dpr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,214,64,0.85)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  };

  PQ.Renderer = Renderer;
})();

</script>
<script>
// Pixel Quarry: touch and mouse. One finger pans, two fingers pinch-zoom,
// a tap acts on the world, and holding still on rock keeps digging.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const MOVE_PX = 9, TAP_MS = 350, HOLD_S = 0.3, HOLD_EVERY = 0.11;

  function Input(canvas, renderer, handlers) {
    this.r = renderer;
    this.h = handlers;
    this.ptr = new Map();
    this.pinch = null;
    this.holdT = 0;
    this.repeatT = 0;

    const pos = e => {
      const b = canvas.getBoundingClientRect();
      return { x: e.clientX - b.left, y: e.clientY - b.top };
    };

    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      this.ptr.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, t: performance.now(), moved: false });
      this.holdT = 0; this.repeatT = 0;
      if (this.ptr.size === 2) {
        const [a, b] = [...this.ptr.values()];
        a.moved = b.moved = true;
        this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      }
    });

    canvas.addEventListener('pointermove', e => {
      const q = this.ptr.get(e.pointerId);
      if (!q) return;
      const p = pos(e);
      if (this.ptr.size === 1) {
        if (!q.moved && Math.hypot(p.x - q.sx, p.y - q.sy) > MOVE_PX) q.moved = true;
        if (q.moved) this.r.pan(p.x - q.x, p.y - q.y);
        q.x = p.x; q.y = p.y;
      } else if (this.ptr.size === 2 && this.pinch) {
        q.x = p.x; q.y = p.y;
        const [a, b] = [...this.ptr.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        if (this.pinch.d > 0 && d > 0) this.r.zoomAt(d / this.pinch.d, mx, my);
        this.r.pan(mx - this.pinch.mx, my - this.pinch.my);
        this.pinch = { d, mx, my };
      }
    });

    const end = e => {
      const q = this.ptr.get(e.pointerId);
      if (!q) return;
      this.ptr.delete(e.pointerId);
      if (e.type === 'pointerup' && this.ptr.size === 0 && !q.moved && performance.now() - q.t < TAP_MS && this.holdT < HOLD_S) {
        this.h.tap(this.r.toWorld(q.x, q.y));
      }
      if (this.ptr.size < 2) this.pinch = null;
      for (const o of this.ptr.values()) o.moved = true;   // no tap right after a pinch
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const p = pos(e);
      this.r.zoomAt(Math.exp(-e.deltaY * 0.0016), p.x, p.y);
    }, { passive: false });
  }

  // Called every frame: turns a still, held finger on rock into repeated digs.
  Input.prototype.update = function (dt) {
    if (this.ptr.size !== 1) return;
    const q = this.ptr.values().next().value;
    if (q.moved) return;
    this.holdT += dt;
    if (this.holdT < HOLD_S) return;
    this.repeatT -= dt;
    if (this.repeatT <= 0) {
      this.repeatT = HOLD_EVERY;
      this.h.hold(this.r.toWorld(q.x, q.y));
    }
  };

  PQ.Input = Input;
})();

</script>
<script>
// Pixel Quarry: saving. Progress (bits, upgrades) goes to localStorage as JSON.
// The world itself regenerates from its seed, so only the mined-pixel bitset and
// the balls are stored, compressed, in IndexedDB (localStorage as a fallback).
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const META = 'pixelquarry.meta.v1', WORLD_LS = 'pixelquarry.world.v1';

  function loadMeta() {
    try { const s = localStorage.getItem(META); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function saveMeta(state) {
    try { state.savedAt = Date.now(); localStorage.setItem(META, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  // Fill in anything an older save is missing.
  function migrate(meta) {
    if ((meta.v || 1) < 2) {
      // The world itself changed (the neon void). Start a fresh one; keep what lasts between worlds.
      const old = Object.assign(PQ.newState(meta.seed >>> 0), meta, { found: false, cleared: 0 });
      old.perks = Object.assign(PQ.newPerks(), meta.perks);
      old.global = Object.assign({ tap: 0, value: 0, radar: 0 }, meta.global);
      old.settings = Object.assign({ particles: true }, meta.settings);
      if (typeof meta.depth !== 'number') old.depth = old.stars || 0;
      const s = PQ.prestige(old, meta.seed >>> 0);
      s.rebuilt = true;
      return s;
    }
    const s = Object.assign(PQ.newState(meta.seed >>> 0), meta);
    s.owned = Object.assign(PQ.newState(0).owned, meta.owned);
    s.up = {};
    for (const b of PQ.DATA.BALLS) s.up[b.key] = Object.assign({ dmg: 0, spd: 0, sp: 0 }, (meta.up || {})[b.key]);
    s.global = Object.assign({ tap: 0, value: 0, radar: 0 }, meta.global);
    s.settings = Object.assign({ particles: true }, meta.settings);
    s.relics = Array.isArray(meta.relics) ? meta.relics : [];
    s.perks = Object.assign(PQ.newPerks(), meta.perks);
    s.unlocked = Object.assign({ pebble: true }, meta.unlocked);
    s.journal = Object.assign({}, meta.journal);
    s.drop = meta.drop || { x: PQ.DATA.START.x, y: PQ.DATA.START.y };
    return s;
  }

  async function pipe(u8, Stream, mode) {
    const out = await new Response(new Blob([u8]).stream().pipeThrough(new Stream(mode))).arrayBuffer();
    return new Uint8Array(out);
  }
  const canZip = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
  async function pack(u8) { return canZip ? { z: 1, d: await pipe(u8, CompressionStream, 'deflate-raw') } : { z: 0, d: u8 }; }
  async function unpack(p) { return p.z ? pipe(p.d, DecompressionStream, 'deflate-raw') : p.d; }

  function b64(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function unb64(str) {
    const s = atob(str), u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }

  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pixelquarry', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbPut(key, val) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet(key) {
    const d = await db();
    return new Promise((res, rej) => {
      const r = d.transaction('kv').objectStore('kv').get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }

  // Copies everything before the first await, so the record is the world as of the call.
  async function worldRecord(world, sim) {
    const mined = world.mined.slice(), fog = world.fog.slice(), balls = sim.exportBalls();
    return { seed: world.seed, gen: PQ.DATA.GEN, mined: await pack(mined), fog: await pack(fog), balls: new Uint8Array(balls.buffer.slice(0)) };
  }

  async function saveWorld(world, sim) {
    const rec = await worldRecord(world, sim);
    return putWorld(rec);
  }

  // Progress and world as of one moment. The progress snapshot is taken with the world copy
  // and written only once the world is stored: closing the app mid-save must not keep the
  // bits or ◆ a pixel paid while the world forgets it was mined (the pixel would pay again).
  async function saveGame(state, world, sim) {
    state.savedAt = Date.now();
    const meta = JSON.stringify(state);
    const rec = await worldRecord(world, sim);
    const ok = await putWorld(rec);            // if no world storage works at all, progress is still kept
    try { localStorage.setItem(META, meta); } catch (e) { return false; }
    return ok;
  }

  async function putWorld(rec) {
    try { await idbPut('world', rec); return true; } catch (e) { /* fall through */ }
    try {
      localStorage.setItem(WORLD_LS, JSON.stringify({ seed: rec.seed, gen: rec.gen, z: rec.mined.z, mined: b64(rec.mined.d), fog: b64(rec.fog.d), balls: b64(rec.balls) }));
      return true;
    } catch (e) { return false; }
  }

  async function loadWorld(seed) {
    let rec = null;
    try { rec = await idbGet('world'); } catch (e) { rec = null; }
    if (!rec) {
      try {
        const s = localStorage.getItem(WORLD_LS);
        if (s) { const j = JSON.parse(s); rec = { seed: j.seed, gen: j.gen, mined: { z: j.z, d: unb64(j.mined) }, fog: j.fog ? { z: j.z, d: unb64(j.fog) } : null, balls: unb64(j.balls) }; }
      } catch (e) { rec = null; }
    }
    if (!rec || rec.seed !== seed || rec.gen !== PQ.DATA.GEN) return null;   // another world, or one made by older generation code
    const balls = new Float32Array(rec.balls.buffer.slice(rec.balls.byteOffset, rec.balls.byteOffset + rec.balls.byteLength));
    return { mined: await unpack(rec.mined), fog: rec.fog ? await unpack(rec.fog) : null, balls };
  }

  async function clearWorld() {
    try { await idbPut('world', null); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(WORLD_LS); } catch (e) { /* ignore */ }
  }

  // A text save code that can be pasted into another device.
  async function exportCode(state, world, sim) {
    const rec = await worldRecord(world, sim);
    const body = JSON.stringify({ meta: state, gen: rec.gen, z: rec.mined.z, mined: b64(rec.mined.d), fog: b64(rec.fog.d), balls: b64(rec.balls) });
    return 'PQ1:' + b64(new TextEncoder().encode(body));
  }

  async function importCode(code) {
    const text = String(code || '').trim();
    if (!text.startsWith('PQ1:')) throw new Error('That is not a Pixel Quarry save code. Codes start with PQ1:');
    let j;
    try { j = JSON.parse(new TextDecoder().decode(unb64(text.slice(4)))); } catch (e) { throw new Error('The save code is incomplete. Copy the whole code and try again.'); }
    if (!j.meta || typeof j.meta.seed !== 'number') throw new Error('The save code has no game in it.');
    const rec = { seed: j.meta.seed >>> 0, gen: j.gen, mined: { z: j.z, d: unb64(j.mined) }, fog: j.fog ? { z: j.z, d: unb64(j.fog) } : null, balls: unb64(j.balls) };
    try { await idbPut('world', rec); } catch (e) {
      localStorage.setItem(WORLD_LS, JSON.stringify({ seed: rec.seed, gen: j.gen, z: j.z, mined: j.mined, fog: j.fog, balls: j.balls }));
    }
    j.meta.savedAt = Date.now();
    localStorage.setItem(META, JSON.stringify(j.meta));
  }

  PQ.Save = { loadMeta, saveMeta, migrate, saveWorld, saveGame, loadWorld, clearWorld, exportCode, importCode };
})();

</script>
<script>
// Pixel Quarry: the DOM layer. HUD, shop sheet, toasts and dialogs.
(function () {
  const PQ = window.PQ;
  const D = PQ.DATA, BALLS = D.BALLS;
  const $ = id => document.getElementById(id);
  const UNITS = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

  function fmt(n) {
    if (!isFinite(n)) return '—';
    if (n < 1000) return Math.floor(n).toLocaleString('en-US');
    let i = -1;
    while (n >= 999.5 && i < UNITS.length - 1) { n /= 1000; i++; }
    return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + UNITS[i];
  }
  function fmtTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
    return `${m}m ${String(s).padStart(2, '0')}s`;
  }
  const fmtX = m => m < 1000 ? String(+m.toFixed(2)) : fmt(m);   // multipliers keep their decimals
  const CLEAR_MARKS = [0.5, 0.75, 0.9, 0.99];
  const pct = c => c >= 0.9995 && c < 1 ? '99.9' : (100 * c).toFixed(c < 0.1 ? 2 : 1);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function UI(game) {
    this.g = game;
    this.tab = 'balls';
    this.t = 0;
    this.toastT = 0;
    this.confirm = null;           // which inline confirm is open in the World tab
    this.shown = game.state.bits;  // the HUD counter rolls toward the real number
    this.build();
    this.bind();
  }
  const U = UI.prototype;

  // Line icons for the skill tree, drawn in the node's colour.
  const ICON = {
    unlock: '<circle cx="10" cy="10" r="5"/><path d="M15 3v6M12 6h6"/>',
    dmg: '<path d="M4 16 15 5M13 3l4 4M6 11l3 3M3 17l2-2"/>',
    spd: '<path d="M2 7h7M1 11h8M3 15h6"/><circle cx="14" cy="11" r="4"/>',
    pierce: '<path d="M2 10h15M13 6l4 4-4 4"/><rect x="7" y="4" width="3" height="12"/>',
    radius: '<circle cx="10" cy="10" r="3"/><path d="M10 1v4M10 15v4M1 10h4M15 10h4M4 4l2.5 2.5M13.5 13.5 16 16M16 4l-2.5 2.5M4 16l2.5-2.5"/>',
    spread: '<path d="M10 2c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',
    arcs: '<path d="M11 1 4 11h5l-2 8 8-11h-5z"/>',
    mult: '<circle cx="10" cy="10" r="7"/><path d="M7 7l6 6M13 7l-6 6"/>',
    steer: '<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.5"/>',
  };
  const icon = k => `<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
  const nodeIcon = (b, kind) => icon(kind === 'sp' ? b.special.key : kind);

  U.build = function () {
    // Balls: buy more with bits. Tools below.
    $('panel-balls').innerHTML = `
      <div class="buyrow"><span>Buy amount</span>
        <div class="buymode" id="buymode" role="group" aria-label="How many to buy">
          <button type="button" data-n="1">×1</button><button type="button" data-n="10">×10</button><button type="button" data-n="0">Max</button>
        </div></div>` + BALLS.map((b, t) => `
      <div class="row ball" id="ball-${t}">
        <span class="swatch" style="--c:${b.color}"></span>
        <div><div class="name"><span id="bn-${t}">${esc(b.name)}</span><span class="count" id="bc-${t}"></span></div>
          <div class="desc" id="bd-${t}">${esc(b.desc)}</div>
          <div class="prog" id="bp-${t}" hidden><i></i></div></div>
        <button type="button" class="buy" id="bb-${t}" data-act="ball" data-t="${t}"><span class="lbl">Buy</span><span class="cost">0</span></button>
      </div>`).join('') + `<div class="group-h">Tools</div>` + D.UP.map(u => `
      <div class="row plain" id="up-${u.key}">
        <div><div class="name">${esc(u.name)}<span class="lv"></span></div><div class="desc"></div></div>
        <button type="button" class="buy" data-act="up" data-key="${u.key}"><span class="lbl">Upgrade</span><span class="cost">0</span></button>
      </div>`).join('');
    this.mileSeen = BALLS.map(b => PQ.milestone(this.g.state.owned[b.key]).lv);
    this.clearSeen = CLEAR_MARKS.filter(m => this.g.state.cleared >= m).length;
    this.lastSeen = !!this.g.sim.last;
    this.shown = this.g.state.bits;

    // Tree: one branch per ball type, paid in diamonds.
    if (!this.sel) this.sel = { t: 1, kind: 'unlock' };
    $('panel-tree').innerHTML = `<div class="treecard" id="treeCard"></div><div class="tree">` + BALLS.map((b, t) => `
      <div class="branch" id="br-${t}" style="--c:${b.color}">
        ${this.g.sim.nodeKinds(t).map(k => `
          <button type="button" class="node${k === 'unlock' ? ' root' : ''}" id="nd-${t}-${k}" data-act="node" data-t="${t}" data-kind="${k}" aria-label="${esc(b.name)} ${esc(this.nodeName(t, k))}">
            ${nodeIcon(b, k)}<span class="pip"></span></button>`).join('<i class="link"></i>')}
      </div>`).join('') + `</div><p class="note">Upgrade pixels glow magenta in the dark. A ball or a tap collects one for ◆; spend ◆ here.</p>`;

    // Stars: perks bought with stars, kept across worlds
    $('panel-stars').innerHTML = `<p class="note" id="starsNote"></p>` + D.STAR_PERKS.map(k => `
      <div class="row plain" id="pk-${k.key}">
        <div><div class="name">${esc(k.name)}<span class="lv"></span></div><div class="desc"></div></div>
        <button type="button" class="buy" data-act="perk" data-key="${k.key}"><span class="lbl">Buy</span><span class="cost">0</span></button>
      </div>`).join('');
    this.buildWorld();
  };

  U.nodeName = function (t, kind) {
    const b = BALLS[t];
    return kind === 'unlock' ? (t ? 'Unlock' : b.name) : kind === 'sp' ? b.special.name : D.TREE[kind].name;
  };
  // What a node does at a level, for the tree card: "×4", "+40%", "6 px".
  U.nodeValue = function (t, kind, lv) {
    const b = BALLS[t], TR = D.TREE;
    if (kind === 'dmg') return `${fmt(b.dmg * Math.pow(TR.dmg.mult, lv))} damage`;
    if (kind === 'spd') return `+${Math.round(TR.spd.step * lv * 100)}% speed`;
    const v = b.special.base + b.special.step * lv;
    return { pierce: `${v} pixels`, radius: `${v} px blast`, spread: `${4 + 2 * v} generations`, arcs: `${v} arcs`, mult: `${v}× payout`, steer: `${v}× steering` }[b.special.key];
  };

  // The card above the tree: the selected node, its next level and the buy button.
  U.treeCard = function () {
    const sim = this.g.sim, s = this.g.state, { t, kind } = this.sel, b = BALLS[t];
    const lv = sim.nodeLevel(t, kind), max = sim.nodeMax(t, kind), cost = sim.nodeCost(t, kind), open = sim.nodeOpen(t, kind);
    let body;
    if (kind === 'unlock') body = !t ? `${esc(b.desc)} Your first ball, always unlocked.` : sim.unlocked(t) ? `${esc(b.desc)}` : `New ball. ${esc(b.desc)}`;
    else if (lv >= max) body = `${this.nodeValue(t, kind, lv)}. Fully upgraded.`;
    else body = `${this.nodeValue(t, kind, lv)} <b>›</b> ${this.nodeValue(t, kind, lv + 1)}`;
    const bits = sim.nodeBits(t, kind), ok = sim.canBuyNode(t, kind);
    const label = !open ? `Unlock ${esc(b.name)} first` : !isFinite(cost) ? (kind === 'unlock' ? 'Unlocked' : 'Maxed') : 'Buy';
    if (bits) body += ` Also costs <b>${fmt(bits)}</b> bits.`;
    const html = `<div class="tc-head" style="--c:${b.color}"><span class="tc-kick">${esc(b.name)}</span>
        <span class="tc-name">${esc(this.nodeName(t, kind))}${kind !== 'unlock' ? ` <small>Lv ${lv}/${max}</small>` : ''}</span></div>
      <p class="tc-body">${body}</p>
      <button type="button" class="buy${ok ? ' afford' : ''}" data-act="buynode" ${ok ? '' : 'disabled'}><span class="lbl">${label}</span><span class="cost">${isFinite(cost) && open ? '◆ ' + cost : ''}</span></button>`;
    if (html !== this.cardHtml) { this.cardHtml = html; $('treeCard').innerHTML = html; }
  };

  // A perk's description at a level, with its value filled in.
  function perkText(k, lvl) {
    const v = k.vals[Math.min(lvl, k.vals.length - 1)];
    const shown = k.key === 'start' ? fmt(v) : k.key === 'cheap' || k.key === 'night' ? Math.round(v * 100) + '%'
      : k.key === 'tools' ? (v >= 1 ? 'all' : Math.round(v * 100) + '%') : v;
    return k.desc.replace('{v}', shown);
  }

  // What is new about a depth, for the toast and the World tab.
  U.depthNote = function (d) {
    if (d <= 0) return 'The gold sits far out in the dark, toward the edges.';
    const parts = [`The gold is buried farther out and rock takes ${Math.round((D.DEPTH.tough(d) - 1) * 100)}% more hits.`];
    if (D.DEPTH.magma(d) < 2) parts.push('Ashrock rings the far edges.');
    if (D.DEPTH.adamant(d) < 2) parts.push('Adamant lies past it.');
    return parts.join(' ');
  };

  U.buildWorld = function () {
    const s = this.g.state;
    const c = this.confirm;
    $('panel-world').innerHTML = `
      ${s.found ? `<div class="group-h">Golden Pixel found</div>
        <p class="note">Go down to depth ${s.depth + 1} and collect ${this.starWord(D.DEPTH.stars(s.depth))}. Balls and upgrades reset; stars and perks stay.</p>
        <div class="actions"><button type="button" class="btn gold" data-act="prestige">Go deeper</button></div>` : ''}
      <div class="group-h">Journal</div>
      ${this.journalHtml()}
      <div class="group-h">Clear bonus</div>
      <p class="note" id="clearNote"></p>
      <dl class="stats">
        <div><dt>Pixels broken</dt><dd id="st-broken">0</dd></div>
        <div><dt>World mined</dt><dd id="st-mined">0%</dd></div>
        <div><dt>Time here</dt><dd id="st-time">0m</dd></div>
        <div><dt>Depth</dt><dd id="st-depth">0</dd></div>
        <div><dt>Stars</dt><dd id="st-stars">0</dd></div>
        <div><dt>Earned here</dt><dd id="st-earned">0</dd></div>
        <div><dt>Earned ever</dt><dd id="st-life">0</dd></div>
        <div><dt>Relics found</dt><dd id="st-relics">0</dd></div>
        <div><dt>Pixels left</dt><dd id="st-left">0</dd></div>
        <div><dt>Bonus this dig</dt><dd id="st-bonus">×1</dd></div>
      </dl>
      <div class="group-h">Settings</div>
      <label class="toggle"><input type="checkbox" id="optParticles" ${s.settings.particles ? 'checked' : ''}> Rock chips when pixels break</label>
      <div class="group-h">Save</div>
      <p class="note">The game saves on this device every few seconds. A save code moves it to another device.</p>
      <div class="actions">
        <button type="button" class="btn" data-act="copy-save">Copy save code</button>
        <button type="button" class="btn" data-act="show-load">Load a save code</button>
      </div>
      ${c === 'code' ? `<textarea id="saveCode" readonly aria-label="Your save code"></textarea>` : ''}
      ${c === 'load' ? `<textarea id="loadCode" aria-label="Paste a save code" placeholder="Paste a code that starts with PQ1:"></textarea>
        <div class="actions"><button type="button" class="btn gold" data-act="do-load">Load this save</button><button type="button" class="btn" data-act="cancel">Cancel</button></div>` : ''}
      <div class="group-h">Danger</div>
      ${c === 'wipe' ? `<div class="confirm"><p>This deletes this world, your balls and upgrades. Stars, perks and depth are kept.</p>
        <div class="actions"><button type="button" class="btn danger" data-act="do-wipe">Delete and start over</button><button type="button" class="btn" data-act="cancel">Keep playing</button></div></div>`
        : `<div class="actions"><button type="button" class="btn danger" data-act="wipe">Start over</button></div>`}
      <p class="note">Depth ${s.depth}: ${esc(this.depthNote(s.depth))} Seed ${s.seed}</p>
      <div class="group-h">App</div>
      <p class="note">Version ${esc(this.g.build || 'dev')}</p>
      <div class="actions"><button type="button" class="btn" data-act="update">Check for update</button></div>`;
  };

  // How much of this world is dug out and what that pays on the next dig.
  U.clearText = function () {
    const s = this.g.state, C = D.CLEAR, now = PQ.clearBonus(s.cleared);
    const head = `You've cleared ${pct(s.cleared)}% of this world.`;
    if (s.cleared >= 1) return `${head} Every pixel! Your next dig earns ×${C.full}.`;
    const how = `Past ${C.from * 100}% cleared, every pixel you dig raises your next dig's income, up to ×${1 + C.max}. Clear every last pixel for ×${C.full}.`;
    return now > 1 ? `${head} Next dig: ×${fmtX(now)}. ${how}` : `${head} ${how}`;
  };

  // Toasts as the world empties, and the full clear itself.
  U.clearCheck = function () {
    const s = this.g.state, sim = this.g.sim;
    const passed = CLEAR_MARKS.filter(m => s.cleared >= m).length;
    if (passed > this.clearSeen) {
      const m = CLEAR_MARKS[passed - 1];
      this.clearSeen = passed;
      this.toast(`${m * 100}% of the world cleared. Next dig earns ×${fmtX(PQ.clearBonus(s.cleared))}.`, 3200);
    }
    if (sim.last && !this.lastSeen && sim.last.length) {
      this.lastSeen = true;
      this.toast(`Only ${sim.last.length.toLocaleString('en-US')} pixels left. They're lit up and marked on the map.`, 4000);
    }
  };
  U.cleared = function () {
    this.modal(`<h2>Every pixel cleared.</h2>
      <p class="sub">All ${fmt(this.g.world.solidTotal)} pixels of rock in this world are gone.</p>
      <div class="big">×${D.CLEAR.full}</div>
      <p>Your next dig earns ×${D.CLEAR.full} on every pixel.${this.g.state.found ? ' Go deeper whenever you are ready.' : ''}</p>
      <div class="actions">${this.g.state.found ? '<button type="button" class="btn gold" data-act="prestige">Go deeper</button>' : ''}
        <button type="button" class="btn" data-act="close">Nice</button></div>`);
  };

  // The story so far: this depth's chapter with gaps, earlier chapters folded away.
  U.journalHtml = function () {
    const s = this.g.state, out = [];
    for (let d = s.depth; d >= 0; d--) {
      const ch = PQ.storyChapter(d), got = (s.journal && s.journal[d]) || [];
      const lines = ch.fragments.map((f, k) => got.includes(k) ? `<li>${esc(f)}</li>` : '<li class="gap">· · ·</li>').join('');
      const head = `${esc(ch.title)} <small>${got.length}/${ch.fragments.length}</small>`;
      out.push(d === s.depth
        ? `<div class="journal"><h3>Depth ${d}: ${head}</h3><ol>${lines}</ol>${got.length ? '' : '<p class="note">Fragments of this depth\'s story hide in its relics.</p>'}</div>`
        : `<details class="journal"><summary>Depth ${d}: ${head}</summary><ol>${lines}</ol></details>`);
    }
    return out.join('');
  };

  // A relic that carried a story fragment.
  U.fragment = function (e) {
    const s = this.g.state, ch = PQ.storyChapter(s.depth), got = s.journal[s.depth] || [];
    this.modal(`<p class="kicker">${esc(e.name)} · fragment ${e.frag + 1} of ${ch.fragments.length}</p>
      <h2>${esc(ch.title)}</h2>
      <p class="story">${esc(ch.fragments[e.frag])}</p>
      <p class="sub">${got.length} of ${ch.fragments.length} found at this depth. The rest are in the Journal, in the World tab.</p>
      <div class="actions"><button type="button" class="btn gold" data-act="close">Keep digging</button></div>`);
  };

  U.diamond = function (e) {
    this.g.renderer.float(e.x + 0.5, e.y + 0.5, `+${e.n} ◆`);
    if (!this.diaSeen) { this.diaSeen = true; this.toast('Upgrade pixel! Spend ◆ in the Tree.', 3200); }
  };

  U.starWord = n => `${n} star${n === 1 ? '' : 's'}`;

  U.bind = function () {
    document.querySelector('.tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      const sheet = $('sheet');
      if (b.dataset.tab === this.tab) this.setOpen(!sheet.classList.contains('open'));
      else { this.showTab(b.dataset.tab); this.setOpen(true); }
    });
    $('grip').addEventListener('click', () => this.setOpen(!$('sheet').classList.contains('open')));
    $('sheetBody').addEventListener('click', e => {
      const b = e.target.closest('[data-n]');
      if (b) { this.g.state.buyMode = +b.dataset.n; this.refresh(); return; }
      this.act(e);
    });
    $('sheetBody').addEventListener('change', e => {
      if (e.target.id === 'optParticles') this.g.state.settings.particles = e.target.checked;
    });
    $('modal').addEventListener('click', e => this.act(e));
    $('btnDrop').addEventListener('click', () => this.g.renderer.lookAtDrop(this.g.state.drop, Math.max(this.g.renderer.cam.z, 3)));
    $('btnDeeper').addEventListener('click', () => this.gold());
    $('btnMap').addEventListener('click', () => this.g.renderer.lookAt(D.W / 2, D.H / 2, 0.01));
  };

  U.setOpen = function (open) {
    $('sheet').classList.toggle('open', open);
    $('grip').setAttribute('aria-expanded', open);
    $('grip').setAttribute('aria-label', open ? 'Hide shop' : 'Show shop');
  };

  U.showTab = function (tab) {
    this.tab = tab;
    document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    ['balls', 'tree', 'stars', 'world'].forEach(k => { $('panel-' + k).hidden = k !== tab; });
    if (tab === 'world') { this.buildWorld(); }
    this.refresh();
  };

  U.buyCount = function (t) {
    const m = this.g.state.buyMode;
    return m === 0 ? Math.max(1, this.g.sim.maxBuy(t)) : m;
  };

  U.act = async function (e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const g = this.g, sim = g.sim, s = g.state;
    switch (b.dataset.act) {
      case 'ball': {
        const t = +b.dataset.t;
        if (sim.unlocked(t)) sim.buyBall(t, this.buyCount(t));
        else { this.sel = { t, kind: 'unlock' }; this.showTab('tree'); }
        break;
      }
      case 'node': this.sel = { t: +b.dataset.t, kind: b.dataset.kind }; break;
      case 'buynode': {
        const { t, kind } = this.sel;
        if (sim.buyNode(t, kind) && kind === 'unlock') { this.reveal(t); this.sel = { t, kind: 'dmg' }; }
        break;
      }
      case 'update': g.checkUpdate(); return;
      case 'release': this.closeModal(); g.renderer.lookAtDrop(s.drop, Math.max(g.renderer.cam.z, 3)); break;
      case 'up': if (g.sim.buyUp(b.dataset.key) && b.dataset.key === 'radar') this.radarToast(); break;
      case 'perk': {
        const before = s.global.radar;
        if (sim.buyPerk(b.dataset.key) && s.global.radar > before) this.radarToast();
        break;
      }
      case 'prestige': this.closeModal(); g.newWorld(true); return;
      case 'keep': this.closeModal(); this.buildWorld(); break;
      case 'close': this.closeModal(); break;
      case 'wipe': this.confirm = 'wipe'; this.buildWorld(); break;
      case 'do-wipe': this.confirm = null; g.newWorld(false); return;
      case 'cancel': this.confirm = null; this.buildWorld(); break;
      case 'show-load': this.confirm = 'load'; this.buildWorld(); $('loadCode').focus(); break;
      case 'copy-save': {
        const code = await PQ.Save.exportCode(s, g.world, sim);
        this.confirm = 'code'; this.buildWorld();
        const ta = $('saveCode');
        ta.value = code;
        try { await navigator.clipboard.writeText(code); this.toast('Save code copied'); }
        catch (err) { ta.focus(); ta.select(); this.toast('Select the code below and copy it'); }
        break;
      }
      case 'do-load': {
        try { await PQ.Save.importCode($('loadCode').value); g.reload(); }
        catch (err) { this.toast(err.message, 4000); }
        return;
      }
    }
    this.refresh();
  };

  U.toast = function (msg, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    this.toastT = (ms || 2400) / 1000;
  };

  U.modal = function (html) {
    $('modalCard').innerHTML = html;
    $('modal').hidden = false;
    const f = $('modalCard').querySelector('button');
    if (f) f.focus();
  };
  U.closeModal = function () { $('modal').hidden = true; };

  U.welcome = function () {
    this.modal(`<h2>Somewhere out in the dark is one Golden Pixel.</h2>
      <p>You start in a small cave in the middle of 10,000,000 pixels. Your balls bounce around and break rock, and every broken pixel pays bits.</p>
      <ul>
        <li>Spend bits on more balls. The green arrow is your launcher: new balls fire from it.</li>
        <li>Tap open space to aim the launcher. Hold on open space to move it.</li>
        <li>Tap glowing rock to dig it yourself. Hold to keep digging.</li>
        <li>Magenta specks are upgrade pixels. Any ball that touches one collects ◆ for the Tree.</li>
        <li>Relics are buried in the dark. Some hold pieces of a story.</li>
      </ul>
      <div class="actions"><button type="button" class="btn gold" data-act="close">Start digging</button></div>`);
  };

  // A newly unlocked ball type, introduced.
  U.reveal = function (t) {
    const b = BALLS[t], sim = this.g.sim;
    const sp = b.special ? `<li>Special upgrade: <b>${esc(b.special.name)}</b>. ${esc(b.special.desc)}.</li>` : '';
    this.modal(`<div class="reveal" style="--c:${b.color}"><i></i></div>
      <p class="kicker">New ball unlocked</p>
      <h2>${esc(b.name)}</h2>
      <p class="sub">${esc(b.desc)}</p>
      <ul>
        <li>Damage ${fmt(sim.tDmg[t])} per hit, speed ${Math.round(sim.tSpd[t])} px/s.</li>
        ${sp}
        <li>Your first one comes with it. Buy more in the Balls tab; its upgrades are on its branch of the Tree.</li>
      </ul>
      <div class="actions"><button type="button" class="btn gold" data-act="release">Release it</button></div>`);
  };

  U.radarToast = function () {
    const lv = this.g.state.global.radar;
    this.toast(lv === 1 ? 'Radar on. It senses the gold from your closest ball.'
      : lv === 2 ? 'Search zone ringed on the map. The gold is somewhere inside.' : 'Search zone narrowed.', 3200);
  };

  U.relic = function (e) {
    const n = this.g.state.relics.length, total = this.g.world.relics.length;
    if (e.frag >= 0) { this.fragment(e); return; }
    this.toast(`Relic uncovered: ${e.name} (${n}/${total}). +${fmt(e.reward)} bits`, 3200);
  };

  U.offline = function (r) {
    if (r.gain < 1) return;
    this.modal(`<h2>Welcome back</h2>
      <p class="sub">Your balls kept working for ${fmtTime(r.seconds)}${r.seconds >= this.g.sim.offCap ? ' (the most they bank)' : ''}.</p>
      <div class="big">+${fmt(r.gain)}</div>
      <div class="actions"><button type="button" class="btn gold" data-act="close">Collect</button></div>`);
  };

  U.gold = function () {
    const s = this.g.state;
    this.modal(`<h2>You found the Golden Pixel.</h2>
      <p class="sub">One pixel out of 10,000,000, after ${fmtTime(s.foundTime)} in this world. It pays a finder's fee of</p>
      <div class="big">+${fmt(s.goldReward)}</div>
      <p>Go deeper to collect ${this.starWord(D.DEPTH.stars(s.depth))}. Every star adds +${D.STAR_BONUS * 100}% bits for good, and you can spend them on perks in the Stars tab. Depth ${s.depth + 1}: ${esc(this.depthNote(s.depth + 1))}</p>
      <p>${esc(this.clearText())}</p>
      <div class="actions">
        <button type="button" class="btn gold" data-act="prestige">Go deeper</button>
        <button type="button" class="btn" data-act="keep">Keep mining here</button>
      </div>`);
  };

  U.setBuy = function (btn, cost, ok, label) {
    btn.disabled = !ok;
    btn.classList.toggle('afford', ok);
    btn.querySelector('.cost').textContent = isFinite(cost) ? fmt(cost) : 'Max';
    if (label) btn.querySelector('.lbl').textContent = label;
  };

  // Text and button states. Runs a few times a second, not every frame.
  U.refresh = function () {
    const g = this.g, s = g.state, sim = g.sim;
    $('rate').textContent = `+${fmt(s.rate)} /s`;
    $('ballCount').textContent = sim.n.toLocaleString('en-US');
    document.querySelectorAll('#buymode [data-n]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === s.buyMode));

    // Radar reads the ball nearest the gold.
    const radar = $('radar');
    radar.hidden = s.global.radar < 1 || s.found;
    $('btnDeeper').hidden = !s.found;
    if (!radar.hidden) {
      if (s.found) { $('heat').style.width = '100%'; $('radarText').textContent = 'Found'; }
      else {
        const d = sim.goldDistance(), heat = Math.max(0, 1 - d / D.RADAR.range);
        $('heat').style.width = (heat * 100).toFixed(0) + '%';
        $('radarText').textContent = d < 120 ? 'Burning' : d < 350 ? 'Hot' : d < 750 ? 'Warm' : d < 1400 ? 'Cool' : 'Cold';
      }
    }

    $('dia').textContent = `◆ ${s.dia}`;
    // Balls: unlocked ones can be bought; the rest point at the Tree.
    const full = sim.n >= D.MAX_BALLS;
    const next = BALLS.findIndex((b, t) => !sim.unlocked(t));
    BALLS.forEach((b, t) => {
      if (this.tab !== 'balls') return;
      const unlocked = sim.unlocked(t), hidden = !unlocked && t !== next;
      const row = $('ball-' + t);
      row.hidden = hidden;
      row.classList.toggle('locked', !unlocked);
      const own = s.owned[b.key], ms = PQ.milestone(own);
      $('bc-' + t).textContent = own ? `×${own.toLocaleString('en-US')}` : '';
      const prog = $('bp-' + t);
      prog.hidden = !unlocked || !ms.next;
      if (unlocked) {
        const inc = sim.typeRate[t], mult = sim.tMult[t];
        $('bd-' + t).textContent = `+${fmt(inc)}/s` + (mult > 1 ? ` · earns ×${fmtX(mult)}` : '')
          + (ms.next ? ` · ${ms.next} owned: ×${D.MILESTONE_MULT}` : ' · every milestone reached');
        if (ms.next) prog.firstChild.style.width = (100 * (own - ms.prev) / (ms.next - ms.prev)).toFixed(1) + '%';
        const n = this.buyCount(t), cost = sim.ballCost(t, n);
        this.setBuy($('bb-' + t), cost, !full && cost <= s.bits, full ? 'World full' : `Buy ${n}`);
      } else {
        $('bd-' + t).textContent = `${b.desc} Unlock it in the Tree: ◆ ${D.TREE.unlock[b.key]} and ${fmt(sim.nodeBits(t, 'unlock'))} bits.`;
        const btn = $('bb-' + t);
        btn.disabled = false;                  // still opens the Tree; lit only when the unlock is affordable
        btn.classList.toggle('afford', sim.canBuyNode(t, 'unlock'));
        btn.querySelector('.lbl').textContent = 'Tree';
        btn.querySelector('.cost').textContent = `◆ ${D.TREE.unlock[b.key]}`;
      }
    });
    this.clearCheck();
    BALLS.forEach((b, t) => {
      const lv = PQ.milestone(s.owned[b.key]).lv;
      if (lv > this.mileSeen[t]) {
        this.mileSeen[t] = lv;
        this.toast(`${D.MILESTONES[lv - 1]} ${b.name}s! They now earn ×${fmtX(sim.tMult[t])}.`, 3200);
      }
    });

    let toolAffordable = false;
    D.UP.forEach(u => {
      const row = $('up-' + u.key), lvl = s.global[u.key], cost = sim.upCost(u.key), maxed = lvl >= u.max;
      const ok = !maxed && cost <= s.bits;
      toolAffordable = toolAffordable || ok;
      if (this.tab !== 'balls') return;
      row.querySelector('.lv').textContent = `Lv ${lvl}${u.max < 99 ? '/' + u.max : ''}`;
      row.querySelector('.desc').textContent = Array.isArray(u.desc) ? (u.desc[Math.min(lvl, u.desc.length - 1)]) : u.desc;
      this.setBuy(row.querySelector('.buy'), maxed ? Infinity : cost, ok, maxed ? 'Done' : 'Upgrade');
    });
    $('ballDot').hidden = !toolAffordable || this.tab === 'balls';

    // Tree: node states, and the dot when anything is affordable.
    let nodeAffordable = false;
    BALLS.forEach((b, t) => {
      sim.nodeKinds(t).forEach(kind => {
        const lv = sim.nodeLevel(t, kind), max = sim.nodeMax(t, kind), cost = sim.nodeCost(t, kind), open = sim.nodeOpen(t, kind);
        const ok = sim.canBuyNode(t, kind);
        nodeAffordable = nodeAffordable || ok;
        if (this.tab !== 'tree') return;
        const el = $(`nd-${t}-${kind}`);
        if (!el) return;
        el.classList.toggle('have', lv > 0);
        el.classList.toggle('maxed', lv >= max);
        el.classList.toggle('shut', !open);
        el.classList.toggle('afford', ok);
        el.classList.toggle('sel', this.sel.t === t && this.sel.kind === kind);
        el.querySelector('.pip').textContent = kind === 'unlock' ? '' : `${lv}/${max}`;
      });
    });
    $('treeDot').hidden = !nodeAffordable || this.tab === 'tree';
    if (this.tab === 'tree') this.treeCard();

    const left = sim.starsLeft();
    let perkAffordable = false;
    D.STAR_PERKS.forEach(k => {
      const lvl = s.perks[k.key], cost = sim.perkCost(k.key), maxed = !isFinite(cost), ok = !maxed && cost <= left;
      perkAffordable = perkAffordable || ok;
      if (this.tab !== 'stars') return;
      const row = $('pk-' + k.key);
      row.querySelector('.lv').textContent = `Lv ${lvl}/${k.costs.length}`;
      row.querySelector('.desc').textContent = perkText(k, maxed ? lvl : lvl + 1);
      const btn = row.querySelector('.buy');
      btn.disabled = !ok;
      btn.classList.toggle('afford', ok);
      btn.querySelector('.cost').textContent = maxed ? 'Max' : `${cost} ★`;
      btn.querySelector('.lbl').textContent = maxed ? 'Done' : 'Buy';
    });
    $('starDot').hidden = !perkAffordable || this.tab === 'stars';
    if (this.tab === 'stars') {
      $('starsNote').textContent = s.stars
        ? `${this.starWord(left)} to spend. All ${s.stars} you have earned add +${fmt(s.stars * D.STAR_BONUS * 100)}% bits, spent or not.`
        : 'Find the Golden Pixel to earn stars. Spend them here on perks that last through every world.';
    }

    if (this.tab === 'world' && $('st-broken')) {
      $('st-broken').textContent = fmt(s.broken);
      $('st-mined').textContent = pct(s.cleared) + '%';
      $('st-left').textContent = sim.pixelsLeft().toLocaleString('en-US');
      $('st-bonus').textContent = '×' + fmtX(s.clearMult);
      $('clearNote').textContent = this.clearText();
      $('st-time').textContent = fmtTime(s.playTime);
      $('st-depth').textContent = s.depth;
      $('st-stars').textContent = s.stars;
      $('st-earned').textContent = fmt(s.earned);
      $('st-life').textContent = fmt(s.lifetime);
      $('st-relics').textContent = `${s.relics.length} / ${g.world.relics.length}`;
    }
  };

  // Tell the renderer which band of the screen is not covered by HUD or sheet.
  U.measure = function () {
    const r = this.g.renderer;
    r.safeTop = document.querySelector('.hud').getBoundingClientRect().bottom - 14;
    r.safeBottom = $('sheet').getBoundingClientRect().top;
  };

  U.tick = function (dt) {
    const bits = this.g.state.bits;
    this.shown += (bits - this.shown) * Math.min(1, dt * 6);
    if (Math.abs(bits - this.shown) < 1) this.shown = bits;
    const txt = fmt(this.shown);
    if (txt !== this.bitsTxt) { this.bitsTxt = txt; $('bits').textContent = txt; }
    this.t += dt;
    if (this.t >= 0.2) {
      this.t = 0;
      this.measure();
      this.refresh();
    }
    if (this.toastT > 0) {
      this.toastT -= dt;
      if (this.toastT <= 0) $('toast').hidden = true;
    }
  };

  PQ.UI = UI;
  PQ.fmt = fmt;
})();

</script>
<script>
// Pixel Quarry: boot, game loop, autosave.
(function () {
  const PQ = window.PQ, D = PQ.DATA;
  const BUILD = '20261025-153453';                       // build.py stamps the build time here
  const $ = id => document.getElementById(id);
  const canvas = $('world');
  const yieldFrame = () => new Promise(r => setTimeout(r, 0));

  function newSeed() {
    try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return (Math.random() * 4294967296) >>> 0; }
  }

  function progress(f, text) {
    $('loadBar').style.width = (Math.min(1, f) * 100).toFixed(1) + '%';
    if (text) $('loadText').textContent = text;
  }

  const game = PQ.game = { state: null, world: null, sim: null, renderer: null, ui: null, input: null, running: false };
  let saving = false;

  async function saveAll() {
    if (!game.sim || saving) return;
    saving = true;
    try { await PQ.Save.saveGame(game.state, game.world, game.sim); } catch (e) { PQ.Save.saveMeta(game.state); }
    saving = false;
  }

  async function boot(state, restore) {
    game.running = false;
    $('loading').hidden = false;
    progress(0, 'Generating 10,000,000 pixels');
    await yieldFrame();

    const world = PQ.World.create(state.seed, state.depth);
    PQ.World.prepare(world);
    const CH = 160;
    for (let y = 0; y < D.H; y += CH) {
      PQ.World.genRows(world, y, Math.min(D.H, y + CH));
      progress(0.65 * Math.min(1, (y + CH) / D.H));
      await yieldFrame();
    }
    PQ.World.finalize(world);

    let saved = null;
    if (restore) { try { saved = await PQ.Save.loadWorld(world.seed); } catch (e) { saved = null; } }
    if (saved) {
      PQ.World.applyMined(world, saved.mined, !state.found);
      if (saved.fog && saved.fog.length === world.fog.length) world.fog.set(saved.fog);
      else PQ.World.fogFromMined(world);                     // save from before fog existed
    }
    else state.drop = { x: D.START.x, y: D.START.y };

    const sim = new PQ.Sim(world, state);
    if (saved) sim.importBalls(saved.balls);
    sim.spawnMissing();

    const renderer = new PQ.Renderer(canvas, world, sim);
    renderer.resize();
    progress(0.65, 'Drawing the map');
    await renderer.buildOverview(f => progress(0.65 + 0.35 * f));
    renderer.lookAtDrop(state.drop, 6);

    Object.assign(game, { state, world, sim, renderer });
    if (game.input) game.input.r = renderer;
    else game.input = new PQ.Input(canvas, renderer, {
      tap: p => onTap(p, false),
      hold: p => onTap(p, true),
    });
    if (game.ui) { game.ui.g = game; game.ui.build(); game.ui.showTab(game.ui.tab); }
    else game.ui = new PQ.UI(game);
    game.ui.measure();
    game.ui.refresh();

    $('loading').hidden = true;
    game.running = true;
  }

  let aimHinted = false, moveHinted = false;
  function onTap(p, held) {
    const sim = game.sim;
    const x = Math.floor(p.x), y = Math.floor(p.y);
    const open = x >= 0 && y >= 0 && x < D.W && y < D.H && !(game.world.cells[y * D.W + x] & D.TYPE_MASK);
    if (held && open) {                        // hold on open space: move the launcher there
      if (sim.moveLauncher(p.x, p.y) && !moveHinted) { moveHinted = true; game.ui.toast('Launcher moved. New balls fire from here.'); }
      return;
    }
    if (held && !open && !(x >= 0 && y >= 0 && x < D.W && y < D.H)) return;
    const e0 = game.state.earned;
    const r = sim.tap(p.x, p.y);
    const gain = game.state.earned - e0;
    if (gain >= 1) game.renderer.float(p.x, p.y, '+' + PQ.fmt(gain));
    if (r === 'relic') game.ui.toast('Relics cannot be broken. Balls bounce off them.');
    if (r === 'dark' && !held) game.ui.toast('Too dark to dig there. Balls light up the rock as they go.');
    if (r === 'aim' && !aimHinted) { aimHinted = true; game.ui.toast('Aimed. New balls fire this way. Hold on open space to move the launcher.', 3600); }
  }

  game.newWorld = async function (prestige) {
    const s = game.state;
    const next = prestige ? PQ.prestige(s, newSeed()) : PQ.prestige(Object.assign({}, s, { found: false }), newSeed());
    try { await PQ.Save.clearWorld(); } catch (e) { /* ignore */ }
    PQ.Save.saveMeta(next);
    await boot(next, false);
    await saveAll();
    const bonus = next.clearMult > 1 ? ` Clear bonus: ×${+next.clearMult.toFixed(2)} this dig.` : '';
    if (prestige) game.ui.toast(`Depth ${next.depth}. ${game.ui.depthNote(next.depth)}${bonus}`, 5000);
  };

  game.reload = function () { location.reload(); };
  game.build = BUILD;

  // Ask for a newer version now; reloads onto it, or says this one is current.
  game.checkUpdate = async function () {
    await saveAll();
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
      const res = await fetch('./?check=' + Date.now(), { cache: 'no-store' });
      const html = await res.text();
      const m = html.match(/const BUILD = '([^']+)'/);
      if (m && m[1] !== BUILD) { game.ui.toast('Updating…'); setTimeout(() => location.reload(), 600); return; }
      game.ui.toast('You have the latest version.');
    } catch (e) { game.ui.toast('Could not reach the server. Try again when online.'); }
  };

  let last = performance.now(), lastWall = Date.now(), saveT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const wall = Date.now();
    if (!game.running) { last = now; lastWall = wall; return; }
    const gap = (wall - lastWall) / 1000;
    lastWall = wall;
    if (gap > 60) game.ui.offline(game.sim.offline(gap));
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    const { sim, renderer, state } = game;
    sim.step(dt);
    game.input.update(dt);
    renderer.radar = state.global.radar;
    renderer.particles = state.settings.particles;
    renderer.draw(dt);
    for (const e of sim.events.splice(0)) {
      if (e.type === 'gold') { game.ui.gold(); saveAll(); }
      if (e.type === 'relic') game.ui.relic(e);
      if (e.type === 'dia') game.ui.diamond(e);
      if (e.type === 'clear') { game.ui.cleared(); saveAll(); }
    }
    game.ui.tick(dt);

    saveT += dt;                               // progress and world always save together (see Save.saveGame)
    if (saveT > 10) { saveT = 0; saveAll(); }
  }

  window.addEventListener('resize', () => game.renderer && game.renderer.resize());
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
  window.addEventListener('pagehide', saveAll);

  // Back twice to leave: the first swipe or press back only warns, so a stray gesture can't close
  // the game. Browsers skip history entries made without a tap, so the guard is armed on a tap.
  if (window.top === window.self) {
    let armed = !!(history.state && history.state.pq), warnedAt = 0;
    window.addEventListener('pointerup', () => {
      if (armed || Date.now() - warnedAt < 2500) return;
      try { history.pushState({ pq: 1 }, ''); armed = true; } catch (e) { /* no history here */ }
    }, true);
    window.addEventListener('popstate', () => {
      if (!armed) return;
      armed = false; warnedAt = Date.now();
      saveAll();
      if (game.ui) game.ui.toast('Swipe back again to close Pixel Quarry.', 2500);
    });
  }

  async function start() {
    const meta = PQ.Save.loadMeta();
    const state = meta ? PQ.Save.migrate(meta) : PQ.newState(newSeed());
    await boot(state, !!meta);
    if (meta && state.rebuilt) {
      delete state.rebuilt;
      PQ.Save.saveMeta(state);
      game.ui.modal(`<p class="kicker">The quarry has changed</p>
        <h2>A new world, in the dark.</h2>
        <p>Pixel Quarry was rebuilt: you now start in a cave in the middle of everything, ball upgrades live in a skill tree paid with ◆ from magenta upgrade pixels, and relics hold pieces of a story.</p>
        <p class="sub">Your old world could not come along. Your depth, stars and perks did.</p>
        <div class="actions"><button type="button" class="btn gold" data-act="close">Start digging</button></div>`);
    } else if (meta) {
      const away = (Date.now() - (meta.savedAt || Date.now())) / 1000;
      if (away > 60) game.ui.offline(game.sim.offline(away));
    } else {
      game.ui.welcome();
      PQ.Save.saveMeta(state);
    }
    lastWall = Date.now();
    requestAnimationFrame(frame);
  }

  // Offline install, only where a real page can host a service worker.
  try {
    if ('serviceWorker' in navigator && window.isSecureContext && window.top === window.self &&
        document.querySelector('link[rel="manifest"]')) {
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(reg => {
        document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
      }).catch(() => {});
      let swapping = false;
      navigator.serviceWorker.addEventListener('controllerchange', async () => {
        if (!had || swapping) return;          // first install: this page is already current
        swapping = true;
        await saveAll();
        location.reload();
      });
    }
  } catch (e) { /* sandboxed frame */ }

  start();
})();

</script>
</body>
</html>
