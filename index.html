<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Quarry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Ten million pixels, one of them gold. Buy balls, mine the world, find the Golden Pixel.">
<meta name="theme-color" content="#080b09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Quarry">
<link rel="manifest" href="manifest.webmanifest"><!--pwa-->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><!--pwa-->
<link rel="icon" type="image/png" href="icons/icon-192.png"><!--pwa-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: the quarry canvas fills the screen; a translucent HUD strip rides the top,
   a pull-up shop sheet sits at the bottom. One deliberate dark world, one gold accent. */
/* Digits only, from VT323: Pixelify's 8 pinches into an S at small sizes. Scaled to Pixelify's height. */
@font-face {
  font-family: 'PQ Digits';
  src: url(https://fonts.gstatic.com/s/vt323/v18/pxiKyp0ihIEF2isfFJU.woff2) format('woff2');
  unicode-range: U+0030-0039;
  size-adjust: 125%;
  font-display: swap;
}
:root {
  --ground: #080b09;
  --panel: #0f1511;
  --panel-2: #172019;
  --line: #26342a;
  --ink: #e6efe6;
  --muted: #8fa394;
  --neon: #6dff7c;
  --dia: #ff40e0;
  --gold: #ffd640;
  --gold-ink: #1c1604;
  --warn: #ff6a58;
  --display: 'PQ Digits', 'Pixelify Sans', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.4 var(--body);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ---- HUD ---- */
.hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 18px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  background: linear-gradient(to bottom, rgba(15, 13, 21, 0.88) 55%, rgba(15, 13, 21, 0));
  pointer-events: none;
}
.hud > * { pointer-events: auto; min-width: 0; }
.bits {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 700 30px/1 var(--display);
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.bits::before {
  content: '';
  flex: none;
  width: 13px; height: 13px;
  background: var(--gold);
  box-shadow: 0 0 12px rgba(255, 214, 64, 0.55);
}
.rate { margin-top: 5px; font: 500 17px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.hud-right { text-align: right; }
.ballcount { font: 500 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.ballcount small { font: 13px var(--body); color: var(--muted); }
.mini-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.chip {
  min-height: 34px;
  padding: 0 12px;
  background: rgba(24, 21, 31, 0.9);
  border: 1px solid var(--line);
  font-size: 13px;
  letter-spacing: 0.04em;
}
.chip:active { background: var(--panel-2); }

.radar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  padding: 5px 10px;
  background: rgba(24, 21, 31, 0.9);
  border: 1px solid var(--line);
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.radar[hidden] { display: none; }
.chip.deeper { margin-top: 8px; background: var(--gold); border-color: var(--gold); color: #1a1408; font-weight: 700; }
.chip.deeper[hidden] { display: none; }
.heat { flex: none; width: 64px; height: 6px; background: var(--line); }
.heat i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #4aa8ff, var(--gold) 65%, var(--warn)) 0 0 / 64px 100%;
  transition: width 0.4s;
}

/* ---- shop sheet ---- */
.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
}
@media (min-width: 561px) { .sheet { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.sheet-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 6px;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
.tabs button {
  position: relative;
  min-height: 44px;
  padding: 0 10px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  font: 500 16px var(--display);
  color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.dot { position: absolute; top: 9px; right: 2px; width: 6px; height: 6px; background: var(--gold); }
.buyrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.buymode { display: flex; border: 1px solid var(--line); flex: none; }
.buymode button {
  min-height: 32px;
  min-width: 38px;
  padding: 0 7px;
  background: none;
  border: 0;
  font-size: 13px;
  color: var(--muted);
}
.buymode button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
.grip {
  flex: none;
  width: 36px; height: 36px;
  background: none;
  border: 1px solid var(--line);
  position: relative;
}
.grip::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 10px; height: 10px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: translate(-50%, -75%) rotate(45deg);
}
.sheet:not(.open) .grip::before { transform: translate(-50%, -25%) rotate(-135deg); }
.sheet-body {
  max-height: 0;
  overflow: hidden;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  transition: max-height 0.22s ease;
}
.sheet.open .sheet-body { max-height: 40vh; max-height: 40dvh; overflow-y: auto; overscroll-behavior: contain; }
.panel { padding-bottom: 12px; }

.group-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 0 2px;
  font: 500 13px var(--display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.row {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row.plain { grid-template-columns: minmax(0, 1fr) auto; }
.swatch { width: 14px; height: 14px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45); }
.name { font: 500 17px/1.2 var(--display); }
.name .count, .name .lv { font: 13px var(--body); color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.desc { margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.row.locked .name, .row.locked .swatch { opacity: 0.45; filter: grayscale(1); }
.row.mystery .swatch { background: var(--line); }
.row.ready .swatch { animation: pulse 1.2s ease-in-out infinite; }
.row.ready .buy:not(:disabled) { background: rgba(255, 214, 64, 0.12); }
.prog { height: 4px; margin-top: 6px; background: var(--line); }
.prog i { display: block; height: 100%; width: 0; background: var(--gold); }
.prog[hidden] { display: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 214, 64, 0.35); } }

/* Unlock reveal: the new ball bouncing on a strip of rock */
.reveal { position: relative; height: 72px; margin: -4px 0 10px; border-bottom: 3px solid var(--line); overflow: hidden; }
.reveal i {
  position: absolute; left: calc(50% - 9px); bottom: 0; width: 18px; height: 18px;
  background: var(--c); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
  animation: hop 0.9s cubic-bezier(0.3, 0, 0.7, 1) infinite alternate;
}
@keyframes hop { from { transform: translateY(0) scaleY(0.8); } 20% { transform: translateY(-6px) scaleY(1); } to { transform: translateY(-50px); } }
.kicker { margin: 0; font: 500 12px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .reveal i, .row.ready .swatch { animation: none; } }
.buy {
  min-width: 96px;
  min-height: 46px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 1px;
  padding: 5px 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.buy .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.buy .cost { font: 500 16px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.buy.afford { border-color: rgba(255, 214, 64, 0.6); }
.buy:disabled { cursor: default; opacity: 0.5; }
.buy:disabled .cost { color: var(--muted); }
.buy:not(:disabled):active { transform: translateY(1px); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 12px 0 4px; }
.stats div { min-width: 0; }
.stats dt { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 500 19px var(--display); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn {
  min-height: 44px;
  padding: 0 14px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 14px;
}
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--gold); }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.confirm { margin-top: 10px; padding: 12px; border: 1px solid var(--warn); }
.confirm p { margin: 0 0 8px; font-size: 14px; }
textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 84px;
  margin-top: 8px;
  padding: 8px;
  background: var(--ground);
  color: var(--ink);
  border: 1px solid var(--line);
  font: 11px/1.3 ui-monospace, Menlo, monospace;
  -webkit-user-select: text;
  user-select: text;
  word-break: break-all;
}

/* ---- toast, modal, loading ---- */
.toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 96px);
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 8px 14px;
  background: rgba(24, 21, 31, 0.96);
  border: 1px solid var(--line);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
}
.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(6, 5, 9, 0.72);
}
.modal[hidden] { display: none; }
.card {
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 22px 20px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.card h2 { margin: 0 0 10px; font: 700 26px/1.1 var(--display); color: var(--gold); text-wrap: balance; }
.card p { margin: 0 0 10px; color: var(--ink); line-height: 1.45; }
.card p.sub { color: var(--muted); font-size: 14px; }
.card ul { margin: 0 0 12px; padding-left: 18px; color: var(--muted); font-size: 14px; }
.card li { margin: 4px 0; }
.card .actions { margin-top: 16px; }
.card .big { font: 700 34px var(--display); color: var(--gold); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }

.loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 18px;
  background: var(--ground);
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.loading[hidden] { display: none; }
.logo { font: 700 40px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.logo b { color: var(--gold); margin-left: 10px; font-weight: 700; }
.bar { width: 220px; max-width: 70vw; height: 8px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); }
#loadText { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .sheet-body, .heat i { transition: none; }
}

/* Diamonds in the HUD */
.dia { margin-top: 4px; font: 500 15px/1 var(--display); color: var(--dia); text-shadow: 0 0 8px rgba(255, 64, 224, 0.55); font-variant-numeric: tabular-nums; }
.row[hidden] { display: none; }

/* Skill tree: one branch per ball, neon nodes joined by lines */
.treecard {
  position: sticky; top: 0; z-index: 1;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 10px 12px; margin-bottom: 10px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
}
.treecard .tc-head { grid-column: 1; display: flex; flex-direction: column; gap: 2px; }
.treecard .tc-kick { font: 500 11px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); }
.treecard .tc-name { font: 700 17px/1.1 var(--display); }
.treecard .tc-name small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 4px; }
.treecard .tc-body { grid-column: 1; margin: 0; font-size: 13px; color: var(--muted); }
.treecard .tc-body b { color: var(--ink); }
.treecard .buy { grid-column: 2; grid-row: 1 / span 2; }
.treecard .buy .cost { color: var(--dia); }
.tree { display: flex; flex-direction: column; gap: 10px; }
.branch { display: flex; align-items: center; color: var(--c); }
.branch .link { flex: 0 0 14px; height: 2px; background: var(--c); opacity: 0.35; }
.node {
  position: relative; flex: 0 0 auto;
  width: 46px; height: 46px; padding: 9px;
  display: grid; place-items: center;
  background: #0b100c; color: var(--c);
  border: 2px solid var(--c); border-radius: 8px;
  opacity: 0.3; filter: grayscale(0.6);
}
/* Only what you can buy right now is bright and glowing; owned levels are filled but quiet. */
.node.root { border-radius: 50%; }
.node svg { width: 24px; height: 24px; }
.node.have { opacity: 0.6; filter: none; background: color-mix(in srgb, var(--c) 16%, #0b100c); }
.node.afford { opacity: 1; filter: none; box-shadow: 0 0 10px color-mix(in srgb, var(--c) 45%, transparent); }
.node.afford:not(.maxed) { animation: nodepulse 1.4s ease-in-out infinite; }
.node.shut { opacity: 0.18; }
.node.sel { outline: 2px solid var(--ink); outline-offset: 2px; }
.node .pip {
  position: absolute; right: -4px; bottom: -6px;
  padding: 0 3px; border-radius: 4px;
  background: var(--ground); color: var(--ink);
  font: 500 10px/14px var(--display);
}
.node .pip:empty { display: none; }
@keyframes nodepulse { 50% { box-shadow: 0 0 14px var(--c); } }

/* Journal and story cards */
.journal { margin: 0 0 10px; }
.journal h3, .journal summary { margin: 0 0 6px; font: 700 15px var(--display); color: var(--ink); cursor: pointer; }
.journal small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.journal ol { margin: 0; padding-left: 28px; color: var(--ink); font-size: 14px; }
.journal li { margin: 5px 0; line-height: 1.45; }
.journal li.gap { color: var(--muted); letter-spacing: 0.3em; }
.card p.story { font-size: 16px; line-height: 1.55; color: var(--ink); border-left: 2px solid var(--neon); padding-left: 12px; }
@media (prefers-reduced-motion: reduce) { .node.afford:not(.maxed) { animation: none; } }
.row.locked .buy .cost { color: var(--muted); }
.row.locked .buy.afford .cost { color: var(--dia); }
.row.locked .buy.afford { border-color: rgba(255, 64, 224, 0.6); }

</style>
</head>
<body>
<canvas id="world" aria-label="The quarry. Drag to look around, pinch to zoom, tap rock to dig, tap open space to aim the launcher, hold open space to move it."></canvas>

<header class="hud">
  <div class="hud-left">
    <div class="bits" id="bits" aria-live="off">0</div>
    <div class="rate" id="rate">+0 bits/s</div>
    <div class="dia" id="dia" title="Diamonds, from upgrade pixels. Spend them in the Tree.">◆ 0</div>
    <div class="radar" id="radar" title="Gold radar: how close your nearest ball is to the Golden Pixel" hidden>
      <span class="heat"><i id="heat"></i></span>
      <span id="radarText">Cold</span>
    </div>
    <button class="chip deeper" id="btnDeeper" type="button" hidden>Go deeper</button>
  </div>
  <div class="hud-right">
    <div class="ballcount"><span id="ballCount">1</span> <small>balls</small></div>
    <div class="mini-btns">
      <button class="chip" id="btnDrop" type="button" title="Jump to the launcher">Launcher</button>
      <button class="chip" id="btnMap" type="button" title="Zoom out to the whole world">Map</button>
    </div>
  </div>
</header>

<section class="sheet open" id="sheet" aria-label="Shop">
  <div class="sheet-bar">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-balls" data-tab="balls" aria-selected="true">Balls<span class="dot" id="ballDot" hidden></span></button>
      <button type="button" role="tab" id="tab-tree" data-tab="tree" aria-selected="false">Tree<span class="dot" id="treeDot" hidden></span></button>
      <button type="button" role="tab" id="tab-stars" data-tab="stars" aria-selected="false">Stars<span class="dot" id="starDot" hidden></span></button>
      <button type="button" role="tab" id="tab-world" data-tab="world" aria-selected="false">World</button>
    </nav>
    <button type="button" class="grip" id="grip" aria-label="Hide shop" aria-expanded="true"></button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="panel" id="panel-balls" role="tabpanel"></div>
    <div class="panel" id="panel-tree" role="tabpanel" hidden></div>
    <div class="panel" id="panel-stars" role="tabpanel" hidden></div>
    <div class="panel" id="panel-world" role="tabpanel" hidden></div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<div class="loading" id="loading">
  <div class="logo">Pixel<b>Quarry</b></div>
  <div class="bar"><i id="loadBar"></i></div>
  <p id="loadText">Generating 10,000,000 pixels</p>
</div>

<script>
// Pixel Quarry: all tables and constants. No logic lives here.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ = root.PQ || {};

  const W = 2500, H = 4000;               // 10,000,000 pixels

  PQ.DATA = {
    W, H, N: W * H,
    GEN: 2,                                 // world generation version; saves of another version start over
    TILE: 128,                              // render tile edge, world px
    OV: 2,                                  // overview downscale factor
    START: { x: W / 2, y: H / 2, r: 26 },   // the cave every world starts in, at the centre
    MAX_BALLS: 4000,
    FOG: 4,                                 // fog-of-war cell edge, world px (code shifts by 2: keep it 4)
    SIGHT: 20,                              // how far a ball lights up the rock around it, px
    RELIC_REWARD_S: 30,                     // a relic find pays this many seconds of income
    TYPE_MASK: 0x0f,
    POISON: 0x80,

    // Cell types. hp = hits of 1 damage, val = bits paid when broken.
    // col = the neon colour an exposed pixel glows; colour tells hardness at a glance.
    MAT: [
      { id: 0,  key: 'air',      name: 'Air' },
      { id: 1,  key: 'moss',     name: 'Moss',      hp: 1,   val: 1,   col: [70, 230, 96] },
      { id: 2,  key: 'lichen',   name: 'Lichen',    hp: 2,   val: 2,   col: [166, 236, 64] },
      { id: 3,  key: 'clay',     name: 'Clay',      hp: 3,   val: 4,   col: [244, 222, 60] },

<script>
// Pixel Quarry: world generation. Same seed always gives the same world, which
// is what lets a save store only which pixels were mined.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T;
  const W = D.W, H = D.H, N = D.N;
  const FW = Math.ceil(W / D.FOG), FH = Math.ceil(H / D.FOG);

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function hash2(x, y, s) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(x - xi), v = smooth(y - yi);
    const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s);
    const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // Low-frequency noise sampled every `step` px along a row and lerped between.
  function rowNoise(buf, y, fx, fy, s, step) {
    let prev = vnoise(0, y * fy, s);
    for (let x0 = 0; x0 < W; x0 += step) {
      const next = vnoise((x0 + step) * fx, y * fy, s);
      const end = Math.min(W, x0 + step);
      for (let x = x0; x < end; x++) buf[x] = prev + (next - prev) * ((x - x0) / step);
      prev = next;
    }
  }

  function create(seed, depth) {
    return {
      W, H, N, seed: seed >>> 0,
      depth: depth | 0,                     // worlds cleared before this one: deeper, harder rock
      cells: new Uint8Array(N),
      dmg: new Uint8Array(N),
      mined: new Uint8Array((N + 7) >> 3),
      fog: new Uint8Array(FW * FH),         // 0 hidden .. 255 seen, one per FOG x FOG cell
      relicCell: new Uint8Array(FW * FH),   // relic index + 1 for fog cells that hold relic pixels
      FW, FH,
      relics: [],
      gold: { x: 0, y: 0 },
      upgrades: [],                         // cell indexes of the upgrade pixels
      solidTotal: 0,
      minedCount: 0,
    };
  }

  // How far out a point is: 0 at the start cave, 1 at the middle of each edge, ~1.4 in a corner.
  const SX = D.START.x, SY = D.START.y;
  function reach(x, y) { return Math.hypot((x - SX) / (W / 2), (y - SY) / (H / 2)); }

  function prepare() { /* nothing to precompute: the world has no surface */ }

  const warpBuf = new Float32Array(W), caveA = new Float32Array(W), caveB = new Float32Array(W);

  function genRows(w, y0, y1) {
    const s = w.seed, cells = w.cells, TI = D.TIERS, AT = D.TIER_AT, SP = D.SPECKLE;
    const magmaF = D.DEPTH.magma(w.depth), adamF = D.DEPTH.adamant(w.depth);
    const top = adamF < 9 ? 7 : magmaF < 9 ? 6 : 5;     // hardest tier this depth has at all
    const R0 = D.START.r;
    for (let y = y0; y < y1; y++) {
      rowNoise(warpBuf, y, 1 / 140, 1 / 140, s + 4, 16);
      rowNoise(caveA, y, 1 / 90, 1 / 55, s + 5, 8);
      rowNoise(caveB, y, 1 / 26, 1 / 26, s + 6, 4);
      const row = y * W, dy = (y - SY) / (H / 2);
      let blk = 1;
      for (let x = 0; x < W; x++) {
        if ((x & 15) === 0) blk = hash2(x >> 4, y >> 4, s + 8);
        const dx = (x - SX) / (W / 2), f0 = Math.sqrt(dx * dx + dy * dy);
        // The start cave: a rough hole in the middle of everything.
        if (f0 < 0.03 && Math.hypot(x - SX, y - SY) < R0 + (vnoise(x / 9, y / 9, s + 10) - 0.5) * 14) {
          cells[row + x] = T.AIR; continue;
        }
        const f = f0 + (warpBuf[x] - 0.5) * 0.14;
        let b = 0;
        while (b < AT.length && f >= AT[b]) b++;
        if (f >= magmaF) b = f >= adamF ? 7 : 6;
        const h = hash2(x, y, s + 12);
        if (h < SP) b = b > 0 ? b - 1 : 0;
        else if (h > 1 - SP) b = b < top && (b < 5 || f >= magmaF - 0.04) ? b + 1 : b;
        let t = TI[b];
        if (f0 > 0.05) {
          const caveThr = 0.70 - 0.05 * Math.min(1, f);
          if (caveA[x] * 0.62 + caveB[x] * 0.38 > caveThr) t = T.AIR;
          else if (blk < 0.12 && vnoise(x / 5, y / 5, s + 9) > 0.64) {
            if (f < 0.55) t = T.COPPER;
            else if (f < 0.85) t = blk < 0.04 ? T.SILVER : T.COPPER;
            else t = blk < 0.015 ? T.AMETHYST : blk < 0.06 ? T.SILVER : T.COPPER;
          }
        }
        cells[row + x] = t;
      }
    }
  }

  function overlaps(list, x0, y0, x1, y1, pad) {
    for (const r of list) {
      if (x0 < r.x1 + pad && x1 > r.x0 - pad && y0 < r.y1 + pad && y1 > r.y0 - pad) return true;
    }
    return false;
  }

  // Rock walled in by a relic's own outline (an eye socket, the inside of a ring) can never
  // be reached, which would make a full clear impossible. Hollow it out.
  function hollowRelics(w) {
    const cells = w.cells;
    for (const r of w.relics) {
      const x0 = Math.max(0, r.x0), x1 = Math.min(W, r.x1), y0 = Math.max(0, r.y0), y1 = Math.min(H, r.y1);
      const bw = x1 - x0, bh = y1 - y0, open = new Uint8Array(bw * bh), stack = [];
      const push = (x, y) => {
        const k = (y - y0) * bw + (x - x0);
        if (open[k] || cells[y * W + x] === T.RELIC) return;
        open[k] = 1; stack.push(k);
      };
      for (let x = x0; x < x1; x++) { push(x, y0); push(x, y1 - 1); }
      for (let y = y0; y < y1; y++) { push(x0, y); push(x1 - 1, y); }
      while (stack.length) {
        const k = stack.pop(), x = x0 + k % bw, y = y0 + ((k / bw) | 0);
        if (x > x0) push(x - 1, y);
        if (x < x1 - 1) push(x + 1, y);
        if (y > y0) push(x, y - 1);
        if (y < y1 - 1) push(x, y + 1);
      }
      for (let k = 0; k < bw * bh; k++) {
        const i = (y0 + ((k / bw) | 0)) * W + x0 + k % bw;
        if (!open[k] && cells[i] !== T.RELIC) cells[i] = T.AIR;
      }
    }
  }

  // Relics, the Golden Pixel and the solid-pixel count. Run after every row exists.
  function finalize(w) {
    const rng = mulberry32(w.seed ^ 0x9e3779b9);
    const cells = w.cells;
    w.relics = PQ.Relics.place(w, rng);
    hollowRelics(w);

    // The Golden Pixel sits far out, fully buried, away from relics. Deeper worlds push it farther.
    const minF = D.DEPTH.goldTop(w.depth), buriedAt = (x, y) => {
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const t = cells[(y + dy) * W + x + dx];
          if (t === T.AIR || t === T.RELIC) return false;
        }
      }
      return true;
    };
    for (let tries = 0; tries < 20000; tries++) {
      const x = 60 + Math.floor(rng() * (W - 120));
      const y = 50 + Math.floor(rng() * (H - 100));
      const f = reach(x, y);
      if (f < minF || f > 1.36) continue;
      if (overlaps(w.relics, x, y, x + 1, y + 1, 12) || !buriedAt(x, y)) continue;
      cells[y * W + x] = T.GOLD;
      w.gold = { x, y };
      break;
    }

    // Upgrade pixels: a few close to the start, the rest anywhere in the rock.
    const U = D.UPGRADES;
    w.upgrades = [];
    for (let n = 0, tries = 0; n < U.count && tries < U.count * 40; tries++) {
      const near = n < U.near;
      const a = rng() * Math.PI * 2, r = 0.025 + rng() * 0.05;
      const x = near ? Math.round(SX + Math.cos(a) * r * W / 2) : Math.floor(rng() * W);
      const y = near ? Math.round(SY + Math.sin(a) * r * H / 2) : Math.floor(rng() * H);
      const i = y * W + x, t = cells[i];
      if (!t || t === T.RELIC || t === T.GOLD || t === T.UPGRADE) continue;
      if (Math.abs(x - w.gold.x) + Math.abs(y - w.gold.y) < 6) continue;
      cells[i] = T.UPGRADE;
      w.upgrades.push(i);
      n++;
    }

    let solid = 0;
    for (let i = 0; i < N; i++) { const t = cells[i]; if (t !== T.AIR && t !== T.RELIC) solid++; }
    w.solidTotal = solid;

    w.relicCell.fill(0);
    w.relics.forEach((r, idx) => {
      for (let y = Math.max(0, r.y0); y < Math.min(H, r.y1); y++) {
        for (let x = Math.max(0, r.x0); x < Math.min(W, r.x1); x++) {
          if (cells[y * W + x] === T.RELIC) w.relicCell[(y >> 2) * FW + (x >> 2)] = idx + 1;
        }
      }
    });
    initFog(w);
  }

  // Everything starts dark except the start cave and a little rock around it.
  function initFog(w) {
    w.fog.fill(0);
    const R = D.START.r + 40;
    for (let cy = Math.floor((SY - R - 8) / 4); cy <= Math.ceil((SY + R + 8) / 4); cy++) {
      for (let cx = Math.floor((SX - R - 8) / 4); cx <= Math.ceil((SX + R + 8) / 4); cx++) {
        const v = (R + 4 - Math.hypot(cx * 4 + 2 - SX, cy * 4 + 2 - SY)) * 32;
        if (v > 0) w.fog[cy * FW + cx] = Math.min(255, v | 0);
      }
    }
  }

  // For saves made before fog existed: uncover everything already mined, plus a margin.
  function fogFromMined(w) {
    const fog = w.fog, m = w.mined;
    for (let b = 0; b < m.length; b++) {
      if (!m[b]) continue;
      for (let k = 0; k < 8; k++) {
        if (!((m[b] >> k) & 1)) continue;
        const i = (b << 3) + k, x = i % W, y = (i / W) | 0;
        fog[(y >> 2) * FW + (x >> 2)] = 255;
      }
    }
    for (let pass = 0; pass < 4; pass++) {
      const src = fog.slice();
      for (let cy = 0; cy < FH; cy++) {
        for (let cx = 0; cx < FW; cx++) {
          const k = cy * FW + cx;
          if (src[k] === 255) continue;
          if ((cx > 0 && src[k - 1] === 255) || (cx < FW - 1 && src[k + 1] === 255) ||
              (cy > 0 && src[k - FW] === 255) || (cy < FH - 1 && src[k + FW] === 255)) fog[k] = 255;
        }
      }
    }
  }

  function generate(w) {
    prepare(w);
    genRows(w, 0, H);
    finalize(w);
    return w;
  }

  // Re-applies a save's mined bitset to a freshly generated world. With keepGold,
  // the Golden Pixel survives even if the save mined that spot (a save made before
  // a world-generation change can point at rock that is now the gold).
  function applyMined(w, bits, keepGold) {
    const cells = w.cells, goldI = w.gold.y * W + w.gold.x;
    let count = 0;
    const len = Math.min(bits.length, w.mined.length);
    for (let b = 0; b < len; b++) {
      const v = bits[b];
      if (!v) continue;
      for (let k = 0; k < 8; k++) {
        if ((v >> k) & 1) {
          const i = (b << 3) + k;
          if (i < N && cells[i] !== T.RELIC && !(keepGold && i === goldI)) { cells[i] = T.AIR; count++; }
        }
      }
      w.mined[b] = v;
    }
    w.minedCount = count;
  }

  PQ.World = { create, prepare, genRows, finalize, generate, applyMined, initFog, fogFromMined, reach, mulberry32, hash2, vnoise };
})();

// Pixel Quarry: relics. Each one is a 2D distance field, drawn into the world as glowing
// white line art: its outline, plus any inner lines the shape defines. Relic cells are
// unbreakable. Rock sealed inside an outline is hollowed out by the world afterwards.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, W = D.W, H = D.H;
  const hyp = Math.hypot;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // ---- distance-field primitives (negative inside) ----
  const circle = (x, y, cx, cy, r) => hyp(x - cx, y - cy) - r;
  const ring = (x, y, cx, cy, r, t) => Math.abs(hyp(x - cx, y - cy) - r) - t;
  function capsule(x, y, ax, ay, bx, by, ra, rb) {
    const pax = x - ax, pay = y - ay, bax = bx - ax, bay = by - ay;
    const h = clamp((pax * bax + pay * bay) / (bax * bax + bay * bay), 0, 1);
    return hyp(pax - bax * h, pay - bay * h) - (ra + (rb - ra) * h);
  }
  function ellipse(x, y, cx, cy, rx, ry) {
    return (hyp((x - cx) / rx, (y - cy) / ry) - 1) * Math.min(rx, ry);
  }
  function box(x, y, cx, cy, hx, hy, r) {
    const qx = Math.abs(x - cx) - hx + r, qy = Math.abs(y - cy) - hy + r;
    return hyp(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
  }
  function smin(a, b, k) {
    const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
    return b + (a - b) * h - k * h * (1 - h);
  }
  const noise = (x, y, s) => PQ.World.vnoise(x, y, s);

  // ---- the relics; coordinates are px at scale 1, origin at the centre ----
  const KINDS = [
    {
      name: 'Femur', weight: 3, hw: 78, hh: 24, tilt: Math.PI,
      sdf(x, y) {
        const yb = y - 4 * (1 - (x / 62) * (x / 62));            // a slight bow in the shaft
        let d = capsule(x, yb, -48, 0, 48, 0, 6.5, 7);
        d = smin(d, capsule(x, y, -50, 0, -62, -7, 7, 8), 5);      // neck
        d = smin(d, circle(x, y, -65, -9, 11.5), 4);              // head
        d = smin(d, circle(x, y, -55, 8, 8), 5);                  // trochanter
        d = smin(d, box(x, y, 54, 1, 6, 12, 4), 6);
        d = smin(d, circle(x, y, 61, -6, 10.5), 5);               // condyles
        d = smin(d, circle(x, y, 62, 8, 10.5), 5);
        return Math.max(d, -ellipse(x, y, 67, 1, 3.5, 2.5));      // notch between condyles
      },
    },
    {
      name: 'Spine and ribs', weight: 2, hw: 84, hh: 74, tilt: 0.5,
      sdf(x, y) {
        let d = 1e9;
        for (let i = 0; i < 7; i++) {
          const vx = -66 + i * 21, vy = -40 + 5 * Math.sin(i * 0.7);
          if (x < vx - 16 || x > vx + 38) continue;               // too far to matter
          const L = 1.15 - Math.abs(i - 3) * 0.1;                  // middle ribs longest
          if (x < vx + 16) {
            d = Math.min(d, box(x, y, vx, vy, 9, 7, 3.5));        // vertebra
            d = smin(d, capsule(x, y, vx, vy - 5, vx + 7, vy - 21, 3.6, 1.8), 3);   // spinous process
          }
          if (x < vx - 10 || y < vy - 8) continue;
          // A rib arcs out from the spine and sweeps back as it drops.
          let r = 1e9, px = vx + 3, py = vy + 4;
          for (let k = 1; k <= 5; k++) {
            const a = 0.15 + k * 0.32, nx = vx + 3 + Math.sin(a) * 26 * L - k * 2, ny = vy + 4 + (1 - Math.cos(a)) * 40 * L + k * 8 * L;
            r = smin(r, capsule(x, y, px, py, nx, ny, 3.3 - k * 0.3, 3.3 - (k + 1) * 0.3), 2.5);
            px = nx; py = ny;
          }
          d = Math.min(d, r);
        }
        return d;
      },
    },
    {
      name: 'Canid skull', weight: 2, hw: 74, hh: 40, tilt: 0.6,
      sdf(x, y) {
        let d = ellipse(x, y, 20, -8, 40, 27);                    // braincase
        d = smin(d, circle(x, y, 52, -2, 15), 8);                 // back of the skull
        d = smin(d, capsule(x, y, -6, 0, -62, 10, 19, 8), 10);    // muzzle
        d = smin(d, capsule(x, y, 0, -34, 50, -22, 2.5, 2), 4);   // sagittal crest
        d = smin(d, capsule(x, y, -12, 10, 30, 12, 5, 4), 4);     // cheekbone
        d = Math.max(d, -circle(x, y, -6, -8, 10));               // eye socket
        d = Math.max(d, -ellipse(x, y, -64, 6, 5, 4));            // nostril
        d = Math.min(d, capsule(x, y, -46, 14, -49, 31, 4, 1.2)); // canine
        for (let i = 0; i < 5; i++) {
          const tx = -35 + i * 9;
          d = Math.min(d, capsule(x, y, tx, 15, tx + 1, i === 3 ? 26 : 22, 3.4, 1.2));
        }
        let j = capsule(x, y, -58, 31, 26, 31, 5.5, 8);           // lower jaw
        j = smin(j, capsule(x, y, 26, 31, 40, 14, 8, 7), 6);
        j = smin(j, circle(x, y, 43, 27, 6), 3);
        for (let i = 0; i < 4; i++) j = Math.min(j, capsule(x, y, -40 + i * 11, 26, -40 + i * 11, 21, 3, 1.2));
        return Math.min(d, j);
      },
    },
    {
      name: 'Ammonite', weight: 2, hw: 58, hh: 54, tilt: Math.PI,
      sdf(x, y) { return ellipse(x, y, 0, 0, 56, 52) + 1.5 * (noise(x / 5, y / 5, 11) - 0.5); },
      line(x, y) {                                               // the seam between whorls
        const r = hyp(x, y) + 0.01, th = Math.atan2(y, x);
        let f = (Math.log(r / 2.5) / 0.16 - th) / (2 * Math.PI);
        f -= Math.floor(f);
        return r > 4 && Math.min(f, 1 - f) * 2 * Math.PI * 0.16 * r < 0.8;   // ~1.6 px wide at any radius
      },
    },
    {
      name: 'Iron anchor', weight: 1, hw: 60, hh: 78, tilt: 0.9,
      sdf(x, y) {
        let d = box(x, y, 0, -2, 4.5, 46, 2);                     // shank
        d = Math.min(d, ring(x, y, 0, -60, 11, 3.5));             // ring
        d = Math.min(d, box(x, y, 0, -38, 30, 4, 2), circle(x, y, -31, -38, 5), circle(x, y, 31, -38, 5));
        d = smin(d, Math.max(ring(x, y, 0, 0, 44, 5), 12 - y), 4); // arms
        d = Math.min(d, capsule(x, y, -40, 22, -50, 3, 9, 2), capsule(x, y, 40, 22, 50, 3, 9, 2));
        return smin(d, circle(x, y, 0, 44, 7), 4);                // crown
      },
    },
    {
      name: 'Bronze gear', weight: 1, hw: 50, hh: 50, tilt: Math.PI,
      sdf(x, y) {
        const r = hyp(x, y), th = Math.atan2(y, x);
        const tooth = clamp((Math.cos(th * 12) + 0.15) * 2.2, 0, 1) * 7;
        let d = r - (39 + tooth);
        d = Math.max(d, 9 - r);                                   // axle hole
        const win = Math.max(Math.abs(r - 24) - 7.5, (Math.cos(th * 5) - 0.35) * r * 0.45);
        return Math.max(d, -win);                                  // windows between spokes
      },
      line(x, y) { const r = hyp(x, y); return Math.abs(r - 31) < 0.8 || Math.abs(r - 15) < 0.8; },   // rim and hub
    },
    {
      name: 'Amphora', weight: 1, hw: 40, hh: 70, tilt: 1.2,
      sdf(x, y) {
        let d = ellipse(x, y, 0, 8, 29, 42);
        d = smin(d, box(x, y, 0, -40, 9, 14, 3), 8);
        d = Math.min(d, box(x, y, 0, -55, 13, 3.5, 2));
        for (const s of [-1, 1]) {
          let hnd = capsule(x, y, s * 9, -48, s * 22, -46, 3, 3);
          hnd = smin(hnd, capsule(x, y, s * 22, -46, s * 26, -26, 3, 3.2), 3);
          d = smin(d, hnd, 3);
        }
        d = smin(d, capsule(x, y, 0, 46, 0, 64, 9, 4), 6);         // foot
        return Math.max(d, -(circle(x, y, 33, -8, 15) + 4 * (noise(x / 3, y / 3, 7) - 0.5)));   // broken side
      },
      line(x, y) { return Math.abs(y + 17.5) < 0.7 || Math.abs(y - 19.5) < 0.7; },   // painted bands
    },
    {
      name: 'Sword', weight: 1, hw: 94, hh: 20, tilt: Math.PI,
      sdf(x, y) {
        let d = capsule(x, y, -58, 0, 64, 0, 7, 1.2);              // blade
        d = Math.min(d, box(x, y, -62, 0, 3.5, 17, 2));            // crossguard
        d = Math.min(d, capsule(x, y, -66, 0, -82, 0, 3.2, 3.2));  // grip
        return Math.min(d, circle(x, y, -87, 0, 5.5));             // pommel
      },
      line(x, y) { return x > -55 && x < 56 && Math.abs(y) < 0.6; },   // fuller
    },
    {
      name: 'Pawprint slab', weight: 1, hw: 50, hh: 46, tilt: 0.7,
      sdf(x, y) { return box(x, y, 0, 0, 46, 42, 12) + 5 * (noise(x / 7, y / 7, 3) - 0.5); },
      line(x, y) {                                               // the paw's pads
        const pad = (cx, cy, rx, ry) => Math.abs(ellipse(x, y, cx, cy, rx, ry)) < 0.9;
        return pad(0, 14, 17, 13) || pad(-22, -10, 7, 9) || pad(-8, -23, 7, 9) || pad(8, -23, 7, 9) || pad(22, -10, 7, 9);
      },
    },
  ];
  const TOTAL = KINDS.reduce((a, k) => a + k.weight, 0);

  // Rasterise one relic into the world as line art, centred on (cx, cy), rotated by `a`,
  // scaled by `s`. Returns its bounding box.
  function stamp(w, kind, cx, cy, a, s) {
    const R = Math.ceil(hyp(kind.hw, kind.hh) * s) + 2, n = 2 * R + 1;
    const x0 = cx - R, y0 = cy - R;
    const ca = Math.cos(a), sa = Math.sin(a), LW = 1.7 * Math.max(1, s);
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (let j = 0; j < n; j++) {
      const y = y0 + j;
      if (y < 0 || y >= H) continue;
      for (let i = 0; i < n; i++) {
        const x = x0 + i;
        if (x < 0 || x >= W) continue;
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        const lx = (dx * ca + dy * sa) / s, ly = (-dx * sa + dy * ca) / s;
        const d = kind.sdf(lx, ly) * s;
        if (d >= 0 || (d < -LW && !(kind.line && kind.line(lx, ly)))) continue;
        const idx = y * W + x;
        w.cells[idx] = T.RELIC;
        w.dmg[idx] = 31;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    return { x0: minX, y0: minY, x1: maxX + 1, y1: maxY + 1 };
  }

  function overlaps(list, x0, y0, x1, y1, pad) {
    for (const r of list) {
      if (x0 < r.x1 + pad && x1 > r.x0 - pad && y0 < r.y1 + pad && y1 > r.y0 - pad) return true;
    }
    return false;
  }

  // Scatter D.RELIC_COUNT relics through the rock, clear of the start cave. Uses the world's rng stream.
  function place(w, rng) {
    const list = [];
    for (let i = 0; i < D.RELIC_COUNT; i++) {
      let pick = rng() * TOTAL, kind = KINDS[0];
      for (const k of KINDS) { pick -= k.weight; if (pick < 0) { kind = k; break; } }
      const s = 0.85 + rng() * 0.35, a = (rng() - 0.5) * 2 * kind.tilt;
      const R = Math.ceil(hyp(kind.hw, kind.hh) * s) + 2;
      for (let tries = 0; tries < 30; tries++) {
        const cx = R + 30 + Math.floor(rng() * (W - 2 * R - 60));
        const cy = R + 30 + Math.floor(rng() * (H - 2 * R - 60));
        if (PQ.World.reach(cx, cy) < 0.16 || overlaps(list, cx - R, cy - R, cx + R, cy + R, 30)) continue;
        const bb = stamp(w, kind, cx, cy, a, s);
        list.push({ name: kind.name, x0: cx - R, y0: cy - R, x1: cx + R, y1: cy + R, shape: bb });
        break;
      }
    }
    return list;
  }

  PQ.Relics = { KINDS, stamp, place };
})();

<script>
// Pixel Quarry: the simulation. Pure logic, no DOM, so it runs under Node for tests.
(function () {
  const root = typeof window !== 'undefined' ? window : globalThis;
  const PQ = root.PQ;
  const D = PQ.DATA, T = D.T, MAT = D.MAT, BALLS = D.BALLS;
  const W = D.W, H = D.H, MASK = D.TYPE_MASK, POI = D.POISON;
  const TS = Math.log2(D.TILE);
  const B = {};
  BALLS.forEach((b, i) => { B[b.key] = i; });

  // How many ownership milestones a count has passed, and the next one (or 0 when done).
  function milestone(owned) {
    let lv = 0;
    while (lv < D.MILESTONES.length && owned >= D.MILESTONES[lv]) lv++;
    return { lv, next: D.MILESTONES[lv] || 0, prev: lv ? D.MILESTONES[lv - 1] : 0 };
  }

  function newPerks() {
    const p = {};
    D.STAR_PERKS.forEach(k => { p[k.key] = 0; });
    return p;
  }
  const PERK = {};
  D.STAR_PERKS.forEach(k => { PERK[k.key] = k; });
  const perkVal = (s, key) => PERK[key].vals[s.perks[key]];

  function newState(seed) {
    const owned = {}, up = {};
    BALLS.forEach(b => { owned[b.key] = 0; up[b.key] = { dmg: 0, spd: 0, sp: 0 }; });
    owned.pebble = 1;                       // one free ball to start
    const unlocked = { pebble: true };
    return {
      v: 2, seed: seed >>> 0,
      bits: 0, earned: 0, lifetime: 0, stars: 0,
      dia: 0, diaFound: 0,                  // diamonds from upgrade pixels: held, and found this world
      journal: {},                          // story fragments found, by depth: { "0": [2, 5], ... }
      depth: 0, spent: 0, perks: newPerks(),   // depth = Golden Pixels found; spent = stars spent on perks
      cleared: 0, clearMult: 1,             // share of this world dug out; bonus earned by the last one
      owned, up, unlocked, global: { tap: 0, value: 0, radar: 0 },
      drop: { x: D.START.x, y: D.START.y }, aim: -Math.PI / 2,   // the launcher: where new balls fire from, and which way
      found: false, foundTime: 0, goldReward: 0,
      relics: [],                           // indexes of relics uncovered in this world
      playTime: 0, broken: 0, rate: 0,
      savedAt: Date.now(),
      settings: { particles: true },
      buyMode: 1,
    };
  }

  function Sim(world, state) {
    this.w = world;
    this.s = state;
    const M = D.MAX_BALLS;
    this.n = 0;
    this.bx = new Float32Array(M); this.by = new Float32Array(M);
    this.vx = new Float32Array(M); this.vy = new Float32Array(M);
    this.bt = new Uint8Array(M);
    this.cd = new Float32Array(M);
    this.pl = new Uint8Array(M);
    this.lastCell = new Int32Array(M).fill(-1);   // fog cell each ball was last in
    this.tilesX = Math.ceil(W / D.TILE);
    this.tilesY = Math.ceil(H / D.TILE);
    this.tileDirty = new Uint8Array(this.tilesX * this.tilesY).fill(1);
    this.ovDirty = new Uint8Array(this.tilesX * this.tilesY).fill(1);
    this.poison = new Int32Array(D.POISON_CAP);
    this.poisonGen = new Uint8Array(D.POISON_CAP);
    this.pn = 0;
    this.poisonT = 0;
    this.fxI = new Int32Array(256); this.fxT = new Uint8Array(256); this.fxn = 0;
    this.events = [];
    this.hist = [state.earned];
    this.src = 0;                                         // who is breaking rock right now: ball type, or TAP
    this.acc = new Float64Array(BALLS.length + 1);        // bits per source this second
    this.typeRate = new Float64Array(BALLS.length + 1);   // smoothed bits/s per source
    this.rateT = 0;
    this.rng = PQ.World.mulberry32((state.seed ^ 0x5bd1e995) >>> 0);
    this.relicSeen = new Set(state.relics || []);
    this.last = null;                                     // the final few rock pixels, once few are left
    this.arcFx = [];                                      // lightning arcs for the renderer: x0, y0, x1, y1
    this.story = storyRelics(world, state);
    this.tapping = false;
    state.cleared = Math.min(1, world.minedCount / world.solidTotal);
    this.derive();
  }

  const P = Sim.prototype;

  // Recompute every number that depends on upgrades. Call after any purchase.
  P.derive = function () {
    const s = this.s;
    const sp = key => {
      const b = BALLS[B[key]];
      return b.special.base + b.special.step * s.up[key].sp;
    };
    const TR = D.TREE;
    this.valueMult = (1 + 0.25 * s.global.value) * (1 + D.STAR_BONUS * s.stars) * (s.clearMult || 1);
    this.tDmg = BALLS.map(b => Math.round(b.dmg * Math.pow(TR.dmg.mult, s.up[b.key].dmg)));
    this.tMult = BALLS.map(b => Math.pow(D.MILESTONE_MULT, milestone(s.owned[b.key]).lv));
    this.tSpd = BALLS.map(b => b.speed * (1 + TR.spd.step * s.up[b.key].spd));
    this.pierceMax = BALLS.map(b => b.key === 'lancer' ? sp('lancer') : (b.key === 'drill' || b.key === 'seeker') ? 255 : 0);
    this.bombR = sp('bomb');
    this.venomGen = 4 + 2 * sp('venom');
    this.venomP = 0.42 + 0.03 * sp('venom');
    this.arcs = sp('spark');
    this.midas = sp('midas');
    this.steer = sp('seeker');
    this.tapDmg = Math.round(3 * Math.pow(1.6, s.global.tap));
    this.tapR = Math.min(10, 2 + Math.floor(s.global.tap / 3));
    this.discount = 1 - perkVal(s, 'cheap');
    this.offRate = D.OFFLINE_RATE + perkVal(s, 'night');
    this.offCap = D.OFFLINE_CAP + 2 * 3600 * s.perks.night;
    this.relicMult = perkVal(s, 'relic');
    this.soft = 1 / D.DEPTH.tough(this.w.depth || 0);
  };

  P.dirty = function (x, y) {
    const k = (y >> TS) * this.tilesX + (x >> TS);
    this.tileDirty[k] = 1;
    this.ovDirty[k] = 1;
  };
  // A broken pixel changes how its neighbours glow (exposed edges light up), up to 2 px away.
  P.dirtyNear = function (x, y) {
    const x0 = x < 2 ? 0 : x - 2, x1 = x > W - 3 ? W - 1 : x + 2, y0 = y < 2 ? 0 : y - 2, y1 = y > H - 3 ? H - 1 : y + 2;
    this.dirty(x0, y0); this.dirty(x1, y0); this.dirty(x0, y1); this.dirty(x1, y1);
  };

  // Lift the fog in a soft-edged circle: fully clear inside r - 4, fading out to r + 4.
  P.reveal = function (px, py, r) {
    const w = this.w, fog = w.fog, FW = w.FW, FH = w.FH;
    const cx0 = Math.max(0, Math.floor((px - r - 4) / 4)), cx1 = Math.min(FW - 1, Math.floor((px + r + 4) / 4));
    const cy0 = Math.max(0, Math.floor((py - r - 4) / 4)), cy1 = Math.min(FH - 1, Math.floor((py + r + 4) / 4));
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const k = cy * FW + cx, old = fog[k];
        if (old === 255) continue;
        const v = (r + 4 - Math.hypot(cx * 4 + 2 - px, cy * 4 + 2 - py)) * 32;
        if (v <= old) continue;
        const nv = v >= 255 ? 255 : v | 0;
        fog[k] = nv;
        // The renderer blends across cell edges, so neighbouring tiles may change too.
        this.dirty(Math.max(0, cx * 4 - 4), Math.max(0, cy * 4 - 4));
        this.dirty(Math.min(W - 1, cx * 4 + 7), Math.min(H - 1, cy * 4 + 7));
        if (old < 160 && nv >= 160 && w.relicCell[k]) this.discover(w.relicCell[k] - 1);
      }
    }
  };

  // A ball lights the rock around it. Skipped when everything in reach is already seen.
  P.revealBall = function (x, y) {
    const fog = this.w.fog, FW = this.w.FW, R = D.SIGHT;
    const at = (px, py) => {
      const cx = px < 0 ? 0 : px >= W ? (W - 1) >> 2 : px >> 2, cy = py < 0 ? 0 : py >= H ? (H - 1) >> 2 : py >> 2;
      return fog[cy * FW + cx];
    };
    const ix = x | 0, iy = y | 0;
    if (at(ix, iy) === 255 && at(ix - R, iy) === 255 && at(ix + R, iy) === 255 &&
        at(ix, iy - R) === 255 && at(ix, iy + R) === 255) return;
    this.reveal(x, y, R);
  };

  P.discover = function (i) {
    if (this.relicSeen.has(i)) return;
    this.relicSeen.add(i);
    const s = this.s;
    s.relics.push(i);
    const reward = Math.max(500, (s.rate || 0) * D.RELIC_REWARD_S) * this.relicMult;
    s.bits += reward; s.earned += reward; s.lifetime += reward;
    const frag = this.story[i];
    let fresh = false;
    if (frag >= 0) {
      const got = s.journal[s.depth] || (s.journal[s.depth] = []);
      if (!got.includes(frag)) { got.push(frag); fresh = true; }
    }
    this.events.push({ type: 'relic', i, name: this.w.relics[i].name, reward, frag: fresh ? frag : -1 });
  };

  P.spawn = function (t, x, y) {
    if (this.n >= D.MAX_BALLS) return false;
    const k = this.n++;
    this.bx[k] = x; this.by[k] = y;
    const aim = this.s.aim;
    if (t === B.lancer) {
      // Mostly along the axis nearest the aim; now and then any axis, so tunnels branch.
      const d = this.rng() < 0.7 ? (Math.round(aim / (Math.PI / 2)) & 3) : Math.floor(this.rng() * 4);
      this.vx[k] = [1, 0, -1, 0][d]; this.vy[k] = [0, 1, 0, -1][d];
    } else if (t === B.seeker && !this.s.found) {
      const g = this.w.gold, a = Math.atan2(g.y + 0.5 - y, g.x + 0.5 - x) + (this.rng() - 0.5) * 1.8 / this.steer;
      this.vx[k] = Math.cos(a); this.vy[k] = Math.sin(a);
    } else {
      const a = aim + (this.rng() - 0.5) * 1.2;
      this.vx[k] = Math.cos(a); this.vy[k] = Math.sin(a);
    }
    this.bt[k] = t;
    this.cd[k] = 0;
    this.pl[k] = this.pierceMax[t];
    this.lastCell[k] = -1;
    return true;
  };

  // Damage one cell. Returns 1 broken, 0 damaged, 2 already empty, -1 unbreakable.
  P.hit = function (x, y, amount, mult) {
    const w = this.w, i = y * W + x, t = w.cells[i] & MASK;
    if (t === 0) return 2;
    const m = MAT[t];
    if (m.hard) return -1;
    if (this.soft < 1) {                    // deeper worlds: tougher rock, rounded at random
      const a = amount * this.soft;
      amount = a | 0;
      if (this.rng() < a - amount) amount++;
      if (!amount) return 0;
    }
    const before = w.dmg[i], d = before + amount;
    if (d >= m.hp) { this.destroy(i, x, y, t, mult); return 1; }
    w.dmg[i] = d;
    if (((before * 4 / m.hp) | 0) !== ((d * 4 / m.hp) | 0)) this.dirty(x, y);
    return 0;
  };

  P.destroy = function (i, x, y, t, mult) {
    const w = this.w, s = this.s;
    w.cells[i] = 0;
    w.dmg[i] = 0;
    w.mined[i >> 3] |= 1 << (i & 7);
    w.minedCount++;
    s.cleared = Math.min(1, w.minedCount / w.solidTotal);
    const v = MAT[t].val * mult * this.valueMult * D.VALUE_SCALE;
    this.acc[this.src] += v;
    s.bits += v; s.earned += v; s.lifetime += v;
    s.broken++;
    this.dirtyNear(x, y);
    if (!this.tapping) this.reveal(x, y, 6);   // the pickaxe only works in the light, so it lights nothing
    if (w.minedCount >= w.solidTotal) this.events.push({ type: 'clear' });
    if (this.fxn < 256) { this.fxI[this.fxn] = i; this.fxT[this.fxn] = t; this.fxn++; }
    const g = w.gold;
    if (t === T.UPGRADE) {
      const n = D.UPGRADES.dia(PQ.World.reach(x, y));
      s.dia += n; s.diaFound += n;
      this.events.push({ type: 'dia', n, x, y });
    } else if (t === T.GOLD) {
      s.found = true;
      s.foundTime = s.playTime;
      s.goldReward = Math.max(5e5, s.earned * 0.5);
      s.bits += s.goldReward;
      this.events.push({ type: 'gold' });
    } else if (Math.abs(x - g.x) + Math.abs(y - g.y) === 1) {
      this.dirty(g.x, g.y);                 // the gold may now be exposed
    }
  };

  P.explode = function (cx, cy, R, amount, mult) {
    const cells = this.w.cells;
    for (let dy = -R; dy <= R; dy++) {
      const y = cy + dy;
      if (y < 0 || y >= H) continue;
      const span = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -span; dx <= span; dx++) {
        const x = cx + dx;
        if (x < 0 || x >= W || !(cells[y * W + x] & MASK)) continue;
        this.hit(x, y, amount, mult);
      }
    }
  };

  P.poisonCell = function (x, y, gen) {
    const cells = this.w.cells, i = y * W + x, c = cells[i];
    if ((c & POI) || this.pn >= D.POISON_CAP) return;
    const t = c & MASK;
    if (!t || MAT[t].hard) return;
    cells[i] = c | POI;
    this.poison[this.pn] = i;
    this.poisonGen[this.pn] = gen;
    this.pn++;
    this.dirty(x, y);
  };

  P.tickPoison = function () {
    const cells = this.w.cells, P_ = this.poison, G = this.poisonGen;
    const amt = Math.max(1, this.tDmg[B.venom]), mult = this.tMult[B.venom];
    this.src = B.venom;
    const n0 = this.pn;
    let j = 0;
    for (let q = 0; q < n0; q++) {
      const i = P_[q], g = G[q];
      if (!(cells[i] & POI)) continue;      // broken by something else
      const x = i % W, y = (i / W) | 0;
      if (this.hit(x, y, amt, mult) === 1) {
        if (g < this.venomGen) {
          if (x > 0 && this.rng() < this.venomP) this.poisonCell(x - 1, y, g + 1);
          if (x < W - 1 && this.rng() < this.venomP) this.poisonCell(x + 1, y, g + 1);
          if (y > 0 && this.rng() < this.venomP) this.poisonCell(x, y - 1, g + 1);
          if (y < H - 1 && this.rng() < this.venomP) this.poisonCell(x, y + 1, g + 1);
        }
      } else {
        P_[j] = i; G[j] = g; j++;
      }
    }
    for (let q = n0; q < this.pn; q++) { P_[j] = P_[q]; G[j] = G[q]; j++; }
    this.pn = j;
  };

  P.ballHit = function (k, t, cx, cy) {
    this.src = t;
    if (t === B.bomb && this.cd[k] <= 0) {
      this.cd[k] = D.BOMB_COOLDOWN;
      this.explode(cx, cy, this.bombR, this.tDmg[t] * 2, this.tMult[t]);
      return (this.w.cells[cy * W + cx] & MASK) === T.RELIC ? -1 : 0;
    }
    const r = this.hit(cx, cy, this.tDmg[t], (t === B.midas ? this.midas : 1) * this.tMult[t]);
    if (t === B.venom && r === 0) this.poisonCell(cx, cy, 0);
    if (t === B.spark && this.cd[k] <= 0) { this.cd[k] = D.SPARK_COOLDOWN; this.spark(cx, cy, this.tDmg[t], this.tMult[t]); }
    return r;
  };

  // Lightning: arcs jump from a hit to rock nearby and strike it.
  P.spark = function (cx, cy, amount, mult) {
    const cells = this.w.cells, R = D.SPARK_REACH;
    for (let a = 0; a < this.arcs; a++) {
      for (let tries = 0; tries < 6; tries++) {
        const ang = this.rng() * Math.PI * 2, r = 3 + this.rng() * (R - 3);
        const x = (cx + Math.cos(ang) * r) | 0, y = (cy + Math.sin(ang) * r) | 0;
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const tt = cells[y * W + x] & MASK;
        if (!tt || tt === T.RELIC) continue;
        this.hit(x, y, amount, mult);
        if (this.arcFx.length < 240) this.arcFx.push(cx + 0.5, cy + 0.5, x + 0.5, y + 0.5);
        break;
      }
    }
  };

  P.moveBalls = function (dt) {
    const cells = this.w.cells, n = this.n, rng = this.rng;
    const bx = this.bx, by = this.by, VX = this.vx, VY = this.vy, bt = this.bt, cd = this.cd, pl = this.pl;
    const seekGold = !this.s.found;
    const gx = this.w.gold.x + 0.5, gy = this.w.gold.y + 0.5;
    for (let k = 0; k < n; k++) {
      const t = bt[k];
      let x = bx[k], y = by[k], vx = VX[k], vy = VY[k];
      if (cd[k] > 0) cd[k] -= dt;
      let dist = this.tSpd[t] * dt, hits = 0;
      while (dist > 0 && hits < 3) {
        const st = dist < 0.9 ? dist : 0.9;
        dist -= st;
        let nx = x + vx * st, ny = y + vy * st;
        if (nx < 0) { nx = -nx; vx = -vx; } else if (nx >= W) { nx = 2 * W - nx - 0.01; vx = -vx; }
        if (ny < 0) { ny = -ny; vy = -vy; } else if (ny >= H) { ny = 2 * H - ny - 0.01; vy = -vy; }
        const cx = nx | 0, cy = ny | 0;
        if (!(cells[cy * W + cx] & MASK)) { x = nx; y = ny; continue; }
        hits++;
        const r = this.ballHit(k, t, cx, cy);
        if (r === 1 && pl[k] > 0) { pl[k]--; x = nx; y = ny; continue; }
        const ox = x | 0, oy = y | 0;
        if (cx !== ox && cy !== oy) {
          const sx = (cells[oy * W + cx] & MASK) !== 0, sy = (cells[cy * W + ox] & MASK) !== 0;
          if (sx && !sy) vx = -vx;
          else if (sy && !sx) vy = -vy;
          else { vx = -vx; vy = -vy; }
        } else if (cx !== ox) vx = -vx;
        else if (cy !== oy) vy = -vy;
        else {
          // Buried inside a cell. Dig out, unless it is a relic: then go home.
          if (r === -1) { x = this.s.drop.x; y = this.s.drop.y; }
          vx = -vx; vy = -vy;
        }
        pl[k] = this.pierceMax[t];
        if (t === B.lancer) {
          if (rng() < 0.2) { const tmp = vx; vx = vy; vy = -tmp; }
        } else if (t === B.seeker && seekGold) {
          // Re-aim at the gold after every bounce. Instinct narrows the spread.
          const a = Math.atan2(gy - y, gx - x) + (rng() - 0.5) * 1.8 / this.steer;
          vx = Math.cos(a); vy = Math.sin(a);
        } else {
          const a = (rng() - 0.5) * 0.3, c = Math.cos(a), sn = Math.sin(a);
          const nvx = vx * c - vy * sn;
          vy = vx * sn + vy * c; vx = nvx;
        }
      }
      bx[k] = x; by[k] = y; VX[k] = vx; VY[k] = vy;
      const cell = ((y | 0) >> 2) * this.w.FW + ((x | 0) >> 2);
      if (cell !== this.lastCell[k]) { this.lastCell[k] = cell; this.revealBall(x, y); }
    }
  };

  P.step = function (dt) {
    const s = this.s;
    s.playTime += dt;
    this.moveBalls(dt);
    this.poisonT += dt;
    while (this.poisonT >= D.POISON_TICK) { this.poisonT -= D.POISON_TICK; this.tickPoison(); }
    this.rateT += dt;
    if (this.rateT >= 1) {
      this.rateT -= 1;
      this.hist.push(s.earned);
      if (this.hist.length > 11) this.hist.shift();
      s.rate = this.hist.length > 1 ? (this.hist[this.hist.length - 1] - this.hist[0]) / (this.hist.length - 1) : 0;
      for (let i = 0; i < this.acc.length; i++) { this.typeRate[i] += (this.acc[i] - this.typeRate[i]) * 0.2; this.acc[i] = 0; }
      this.trackLast();
    }
  };

  // Lit well enough to act on: the same line a relic counts as found at.
  P.seen = function (x, y) { return this.w.fog[(y >> 2) * this.w.FW + (x >> 2)] >= 160; };

  // A tap on rock digs; a tap on open space aims the launcher at it. Both only in the light,
  // so the radar ring can't be dug out by hand through the dark.
  P.tap = function (wx, wy) {
    const x = Math.floor(wx), y = Math.floor(wy);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    if (!this.seen(x, y)) return 'dark';
    const cells = this.w.cells, t = cells[y * W + x] & MASK;
    if (t === 0) {
      const d = this.s.drop;
      if (Math.hypot(wx - d.x, wy - d.y) < 1) return 'aim';
      this.s.aim = Math.atan2(wy - d.y, wx - d.x);
      return 'aim';
    }
    if (t === T.RELIC) return 'relic';
    const R = this.tapR;
    this.src = BALLS.length;
    this.tapping = true;
    for (let dy = -R; dy <= R; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= H) continue;
      const span = Math.floor(Math.sqrt(R * R - dy * dy));
      for (let dx = -span; dx <= span; dx++) {
        const xx = x + dx;
        if (xx < 0 || xx >= W || !(cells[yy * W + xx] & MASK) || !this.seen(xx, yy)) continue;
        this.hit(xx, yy, this.tapDmg, 1);
      }
    }
    this.tapping = false;
    return 'dig';
  };

  // Holding on open, lit space moves the launcher there.
  P.moveLauncher = function (wx, wy) {
    const x = Math.floor(wx), y = Math.floor(wy);
    if (x < 0 || y < 0 || x >= W || y >= H || !this.seen(x, y) || (this.w.cells[y * W + x] & MASK)) return false;
    this.s.drop = { x: x + 0.5, y: y + 0.5 };
    return true;
  };

  // ---- clearing the world ----
  P.pixelsLeft = function () { return Math.max(0, this.w.solidTotal - this.w.minedCount); };
  // Once only a few pixels are left, find them and light them up so they can be hunted down.
  P.trackLast = function () {
    const left = this.pixelsLeft();
    if (!this.last) {
      if (left > D.CLEAR.track || !left) return;
      const cells = this.w.cells, list = [];
      for (let i = 0; i < D.N; i++) {
        const t = cells[i] & MASK;
        if (t && t !== T.RELIC) list.push(i);
      }
      this.last = list;
      for (const i of list) this.reveal(i % W + 0.5, ((i / W) | 0) + 0.5, 6);
    } else {
      const cells = this.w.cells;
      this.last = this.last.filter(i => cells[i] & MASK);
    }
  };

  // ---- shop: balls for bits ----
  P.unlocked = function (t) { return !!this.s.unlocked[BALLS[t].key]; };
  const unitCost = (b, n) => b.cost * Math.pow(1 + n / D.COST_K, D.COST_EXP);
  P.ballCost = function (t, count) {
    const b = BALLS[t], o = this.s.owned[b.key];
    let sum = 0;
    for (let i = 0; i < count; i++) sum += unitCost(b, o + i);
    return sum * this.discount;
  };
  P.maxBuy = function (t) {
    const b = BALLS[t], room = D.MAX_BALLS - this.n;
    let o = this.s.owned[b.key], left = this.s.bits, c = 0;
    while (c < room) {
      const u = unitCost(b, o) * this.discount;
      if (u > left) break;
      left -= u; o++; c++;
    }
    return c;
  };
  P.buyBall = function (t, count) {
    if (!this.unlocked(t)) return 0;
    count = Math.min(count, D.MAX_BALLS - this.n);
    if (count <= 0) return 0;
    const cost = this.ballCost(t, count);
    if (cost > this.s.bits) return 0;
    this.s.bits -= cost;
    this.s.owned[BALLS[t].key] += count;
    this.derive();
    for (let i = 0; i < count; i++) this.spawn(t, this.s.drop.x, this.s.drop.y);
    return count;
  };

  // ---- the skill tree, paid in diamonds ----
  // Nodes per ball type: 'unlock', then 'dmg', 'spd' and 'sp' (its special), each with levels.
  P.nodeKinds = function (t) { return ['unlock', 'dmg', 'spd'].concat(BALLS[t].special ? ['sp'] : []); };
  P.nodeLevel = function (t, kind) {
    return kind === 'unlock' ? (this.unlocked(t) ? 1 : 0) : this.s.up[BALLS[t].key][kind];
  };
  P.nodeMax = function (t, kind) {
    if (kind === 'unlock') return 1;
    const TR = D.TREE, b = BALLS[t];
    return kind === 'sp' ? Math.min(b.special.max, TR.sp.costs.length) : TR[kind].costs.length;
  };
  P.nodeCost = function (t, kind) {
    const lv = this.nodeLevel(t, kind);
    if (lv >= this.nodeMax(t, kind)) return Infinity;
    return kind === 'unlock' ? D.TREE.unlock[BALLS[t].key] : D.TREE[kind].costs[lv];
  };
  // Unlocking a ball type costs bits too.
  P.nodeBits = function (t, kind) {
    return kind === 'unlock' && !this.unlocked(t) ? BALLS[t].cost * D.UNLOCK_MULT * this.discount : 0;
  };
  // A node can be bought once its ball type is unlocked (or it is the unlock itself).
  P.nodeOpen = function (t, kind) { return kind === 'unlock' || this.unlocked(t); };
  P.canBuyNode = function (t, kind) {
    return this.nodeOpen(t, kind) && this.nodeCost(t, kind) <= this.s.dia && this.nodeBits(t, kind) <= this.s.bits;
  };
  P.buyNode = function (t, kind) {
    if (!this.canBuyNode(t, kind)) return false;
    const cost = this.nodeCost(t, kind), b = BALLS[t];
    this.s.dia -= cost;
    this.s.bits -= this.nodeBits(t, kind);
    if (kind === 'unlock') {
      this.s.unlocked[b.key] = true;
      if (this.n < D.MAX_BALLS) { this.s.owned[b.key]++; this.spawn(t, this.s.drop.x, this.s.drop.y); }
    } else this.s.up[b.key][kind]++;
    this.derive();
    return true;
  };

  P.upDef = key => D.UP.find(u => u.key === key);
  P.upCost = function (key) {
    const u = this.upDef(key), lvl = this.s.global[key];
    if (lvl >= u.max) return Infinity;
    return u.costs ? u.costs[lvl] : u.cost * Math.pow(u.grow, lvl);
  };
  P.buyUp = function (key) {
    const cost = this.upCost(key);
    if (cost > this.s.bits) return false;
    this.s.bits -= cost;
    this.s.global[key]++;
    this.derive();
    return true;
  };

  // ---- star perks ----
  P.perkCost = function (key) {
    const k = PERK[key], lvl = this.s.perks[key];
    return lvl >= k.costs.length ? Infinity : k.costs[lvl];
  };
  P.starsLeft = function () { return this.s.stars - this.s.spent; };
  P.buyPerk = function (key) {
    const cost = this.perkCost(key);
    if (cost > this.starsLeft()) return false;
    this.s.spent += cost;
    this.s.perks[key]++;
    if (key === 'radar') this.s.global.radar = Math.max(this.s.global.radar, perkVal(this.s, 'radar'));
    this.derive();
    return true;
  };

  // ---- radar ----
  // Distance from the gold to the nearest ball: what the radar meter reads.
  P.goldDistance = function () {
    const g = this.w.gold, gx = g.x + 0.5, gy = g.y + 0.5;
    let best = Infinity;
    for (let k = 0; k < this.n; k++) {
      const dx = this.bx[k] - gx, dy = this.by[k] - gy, d = dx * dx + dy * dy;
      if (d < best) best = d;
    }
    return Math.sqrt(best);
  };
  // The search ring for a radar level, or null. Fixed per world and level, off-centre.
  P.radarZone = function (level) {
    const r = D.RADAR.zone[Math.min(level, D.RADAR.zone.length - 1)];
    if (!r) return null;
    const g = this.w.gold, h = PQ.World.hash2;
    const a = h(level, 1, this.w.seed) * Math.PI * 2, m = Math.sqrt(h(level, 2, this.w.seed)) * 0.7 * r;
    return { x: g.x + Math.cos(a) * m, y: g.y + Math.sin(a) * m, r };
  };

  // Bits paid for time away, at a share of the last measured income.
  P.offline = function (seconds) {
    const sec = Math.min(Math.max(0, seconds), this.offCap);
    const gain = sec * (this.s.rate || 0) * this.offRate;
    this.s.bits += gain; this.s.earned += gain; this.s.lifetime += gain;
    return { seconds: sec, gain };
  };

  // ---- persistence of balls ----
  P.exportBalls = function () {
    const out = new Float32Array(this.n * 5);
    for (let k = 0; k < this.n; k++) {
      out.set([this.bx[k], this.by[k], this.vx[k], this.vy[k], this.bt[k]], k * 5);
    }
    return out;
  };
  P.importBalls = function (arr) {
    this.n = 0;
    const cells = this.w.cells;
    for (let o = 0; o + 4 < arr.length && this.n < D.MAX_BALLS; o += 5) {
      const t = arr[o + 4] | 0;
      if (t < 0 || t >= BALLS.length) continue;
      let x = arr[o], y = arr[o + 1];
      if (!(x >= 0 && x < W && y >= 0 && y < H) || (cells[(y | 0) * W + (x | 0)] & MASK) === T.RELIC) {
        x = this.s.drop.x; y = this.s.drop.y;
      }
      const k = this.n;
      this.spawn(t, x, y);
      const vx = arr[o + 2], vy = arr[o + 3], l = Math.hypot(vx, vy);
      if (l > 0.5) { this.vx[k] = vx / l; this.vy[k] = vy / l; }
    }
  };
  // Balls the player owns but that are not in the world (first start, lost save).
  P.spawnMissing = function () {
    const have = BALLS.map(() => 0);
    for (let k = 0; k < this.n; k++) have[this.bt[k]]++;
    BALLS.forEach((b, t) => {
      for (let i = have[t]; i < this.s.owned[b.key]; i++) this.spawn(t, this.s.drop.x, this.s.drop.y);
    });
  };

  // What clearing a share of a world pays on the next dig, as an income multiplier.
  function clearBonus(cleared) {
    const C = D.CLEAR;
    if (cleared >= 1) return C.full;
    return 1 + C.max * Math.max(0, (cleared - C.from) / (1 - C.from));
  }

  // State for the next world. Finding the gold pays stars and makes the next world deeper;
  // starting over without it keeps both as they were. Star perks apply here, and so does
  // the clear bonus for how much of the old world was dug out.
  function prestige(s, seed) {
    const next = newState(seed);
    next.clearMult = clearBonus(s.cleared || 0);
    next.depth = s.depth + (s.found ? 1 : 0);
    next.stars = s.stars + (s.found ? D.DEPTH.stars(s.depth) : 0);
    next.spent = s.spent;
    next.perks = Object.assign(newPerks(), s.perks);
    next.lifetime = s.lifetime;
    next.journal = s.journal || {};
    next.settings = s.settings;
    next.buyMode = s.buyMode;
    const head = perkVal(next, 'start');
    next.bits = next.earned = head;
    const keep = perkVal(next, 'tools');
    next.global.tap = Math.floor(s.global.tap * keep);
    next.global.value = Math.floor(s.global.value * keep);
    next.global.radar = perkVal(next, 'radar');
    return next;
  }

  // Which relics in this world carry a story fragment: a seeded pick of as many relics as the
  // depth's chapter has fragments. Returns fragment index per relic, or -1.
  function storyRelics(world, state) {
    const n = world.relics.length, out = new Int8Array(n).fill(-1);
    const ch = PQ.storyChapter ? PQ.storyChapter(state.depth) : null;
    if (!ch) return out;
    const order = Array.from({ length: n }, (_, i) => i), rng = PQ.World.mulberry32((world.seed ^ 0x51ed27) >>> 0);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
    for (let f = 0; f < Math.min(n, ch.fragments.length); f++) out[order[f]] = f;
    return out;
  }

  PQ.Sim = Sim;
  PQ.newState = newState;
  PQ.prestige = prestige;
  PQ.clearBonus = clearBonus;
  PQ.newPerks = newPerks;
  PQ.milestone = milestone;
  PQ.BALL = B;
})();
